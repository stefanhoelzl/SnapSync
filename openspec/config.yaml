schema: spec-driven

context: |
  SnapSync: an iOS app for sharing photos from an event (Kotlin
  Multiplatform + Compose), shipped via TestFlight.

  openspec/specs/<capability>/spec.md is the contract of record for what a
  USER can observe (see WHAT EARNS A SPEC below); the decision record —
  rationale, alternatives, trade-offs — lives in
  openspec/changes/archive/<id>/design.md. Engineering knowledge (architecture,
  testing, deployment — app and api) lives in docs/architecture.md,
  docs/testing.md and docs/deployment.md, which are explanation, not contract;
  the gates in the build are the authority for engineering rules. Project rules
  live in CLAUDE.md. Read them rather than restating them here.

  ARCHIVING — two gates, both BEFORE reporting success. They live here rather
  than in .claude/ because `openspec update` regenerates that directory and
  deletes anything written there (measured). Decision record:
  changes/archive/2026-09-25-spec-diet.

  1. Placeholder Purpose. No spec's `## Purpose` may contain the CLI's minted
     "TBD - created by archiving". Check the WHOLE tree — a placeholder from an
     earlier archive surfaces at this one.

       for f in openspec/specs/*/spec.md; do
         awk '/^## Purpose/{p=1;next} /^## /{p=0} p' "$f" \
           | grep -q "TBD - created by archiving" && echo "$f"
       done

     Anything printed: STOP, name the files, do not archive.

  2. No code identifiers. A spec names no module, class, port, function, table,
     route, file path, iOS API or error code — those are HOW. Check every spec
     your change touched:

       grep -nE '`[^`]*([A-Z][a-z]+[A-Z][A-Za-z]*|[a-z]+[A-Z][A-Za-z]*\(|/[a-z]|:[a-z]+:)[^`]*`' \
         openspec/specs/<capability>/spec.md

     Anything printed that is not a product or platform name, or the invite link
     format itself: rewrite it as the
     outcome a user observes, or move it to code/KDoc/docs. Do not archive with
     an identifier left in.

  A MODIFIED delta restates a WHOLE requirement, so it silently drops whatever
  you did not scroll to. Build each one from the current main spec and diff it —
  the removed lines must be only the ones you intended.

  WHAT EARNS A SPEC. A spec defines every outcome a user of SnapSync can observe — the
  host, a guest, a visitor of the web pages — wherever it shows up, stated from their
  side: what happens, never how. Decision record: changes/archive/2026-09-25-spec-diet.

  An outcome is observable if a user can see it, experience it, or rely on it:
  - in the app: what a screen lets them do, what is prevented, what they are told and
    when, what the app shows while it works or when something fails;
  - in their photo library: which photos arrive, with what fidelity, in which album,
    and which never arrive (a photo they deleted, their own photo coming back);
  - on the other members' devices: which of their photos the others get, when, and when
    those photos are withdrawn;
  - on the web: what an invite link shows without the app, the public site;
  - over time and without the app open: photos shared in the background, an event
    deleted at the end of its lifetime, a late guest still able to join;
  - under adverse conditions: offline, the app killed, access revoked or narrowed to a
    selection, a device locked, an outdated app, the event full or gone;
  - as promises they rely on but cannot inspect: privacy (what leaves the device, and
    when), security (who can read or write an event's photos), retention (when an event
    and its photos are deleted), and sharing guarantees (what is and is not shared, that
    a photo is never lost).
  - The one external format kept compatible across versions is also a user outcome: the
    invite link / QR. A printed QR must open in every future version.

  NOT in a spec — and where it goes instead:
  - How a screen looks (layout, visuals, exact copy)  → the code and its UI tests.
  - How anything works: modules, classes, ports, tables, routes, iOS APIs, error codes,
    algorithms, retry and timing mechanics            → the code and its KDoc.
  - Measured platform facts (what iOS actually does)  → port-contract clauses, so a
    fact that stops being true fails a test.
  - Architecture laws, testing placement, deployment and release
    (app and api)            → docs/architecture.md · docs/testing.md · docs/deployment.md.
  - The HTTP API, the device manifest, storage layout → docs/architecture.md. They are
    not user contracts: min-app-version bounds the API, and the manifest is re-derived.
  - Why an outcome is the way it is, what was rejected, what was measured, what changed
    before                                            → the change's design.md, archived.

  THE SWAP TEST. For each requirement ask: could the implementation change with no user
  observing a difference — in the app, the library, another member's device, the web,
  or what leaves the device? If yes, it does not belong in the spec. A scenario's WHEN
  may be anything that happens — a user action, a photo taken, time passing, the network
  dropping, iOS revoking access, the app being killed. Its THEN is always an outcome a
  user can observe, never a call, a state value or a row.

  SHAPE. One capability per thing a user does or gets (join an event, receive photos,
  …), never per mechanism. `## Purpose` is one paragraph: whom it serves and what it
  promises — no history, no measurements, at most one decision-record cite. An outcome
  lives in exactly ONE spec; another spec that depends on it names that capability
  instead of restating it. There is no size budget; the swap test is the budget.

  A change to an observable outcome still goes through the OpenSpec flow (user-driven,
  see CLAUDE.md). A change no user could observe — a refactor, a new mechanism, a
  platform workaround — touches no spec and needs no delta.

  MISSION (decision record: changes/archive/2026-07-21-align-specs-with-mission). SnapSync
  lets joined users easily share the photos they take during an event. Events are
  short-lived — days/weeks: celebrations, holidays, trips — with a host-declared
  date range (creator-chosen start AND end, at most 30 days apart). The end is the
  capture-date ceiling ONLY: it bounds which photos may be uploaded and closes
  nothing, so a guest who scans days late still joins and contributes their
  in-window photos. How long the event LIVES is a separate, stamped lifetime
  (30 days from max(createdAt, startsAt)); the nightly sweep deletes it then, or
  sooner once every member has left, and that IS how an event ends. A member
  shares photos taken within a chosen sub-range of the event window. Photos sync directly
  between device galleries: members never care how photos arrive, they just look
  at their own gallery. No accounts — a device UUID plus platform attestation is
  the whole identity — and setup/enrollment stay simple.

  Named future directions (not commitments; do not build for them, but do not
  deepen assumptions against them without naming it in the change): Android
  support (App Attest/APNs are the iOS bindings of platform-neutral seams);
  paid events (small events stay free; creation is the payment gate's attach
  point, capacity/duration the tier boundary); concurrent multi-event
  membership (single active membership is the CURRENT contract — switch =
  leave-then-join — while bytes, ledger keys, and backend GC are already
  event-independent).
