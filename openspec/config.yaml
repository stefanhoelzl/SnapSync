schema: spec-driven

context: |
  SnapSync: one-way iOS photo backup to S3 (Kotlin Multiplatform +
  Compose), shipped via TestFlight.

  Design source of truth is docs/design.md; project rules live in
  CLAUDE.md. Read them rather than restating them here.

  Specs are per-capability under openspec/specs/<capability>/spec.md.
  Scope a change to the capabilities it actually touches.

  Tests belong in commonTest so they run on both JVM and
  iosSimulatorArm64. :app:ios is wiring-only and untested.
