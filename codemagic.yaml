# iOS CI (capability: ios-ci). Builds the iOS simulator app on every push against the iOS 27 beta
# SDK via `xcode: edge`, and reports a status check that gates merges (branch-protection). The
# Linux-buildable work (JVM/desktop + all unit tests) stays on GitHub Actions; this runner does
# only the irreducible Apple delta: the Kotlin/Native framework link + xcodebuild.
workflows:
  ios-build:
    name: iOS simulator build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: edge          # latest Xcode beta = iOS 27 beta SDK (pin to 27.x once it reaches GM)
      java: 21             # Gradle launcher JVM; the JDK 25 toolchain is auto-provisioned by foojay
    cache:
      cache_paths:
        # Warm builds reuse the toolchain + compiled Kotlin/Native klibs (cold ~12 min -> ~3-5 min).
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'        # build on push to any branch (explicit; avoids no-match on push)
          include: true
          source: true
      cancel_previous_builds: true   # a newer push to a ref cancels its in-progress build
    scripts:
      - name: Build iOS simulator app (unsigned, build-only)
        script: |
          # The xcodebuild invocation triggers the project's "Compile Kotlin Framework" Run Script
          # phase (./gradlew :app:ios:embedAndSignAppleFrameworkForXcode), so no separate gradle
          # step is needed. No tests, no simulator boot, no signing — the build IS the gate.
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app
