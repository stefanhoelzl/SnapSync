# Tier `core` — the tested core (`:domain` less `flow/` and `compose/`, `:adapter:*`, `:ui:presentation`)
#
# A CEILING on complexity for this scope (capability `complexity-budgets`). Every number below is a
# ceiling that MAY ONLY FALL. Lowering one is ordinary work — do it in the change that makes it true.
# RAISING one requires a stated forcing proof in that change's description, naming what the platform,
# the language, or the shape of the problem makes unavoidable. There is no check that enforces this:
# it is a ratchet carried by this paragraph and by review, and it is deliberately NOT a proof. The
# gate beside it, `detektAppShell`, is a proof; this is not, and the two must not be confused.
#
# HOW TO READ A NUMBER. detekt's `threshold` is the first value that FAILS, so a ceiling reads one
# above the largest value this scope tolerates. `ReturnCount.max` and `MaxLineLength.maxLineLength`
# are the opposite — they are the largest tolerated value itself.
#
# HOW THESE NUMBERS WERE SEEDED. Each is the tightest value this scope passed on the day the gate
# landed — EXCEPT where that value fell below detekt's own default. There, the default is used
# instead, because a ceiling tighter than the tool's default is a claim, and a claim has to be
# argued rather than measured: `:ui:*` tolerates only ~15-line classes because Compose has almost no
# classes, not because anyone decided that. The exceptions are the scopes that DO carry a claim —
# the shells, `flow/` and `compose/` — where tightness on the DECISION measures (cyclomatic,
# cognitive, `ComplexCondition`, `NestedBlockDepth`, `ReturnCount`) restates a written law, while
# the SIZE measures (`LongMethod`, `LargeClass`, `TooManyFunctions`, `MaxLineLength`) stay at the
# default because length is not a decision.
#
# `NestedBlockDepth` and `LargeClass` report no measured value in their findings, so their ceilings
# were found by BINARY SEARCH at 10-line granularity rather than read off a report. Treat them as
# search results: re-derive rather than adjust.
#
# THE ANALYSER LAGS THE LANGUAGE. detekt 1.23.8 — the latest stable — parses with
# `kotlin-compiler-embeddable` 2.0.21, while this repo is on Kotlin 2.4.0 (`gradle/libs.versions.toml`).
# All source parses today, verified when this gate landed, but syntax introduced after Kotlin 2.0 may
# not. detekt 2.0.0-alpha.6 embeds Kotlin 2.4.10 and would erase the lag; it is an alpha and this gate
# runs in everyone's `./gradlew build`, so it was not adopted. EXPIRY: revisit when detekt 2.0 reaches
# stable, or at the first parse failure on newer syntax — whichever comes first.
#
# WHAT THIS TIER IS FOR. The code that carries the rules. `:ui:presentation` belongs here and not in
# `ui` because the presentation-imports gate keeps it Compose-free, so none of Compose's structural
# inflation applies to it. `flow/` and `compose/` are carved out into their own tiers: they carry a
# decision-free law this scope does not.
#
# These ceilings are the ones most expected to FALL. `UploadCycle.run` sets the cyclomatic number at
# 19 on its own.
#
# `buildUponDefaultConfig` is TRUE for the tier tasks (unlike `app-shell.yml`, which is a complete
# statement of five rules). Listing all ~60 rules in eight files is not maintainable; the cost is that
# a detekt upgrade activating a new rule starts firing here. That failure lands in the upgrade PR,
# which is where you want to see it — the version is pinned, so an upgrade is always deliberate.

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 19
  CognitiveComplexMethod:
    active: true
    threshold: 37
  LongMethod:
    active: true
    threshold: 83
  LongParameterList:
    active: true
    functionThreshold: 15
    constructorThreshold: 15
  ComplexCondition:
    active: true
    threshold: 5
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 26
    thresholdInClasses: 26
    thresholdInInterfaces: 26
    thresholdInObjects: 26
    thresholdInEnums: 26
  LargeClass:
    # Default. The largest class here is ~275 lines; pinning 280 would assert a size limit on
    # `:domain` types that no module law states.
    active: true
    threshold: 600
style:
  ReturnCount:
    active: true
    max: 12
  MaxLineLength:
    active: true
    maxLineLength: 146
  MagicNumber:
    # REGISTER — 30 sites, mostly retry counts, byte sizes and time constants in the adapters.
    active: false
  LoopWithTooManyJumpStatements:
    # REGISTER — 4 sites.
    active: false
  UnusedPrivateMember:
    # REGISTER — 1 site.
    active: false
  DestructuringDeclarationWithTooManyEntries:
    # REGISTER — 1 site.
    active: false
exceptions:
  TooGenericExceptionCaught:
    # REGISTER — 9 sites. Every one is a port implementation converting an unknown platform
    # failure into a sealed domain error, which is the project's stated error strategy ("errors
    # are reduced into state"). This register entry is the likeliest of all of them to become
    # permanent, and would then be better stated as a rule-level exemption with that argument.
    active: false
naming:
  FunctionNaming:
    active: true
    # `excludes: []` overrides detekt's default `**/test/**` path exclusions. In this repo `test/`
    # is a MODULE prefix, not a source-set marker, so the default would silently switch this rule
    # off for `:test:world` and friends — the vacuous pass this capability exists to prevent.
    excludes: ['**/feature/status/LedgerBackedSyncStatusSource.kt']
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # REGISTER — 5 sites.
    active: false
comments:
  active: false
