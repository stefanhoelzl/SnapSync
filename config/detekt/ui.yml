# Tier `ui` — Compose (`:ui:components`, `:ui:screens`)
#
# THIS FILE HOLDS THE ONE RULE THIS SCOPE HAS NOT REACHED, AND NOTHING ELSE. Everything not written here
# comes from `config/detekt/_base.yml` at detekt's own defaults — the tier arrived there on NINE of its
# ten rules, and each of those left this file as it did.
#
# The number below is a ceiling that MAY ONLY FALL. Lowering it is ordinary work; RAISING it requires a
# stated forcing proof in the change that raises it. Nothing enforces that — it is a ratchet carried by
# this paragraph and by review (capability `complexity-budgets`).
#
# WHY THIS ONE REMAINS. `LongParameterList` is fixed by bundling, and a bundle is itself a constructor
# whose fields detekt counts. `StatusActions` was created to fix exactly this rule on `StatusScreen`
# (26 parameters down to 9) and trips it with its own 18 fields — it is what sets the number today.
# This paragraph used to conclude "the recursion has no base case", which was false, and false in the
# direction that excused the debt: it recurses forever only if each bundle is FLAT. A bundle of bundles
# has as many fields as it has GROUPS, so nesting terminates. `ReadyActions` carries three fields for
# eleven callbacks. `StatusActions` would fall to about six the same way — join, joined, access, switch,
# create, diagnostics — at the cost of `actions.join.onRetryJoin` at every call site, which is a taste
# judgement and not a complexity argument.
#
# What is NOT reachable is detekt's default of 6. Most of the remaining sites are leaf design-system
# components at 6-8 parameters, where Compose's own APIs routinely exceed six and a wrapper makes every
# call site worse. That tail is the reason this file still exists.
#
# HOW THE OTHER TWO LEFT, AND WHY IT IS WRITTEN DOWN. `CyclomaticComplexMethod` sat at 19 against a
# default of 15, and `LongMethod` at 169 against 60. Both are gone, and neither went by grinding.
#
# This file argued FIVE times that what remained was irreducible declarative layout — that a composable
# is a long declarative expression and length is what Compose is. Every one of those times, the length
# was a signal and the argument was wrong:
#
#   * `JoiningEventScreen` ran TWO `when`s over one seven-case sealed type ninety lines apart, plus an
#     early return handling an eighth case a third way. 163 statements.
#   * `ReconfigureScreen` re-derived what the join gate already derived — the same ten values under
#     different names. 142.
#   * `StatusScreen` spelled `joined && !reconfigureActive` out three times.
#   * The two date pickers were the same dialog written twice, sharing a popup card, heading, month
#     header, weekday strip and button row verbatim. `StatusBody` was a six-branch dispatcher holding
#     two more duplications.
#   * The join gate and the reconfigure surface rendered the SAME participation surface, with nine string
#     literals identical character for character — and then held the same seven `var`s and rebuilt the
#     same two holders from them, about twenty lines each. That is a state holder with two copies.
#
# And where there was no duplication at all, there were independent COMPONENTS: four overlays belonging
# to four capabilities in one function; a nav label carrying a hidden gesture beside a heading that must
# be a control; scroll arithmetic interleaved with row rendering; one group per range handle; an app's
# single navigation decision buried inside its chrome.
#
# So the honest rule is: a long composable is not self-evidently Compose being Compose. Ask what is
# duplicated, what is an independent component, and what has too many responsibilities — and only then,
# if all three come back empty, conclude it is the language. This file reached that conclusion five times
# too early.
#
complexity:

  LongParameterList:
    # `StatusActions`, the screen-level callback bundle, at 18 fields. Down from 30, where `ReadyLayout`
    # (29) had sat: that surface interleaved each value with its own callback, pair by pair, and now takes
    # `(state, actions)` — the ordinary Compose shape it should have had. `AppRangePresetChoices` (13) fell
    # out with it, onto the same `RangeChoices`/`RangeChoiceActions`/`RangeWindow` holders, so the design
    # system and both screens now name that quartet once.
    #
    # WHICH CORRECTS THIS FILE. The note here used to say bundling "has no base case" — bundle 26
    # parameters and you get a 26-field constructor, as `StatusActions` demonstrates. That is true only of
    # FLAT bundling. A bundle of bundles has as many fields as it has GROUPS, so nesting terminates:
    # `ReadyActions` carries seven fields for ten callbacks because four of them travel inside the design
    # system's own holder. The claim was wrong, and it was wrong in the direction that excused the debt.
    #
    # What remains is genuinely two populations. `StatusActions` (18) is the recursion's real residue and
    # would fall to about six by the same nesting — join, joined, access, switch, create, diagnostics — if
    # the call-site noise (`actions.join.onRetryJoin`) is judged worth it. The other twenty-odd sites are
    # leaf design-system components at 6-8 parameters, where Compose's own APIs routinely exceed six and a
    # wrapper makes every call site worse. Six is not reachable; that tail is the reason.
    active: true
    functionThreshold: 19
    constructorThreshold: 19
