# Tier `ui` — Compose (`:ui:components`, `:ui:screens`)
#
# THIS FILE HOLDS THE THREE RULES THIS SCOPE CANNOT REACH, AND NOTHING ELSE. Everything not written
# here comes from `config/detekt/_base.yml` at detekt's own defaults — the tier arrived there on seven
# of its ten rules, and each of those left this file as it did.
#
# Every number below is a ceiling that MAY ONLY FALL. Lowering one is ordinary work; RAISING one
# requires a stated forcing proof in the change that raises it. Nothing enforces that — it is a ratchet
# carried by this paragraph and by review (capability `complexity-budgets`).
#
# WHY THESE THREE REMAIN. Not effort: each was worked and each is structural. The three trade against
# one another, which is the finding — the fix for any one of them is the cause of another:
#
#   * Satisfying `LongParameterList` means bundling parameters, and a bundle is itself a constructor
#     whose fields detekt counts. `StatusActions` was created by this change to fix exactly this rule
#     on `StatusScreen` (26 parameters down to 9) and trips it with its own 18 fields. The recursion has
#     no base case. Fourteen of the remaining sites are leaf design-system components at 6-8 parameters,
#     where Compose's own APIs routinely exceed six and a wrapper makes call sites worse.
#
#   * Satisfying `LongMethod` means extracting composables, and each extraction is a new function with a
#     new parameter list. Measured on `StatusScreen`: two genuine extractions took it from 138
#     statements to 71, and over the same two steps the TIER's totals rose — `LongMethod` 10 to 11 and
#     `LongParameterList` 20 to 21. A composable is a long declarative expression; length is what
#     Compose is.
#
#   * Satisfying `CyclomaticComplexMethod` past this point means splitting `when` dispatchers over
#     sealed UI states. The tractable part was done and it was worth doing — `JoiningEventScreen` 35 to
#     16, `ReconfigureScreen` 28 to 17, `StatusScreen` 30 to 18 — via four changes that stand on their
#     own merits: grouping the overlays, naming the joined action cluster, lifting the join gate's pure
#     derivation out of its rendering, and deduplicating the range-resolution rules the reconfigure
#     surface had been spelling out a second time. What is left is 1-3 points per screen, and buying
#     those means inventing functions to hold fragments of a dispatch.
#
# So the honest statement is that these three numbers describe Compose, not this codebase's discipline —
# and unlike a deviation that hides debt, this one is three lines long and says which is which.

complexity:
  CyclomaticComplexMethod:
    # `StatusScreen` 18, `ReconfigureScreen` 17, `JoiningEventScreen` 16 — each a dispatcher over a
    # sealed UI state. Down from 36 when the tier was seeded.
    active: true
    threshold: 19

  LongMethod:
    # `JoiningEventScreen`'s layout body. Down from 169 at seeding.
    active: true
    threshold: 164

  LongParameterList:
    # `ReadyLayout`, the join gate's decision surface. Down from 30 at seeding only in what it counts:
    # `StatusScreen` itself fell from 26 parameters to 9 (see `StatusActions`).
    active: true
    functionThreshold: 30
    constructorThreshold: 30
