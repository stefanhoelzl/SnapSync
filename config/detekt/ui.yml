# Tier `ui` — Compose (`:ui:components`, `:ui:screens`)
#
# THIS FILE HOLDS THE TWO RULES THIS SCOPE CANNOT REACH, AND NOTHING ELSE. Everything not written here
# comes from `config/detekt/_base.yml` at detekt's own defaults — the tier arrived there on eight of its
# ten rules, and each of those left this file as it did. `CyclomaticComplexMethod` was the eighth and the
# only one of the three that ever looked reachable; the note at the foot of this header records
# what it took, because "we got there" is worth less than "here is what the road was".
#
# Every number below is a ceiling that MAY ONLY FALL. Lowering one is ordinary work; RAISING one
# requires a stated forcing proof in the change that raises it. Nothing enforces that — it is a ratchet
# carried by this paragraph and by review (capability `complexity-budgets`).
#
# WHY THESE TWO REMAIN. Not effort: each was worked and each is structural. They trade against one
# another, which is the finding — the fix for one is the cause of the other:
#
#   * Satisfying `LongParameterList` means bundling parameters, and a bundle is itself a constructor
#     whose fields detekt counts. `StatusActions` was created by this change to fix exactly this rule
#     on `StatusScreen` (26 parameters down to 9) and trips it with its own 18 fields. The recursion has
#     no base case. Fourteen of the remaining sites are leaf design-system components at 6-8 parameters,
#     where Compose's own APIs routinely exceed six and a wrapper makes call sites worse.
#
#   * Satisfying `LongMethod` means extracting composables, and each extraction is a new function with a
#     new parameter list — but WHAT you extract decides whether that trade bites, and the first draft of
#     this paragraph missed the distinction. Extracting a LAYOUT's sections is expensive, because each
#     section needs the state around it: measured on `StatusScreen`, two genuine extractions took it from
#     138 statements to 71 while the TIER's totals ROSE — `LongMethod` 10 to 11, `LongParameterList` 20
#     to 21. Extracting a DISPATCHER's branches is cheap, because a branch closes over almost nothing:
#     measured on `JoiningEventScreen`, seven phase composables of nought-to-three parameters each took
#     it from 163 statements to 77 and cyclomatic 16 to under detekt's default, and the tier's
#     `LongParameterList` count did not move at all (23 before, 23 after). It moved a THIRD number the
#     first two bullets do not mention — seven new functions took that file over `TooManyFunctions`'s
#     default of 11 — and the answer was to split the file, not to open a fourth deviation here. That is
#     the difference between a trade and a debt: a file holding two surfaces was always two files.
#     What remains above is the expensive kind. A composable is a long declarative expression; length is
#     what Compose is.
#
# HOW THE THIRD RULE LEFT. `CyclomaticComplexMethod` sat here at 19 against detekt's default of 15, and
# the note that used to occupy this space said what was left was "1-3 points per screen" bought only by
# "inventing functions to hold fragments of a dispatch". That was wrong about the remedy, and the three
# screens each needed a DIFFERENT one:
#
#   * `JoiningEventScreen` (16) ran TWO `when`s over the same seven-case sealed type ninety lines apart —
#     one for each phase's body, one for its actions — plus an early return handling an eighth case a
#     third way. Giving each phase one composable that states both halves collapsed them into a single
#     dispatcher and dissolved the early return with them.
#
#   * `ReconfigureScreen` (17) re-derived what the join gate already derived. Both surfaces produce the
#     same ten values — `minPhotoDate`/`saveEnabled` were `chosenFrom`/`commitEnabled` under other names —
#     so they now share one type and one resolver, each keeping only the window derivation that genuinely
#     differs between them.
#
#   * `StatusScreen` (18) spelled `joined && !reconfigureActive` out three times and `membership != null`
#     twice more. Naming that fact once, as a value carrying the membership rather than a flag, also
#     retired a `!!` whose safety had been argued in a comment.
#
# None of the three was a fragment of a dispatch. Each was a real duplication or a real conflation that
# the number had been pointing at all along — which is the argument for keeping a rule at the default and
# the reason the two below are stated as structure rather than as debt.
#
# So the honest statement is that these two numbers describe Compose, not this codebase's discipline —
# and unlike a deviation that hides debt, this one is two lines long and says which is which.

complexity:
  LongMethod:
    # `ReconfigureScreen`'s layout body, now that its state and derivation have left it. Down from 169 at
    # seeding, from 164 when `JoiningEventScreen` (163) stopped being the binding site, and from 143 as
    # the same screen shed 142 -> 132 — see the second bullet above.
    #
    # THIS NUMBER IS NOT A TARGET, and the clearest evidence is a pass that moved it not at all. Two
    # picker dialogs were the same dialog written twice (`DateTimePickerDialog` 82, its range variant 111,
    # sharing a popup card, heading, month header, weekday strip and button row verbatim); `StatusBody`
    # (112) was a six-branch dispatcher containing two more duplications of its own. Removing all of it
    # took eleven sites over the default down to nine — two vanished entirely — and left this ceiling at
    # 133, because the binding site is none of them. What sets the number is the flat declarative layout
    # the second bullet describes, so the number rewards exactly the extraction that makes the code worse
    # and is blind to the duplication that made it worse already. Read the LIST, not the maximum.
    active: true
    threshold: 133

  LongParameterList:
    # `ReadyLayout`, the join gate's decision surface. Down from 30 at seeding only in what it counts:
    # `StatusScreen` itself fell from 26 parameters to 9 (see `StatusActions`).
    active: true
    functionThreshold: 30
    constructorThreshold: 30
