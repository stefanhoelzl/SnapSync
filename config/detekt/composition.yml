# The `composition` tier (`QualityPlugin`): the composition layer, `:core:composition:*` (`docs/architecture.md`,
# "The composition layer").
#
# A CLAIM, not debt, like `entrypoints.yml`: these numbers were written with the code. The layer is wiring only — graph
# classes of `val`s built by constructor calls and one straight-line composing function per process
# (`CompositionIsWiringTest`) — so no function here branches at all: a cyclomatic complexity of 1 and a cognitive one of
# 0 are the whole of it. A function that needs more holds a decision, and a decision is the layers'.
complexity:
  CyclomaticComplexMethod:
    threshold: 2
  CognitiveComplexMethod:
    threshold: 1
  LongParameterList:
    # A SIZE measure, not a decision: the upload graph takes each piece a process builds its own way (`UploadGraph`),
    # and a process's port bundle names every port it has (`AppDevicePorts`: 25). 17 → 26 in phase 5, when the app's
    # bundles moved in from `compose/` (whose tier carried 47 for them, and is gone): FORCING — a bundle has no
    # defaults, so every root fails to compile until it answers each port, and the extension's bundles are flat the
    # same way; grouping the ports into sub-bundles only to pass this count would add a layer no reader needs.
    constructorThreshold: 26
