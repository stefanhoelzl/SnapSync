# The `presentation` tier (`DetektTiersPlugin`): `:domain:presentation`, the reduction into the screen's state.
#
# A CLAIM, not debt (`docs/architecture.md`, "The core and its layers"): presentation reduces what the queries read into
# `UiState`, one concern per file — a health ladder of rungs, a layer per world, a flow per surface — so a function
# stays at most 4 paths and 4 cognitive points. A function that needs more is two concerns. It is Compose-free, so
# none of Compose's structural inflation applies to it. detekt fails AT the threshold, so each is one above the claim:
# do not "correct" it.
# Every other number starts at the core tier's, which this module met while it was part of it.
complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 5
  CognitiveComplexMethod:
    active: true
    threshold: 5
  LongMethod:
    active: true
    threshold: 83
  LongParameterList:
    active: true
    functionThreshold: 15
    constructorThreshold: 15
  ComplexCondition:
    active: true
    threshold: 5
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 26
    thresholdInClasses: 26
    thresholdInInterfaces: 26
    thresholdInObjects: 26
    thresholdInEnums: 26
  LargeClass:
    # Default. The largest class here is ~275 lines; pinning 280 would assert a size limit on
    # `:domain` types that no module law states.
    active: true
    threshold: 600
style:
  ReturnCount:
    active: true
    max: 12
  MaxLineLength:
    active: true
    maxLineLength: 146
  MagicNumber:
    # REGISTER — 30 sites, mostly retry counts, byte sizes and time constants in the adapters.
    active: false
  LoopWithTooManyJumpStatements:
    # REGISTER — 4 sites.
    active: false
  UnusedPrivateMember:
    # REGISTER — 1 site.
    active: false
  DestructuringDeclarationWithTooManyEntries:
    # REGISTER — 1 site.
    active: false
exceptions:
  TooGenericExceptionCaught:
    # REGISTER — 9 sites. Every one is a port implementation converting an unknown platform
    # failure into a sealed domain error, which is the project's stated error strategy ("errors
    # are reduced into state"). This register entry is the likeliest of all of them to become
    # permanent, and would then be better stated as a rule-level exemption with that argument.
    active: false
naming:
  FunctionNaming:
    active: true
    # `excludes: []` overrides detekt's default `**/test/**` path exclusions. In this repo `test/`
    # is a MODULE prefix, not a source-set marker, so the default would silently switch this rule
    # off for `:test:rig` and friends — the vacuous pass this capability exists to prevent.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # REGISTER — 5 sites.
    active: false
comments:
  active: false
