# Tier `compose` — the shared compositions (`:domain` `compose/`)
#
# A CEILING on complexity for this scope (capability `complexity-budgets`). Every number below is a
# ceiling that MAY ONLY FALL. Lowering one is ordinary work — do it in the change that makes it true.
# RAISING one requires a stated forcing proof in that change's description, naming what the platform,
# the language, or the shape of the problem makes unavoidable. There is no check that enforces this:
# it is a ratchet carried by this paragraph and by review, and it is deliberately NOT a proof. The
# gate beside it, `detektAppShell`, is a proof; this is not, and the two must not be confused.
#
# HOW TO READ A NUMBER. detekt's `threshold` is the first value that FAILS, so a ceiling reads one
# above the largest value this scope tolerates. `ReturnCount.max` and `MaxLineLength.maxLineLength`
# are the opposite — they are the largest tolerated value itself.
#
# HOW THESE NUMBERS WERE SEEDED. Each is the tightest value this scope passed on the day the gate
# landed — EXCEPT where that value fell below detekt's own default. There, the default is used
# instead, because a ceiling tighter than the tool's default is a claim, and a claim has to be
# argued rather than measured: `:ui:*` tolerates only ~15-line classes because Compose has almost no
# classes, not because anyone decided that. The exceptions are the scopes that DO carry a claim —
# the shells, `flow/` and `compose/` — where tightness on the DECISION measures (cyclomatic,
# cognitive, `ComplexCondition`, `NestedBlockDepth`, `ReturnCount`) restates a written law, while
# the SIZE measures (`LongMethod`, `LargeClass`, `TooManyFunctions`, `MaxLineLength`) stay at the
# default because length is not a decision.
#
# `NestedBlockDepth` and `LargeClass` report no measured value in their findings, so their ceilings
# were found by BINARY SEARCH at 10-line granularity rather than read off a report. Treat them as
# search results: re-derive rather than adjust.
#
# THE ANALYSER LAGS THE LANGUAGE. detekt 1.23.8 — the latest stable — parses with
# `kotlin-compiler-embeddable` 2.0.21, while this repo is on Kotlin 2.4.0 (`gradle/libs.versions.toml`).
# All source parses today, verified when this gate landed, but syntax introduced after Kotlin 2.0 may
# not. detekt 2.0.0-alpha.6 embeds Kotlin 2.4.10 and would erase the lag; it is an alpha and this gate
# runs in everyone's `./gradlew build`, so it was not adopted. EXPIRY: revisit when detekt 2.0 reaches
# stable, or at the first parse failure on newer syntax — whichever comes first.
#
# WHAT THIS TIER IS FOR. The same kind of claim as `flow/`, at a weaker strength. `snapSyncApp` and
# `uploadCore` are wiring — but `resolveUploadMechanism` is re-evaluated per transition, so a
# composition here genuinely DOES decide something. Its ceiling is therefore seeded from measurement
# and NO TARGET IS CLAIMED: unlike `flow/`, the honest end state is not known to be 2.
#
# Configured the same way as `flow/` so the two read side by side: decision measures tight, size
# measures at detekt's default.
#
# `AppPorts`' 46 constructor parameters live here, which is what sets `LongParameterList` at 47. That
# number falls when `AppPorts` is split into cohesive sub-bundles — a later change, and the reason
# `core`'s parameter ceiling is already 15 rather than 47.
#
# WHAT SETS THE TWO NUMBERS THAT MOVED LAST, so the next reader knows where the slack is not.
# `CyclomaticComplexMethod` is pinned at 9 by `UploadCore.kt`'s `readGate` (measured 8) and by nothing
# else — the next-highest in the zone is 6. So this ceiling does NOT fall by moving more wiring out of
# `SnapSyncApp.kt`; it falls only when the cycle gate's exception-classification policy moves, and that
# policy is deliberately staying — it is the one piece of logic here the world harness and the
# fake-backed runs drive directly, at 93% coverage, which is what makes it the counterexample: the rest
# of this zone's logic was worth moving because it was unREACHABLE by any test, not because it was
# logic. `LargeClass` measures `AppCore`, and was re-derived by binary search at 10-line granularity
# when it gave up its mechanism table, its selection-scope derivation and its lane default. Most of the
# 600 → 390 drop was slack accumulated since the seed rather than what one change bought — a ceiling is
# only honest while someone re-measures it.
#
# Moving the status-refresh RULE out afterwards did NOT move this number, and the reason is worth
# knowing before anyone tries again: the wiring that replaces a body, plus the KDoc explaining why it
# moved, costs about what the body did. `LargeClass` counts lines, so relocating a decision is close to
# size-neutral here — it buys testability, not bytes. This ceiling falls when `AppPorts` is split (see
# above) or when whole subsystems leave, not one rule at a time.
#
# RAISED 390 -> 400 by `device-speaks-v2`, which is a ceiling going the wrong way and therefore owes a
# forcing proof. Here it is. The 390 search left `AppCore` measuring 389 — ONE line of slack — and the
# `min-app-version` capability needs exactly TWO lines in this class: `val versionGate: AppVersionGate`,
# which is the same shape as the `creationStatus`/`renameStatus` read-models beside it, and one
# `openLink` binding in the block where every user command is bound. Neither is reducible: a read-model
# the shell must reach has to be constructed where the graph is, and a command has to be bound with the
# other commands. That change moved what it COULD move out (the join-outcome mapping went to
# `feature/membership` as `toCommit()`, testable there and not here) and still needed two lines.
#
# So this is not slack being reclaimed — it is the observation that a ceiling with one line of headroom
# blocks the next capability whatever that capability is, which makes it a ceiling on the composition
# rather than on complexity. 400 is the next 10-line search step, restoring ~9 lines of headroom.
# ⏰ Re-derive it at the next binary search rather than treating 400 as measured: it is a granularity
# boundary, not a measurement, exactly as 390 was.
#
# `buildUponDefaultConfig` is TRUE for the tier tasks (unlike `app-shell.yml`, which is a complete
# statement of five rules). Listing all ~60 rules in eight files is not maintainable; the cost is that
# a detekt upgrade activating a new rule starts firing here. That failure lands in the upgrade PR,
# which is where you want to see it — the version is pinned, so an upgrade is always deliberate.

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 9
  CognitiveComplexMethod:
    active: true
    threshold: 6
  ComplexCondition:
    active: true
    threshold: 2
  NestedBlockDepth:
    active: true
    threshold: 3
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 47
    constructorThreshold: 47
  LargeClass:
    active: true
    threshold: 400
style:
  ReturnCount:
    active: true
    max: 1
  MaxLineLength:
    active: true
    maxLineLength: 120
  MagicNumber:
    active: true
naming:
  FunctionNaming:
    active: true
    excludes: []
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # REGISTER — 1 site.
    active: false
comments:
  active: false
