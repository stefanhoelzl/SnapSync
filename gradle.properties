# iOS/macOS-only Kotlin/Native tasks (e.g. iosSimulatorArm64Test) cannot run on the Linux CI
# host; they build on macOS (GitHub Actions macos-26). Silence the per-configuration "target
# disabled" warning so the Linux build output stays clean — the targets are intentionally
# macOS-only here.
kotlin.native.ignoreDisabledTargets=true

# Pin the Gradle/Kotlin heap. Linking the Compose/Skiko iOS framework
# (linkDebugFrameworkIosSimulatorArm64) runs the Kotlin/Native IR compiler in the Gradle daemon
# JVM; the default ~512m heap OOMs on GitHub's ~7 GB macos-26 runners. Codemagic set a heap
# implicitly via its machine env — GitHub Actions does not — so we pin it here to make the build
# independent of the CI provider. 4g matches the Compose Multiplatform template default.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# The event link's domain (capability `event-link`). This is the ONE source for the app side: it is
# generated into `:capability:config`'s `LINK_ORIGIN` and read by `Config.xcconfig` for the app's
# `applinks:` entitlement. The backend serves the matching AASA from its own constant, which nothing
# here can reach (`backend/` is a Deno tree deployed by a separate, path-scoped workflow that ships
# code only) — a `:test:architecture` guard asserts the two agree, because drift is SILENT: iOS simply
# declines to match the link and every invite opens a browser instead of the app.
snapsync.domain=snapsync.stho.net

# Enable the Gradle build cache so config-agnostic compile tasks (e.g. the iosArm64 klib
# compiles) can be restored instead of re-run. On CI, gradle/actions/setup-gradle persists the
# cache and (by its default) only WRITES it from the default branch — so feature-branch runs
# restore main's cache but do not save their own. That is intentional: the on-demand Debug IPA
# loop (below) relies on the Debug framework link for its speedup, not on run-to-run cache
# accumulation, and keeping writes main-only avoids churning the shared 10 GB cache budget.
org.gradle.caching=true
