# iOS/macOS-only Kotlin/Native tasks (e.g. iosSimulatorArm64Test) cannot run on the Linux CI
# host; they build on macOS (GitHub Actions macos-26). Silence the per-configuration "target
# disabled" warning so the Linux build output stays clean — the targets are intentionally
# macOS-only here.
kotlin.native.ignoreDisabledTargets=true

# Pin the Gradle/Kotlin heap. Linking the Compose/Skiko iOS framework
# (linkDebugFrameworkIosSimulatorArm64) runs the Kotlin/Native IR compiler in the Gradle daemon
# JVM; the default ~512m heap OOMs on GitHub's ~7 GB macos-26 runners. Codemagic set a heap
# implicitly via its machine env — GitHub Actions does not — so we pin it here to make the build
# independent of the CI provider. 4g matches the Compose Multiplatform template default.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# WHICH DEPLOYMENT this build targets (`docs/deployment.md`). It names a file in
# `deployments/`, never a value — so it cannot drift from anything, and a wrong name fails closed
# (the resolver exits naming it) rather than silently building against the wrong backend.
#
# The event link's domain, the Apple team and bundle ids, and the compile-time upload host are all
# GENERATED from the resolved deployment now: `LINK_ORIGIN` by :domain's generateLinkOrigin task, and
# the xcconfig values by the resolver itself. They used to be a literal here plus copies in
# Config.xcconfig and api/src/config.ts that a :test:architecture guard held together; agreement is
# constructed rather than asserted, and the guard is reduced to a staleness check.
#
# Override for a build that targets a different backend:  ./gradlew build -Psnapsync.deployment=local
snapsync.deployment=prod

# Enable the Gradle build cache so config-agnostic compile tasks (e.g. the iosArm64 klib
# compiles) can be restored instead of re-run. On CI, gradle/actions/setup-gradle persists the
# cache and (by its default) only WRITES it from the default branch — so feature-branch runs
# restore main's cache but do not save their own. That is intentional: the on-demand Debug IPA
# loop (below) relies on the Debug framework link for its speedup, not on run-to-run cache
# accumulation, and keeping writes main-only avoids churning the shared 10 GB cache budget.
org.gradle.caching=true

# Kotlin/Native incremental linking: a Debug framework or test executable keeps a native cache per module
# (build/kotlin-native-ic-cache), so a change re-links only what it touched plus a short final link. It applies to
# DEBUG binaries only — a Release framework, everything TestFlight and the stores get, is linked exactly as without
# it. Measured in `ios` on a PR changing one mid-graph module, the cache restored from main: the app and
# extension framework links 4.8 → 2.2 min. Still marked experimental by Kotlin; a wrong Debug link would fail the
# platform tests or the journeys, never a shipped build.
kotlin.incremental.native=true

# Run independent projects' tasks concurrently. Without it Gradle executes one task at a time, and
# `./gradlew build` measured ~19 min serial on a 16-core box against ~9 min parallel with no cache at
# all (2026-10-13). The concurrency is bounded by org.gradle.workers.max (default: the CPU count).
org.gradle.parallel=true

# Build-script (.gradle.kts) compiler warnings are errors, like every Kotlin compilation (see the
# root build.gradle.kts, "Compiler warnings are errors").
org.gradle.kotlin.dsl.allWarningsAsErrors=true

# The managed emulator `androidPlatformTest` boots (`snapsync.android`'s device tests) renders through ANGLE over
# SwiftShader's Vulkan (`swangle_indirect`), not the default SwiftShader GLES, which segfaults in its JIT on some hosts
# (measured on the dev box, emulator 36.1.9 and 37.1.11). Headless either way.
android.testoptions.manageddevices.emulator.gpu=swangle_indirect
