# ssh-runner — the headless macOS build box (DEV INFRASTRUCTURE, not a merge gate).
#
# iOS work is macOS-only and the sandbox is Linux, so `./gradlew compileIosMainKotlinMetadata` is as
# far as Linux goes. This opens ONE long-lived macos-26 job with an sshd behind a cloudflared tunnel,
# so an agent iterates rsync -> xcodebuild an UNSIGNED archive -> pull it back -> sign on Linux ->
# install, many times against one WARM runner instead of one CI run per change. Public repo =>
# macos-26 minutes are free.
#
# The box holds NO signing material. Signing happens on the operator's machine with the global
# `ios-device` skill's `sign` (rcodesign, certificate via secrets-env, profiles fetched from App Store
# Connect), driven by `.ios-device.yml`. Nothing else here needs an identity: `scripts/sim-sign` signs
# ad hoc, and the simulator tests are unsigned.
#
# The generated `.github/workflows/ssh-runner-*.yml` is OWNED by the ssh-runner skill: `init`
# regenerates it wholesale, so edit THIS file and regenerate — never the workflow.
# Runbook: the `ssh-mac-build` skill.
#
# ⚠️ LAYOUT CONSTRAINT: a comment at column 0 belongs to whatever key PRECEDES it, and a block's
# indentation is normalised from its least-indented line — so a column-0 comment after `steps:`
# silently breaks the generated YAML. `steps:` is therefore LAST, and every comment inside it is
# indented.
name: macos
runs-on: macos-26

# `--delete` is on (the default), so the runner loses whatever this tree does not have. Everything
# excluded here is either produced ON the runner and must survive an iterate (`build`, `.gradle`,
# `.kotlin`), local-dev bulk with no business on a Mac, or a GENERATED deployment rendering — the
# runner re-renders those itself via `scripts/resolve-deployment.py` (the `.ios-device.yml` build
# line runs it), which must run before `xcodebuild` LOADS the project (Gradle's own re-resolve fires
# too late, in the `embedAndSignAppleFrameworkForXcode` phase).
#
# `artifacts/` is where the loop archives. It sits INSIDE the workspace on purpose, so every path in
# the runbook stays relative — `sync`'s `:` prefix anchors at the workspace, not at `$HOME`, unlike
# the `scp` the old loop used. Excluding it is what keeps `--delete` from deleting the build you just
# made on the next push. `ios-device-out/` is the global `ios-device` recipe's staging directory (the
# unsigned `.app` plus each target's build settings) and is excluded for the same reason.
#
# NOTE what is deliberately NOT excluded: `gradle.properties`. The per-session properties
# (`snapsync.rig`, `snapsync.deployment`) go in the runner's `~/.gradle/gradle.properties`, OUTSIDE
# this tree — uncommittable by construction. A `snapsync.rig=true` that reached `main` in the
# tracked file would link `:test:rig` into every shipped build.
sync:
  exclude:
    - .git
    - build
    - .gradle
    - .kotlin
    - artifacts
    - ios-device-out
    - api/.localstore
    - api/.localdev
    - .idea
    - __pycache__
    - iosApp/Configuration/Deployment.xcconfig
    - iosApp/Configuration/Deployment.plist
    - api/src/deployment.ts
    - site/src/deployment.json

# Copied VERBATIM into the job, after `actions/checkout` and before the tunnel opens. Secrets ride as
# `${{ secrets.* }}` expressions Actions evaluates in this repo with masking — no secret value ever
# reaches this file, the sandbox, or a dispatch input, which matters because on a public repo
# dispatch inputs and logs are world-readable.
steps:
  - uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: 25
  - uses: gradle/actions/setup-gradle@v5

  # Warm from the same Kotlin/Native entry as ios.yml, so the first in-session build is not cold.
  # RESTORE-ONLY, deliberately: `main` owns that entry (ios.yml writes it) and a session is a pure
  # consumer. A ~500 MB session-end write into an already-full 10 GB budget would evict entries
  # every PR build depends on, and sessions are rare, hand-dispatched and branch-scoped.
  # The run id guarantees the primary key MISSES, so the restore falls through to the NEWEST entry —
  # a hit would pin the session to a possibly ancient one. Prefer the DEVICE family: this loop's
  # dominant cost is `xcodebuild -configuration Debug -destination 'generic/platform=iOS'`, which
  # links iosArm64 against exactly the `ios_arm64-gSTATIC-*` caches ios-build warms.
  # `iosSimulatorArm64Test` in a session still falls through to the shared prefix below.
  - name: Restore Kotlin/Native (~/.konan)
    uses: actions/cache/restore@v6
    with:
      path: ~/.konan
      key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ github.run_id }}
      restore-keys: |
        konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-device-
        konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-
        konan-${{ runner.os }}-
