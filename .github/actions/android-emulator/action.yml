# Boot the Android emulator the device tests, the journeys and the marketing captures run on, and run `script` on it —
# the setup ci.yml's `android-build` and `journeys (android)` and screenshots.yml's `android` job share. A COMPOSITE
# action (step-level), not a reusable workflow, for the reason ios-archive gives: the calling job keeps its name, which
# is its status-check context.
#
# The device: API 36, google_apis, x86_64, the `pixel_6` profile — the phone the `snapsync-android` skill's emulator
# models and the managed device `androidPlatformTest` declares (1080x2400, the size Google Play's captures are taken at).
#
# The system image is not on the runner image, and is downloaded each run (~40 s). It is deliberately NOT cached: one
# entry is ~1.5 GB of the repository's 10 GB, and saved it evicted the ~/.konan entries, which save minutes, not seconds.
# The emulator itself ships on the runner image.
#
# Before `script`, two lines of the action's own: the emulator's whole logcat (every buffer, from its boot) streams to
# a file, kept as an artifact when the job fails; and `settle.sh` waits out the cold boot's rush and answers the ANR
# dialogs it leaves, which a test's first HOME key would otherwise answer by killing SystemUI or the launcher mid-run.
name: Android emulator
description: Enable KVM, install the system image, boot the emulator and run a script on it.

inputs:
  script:
    description: What to run once the emulator is up (reactivecircus/android-emulator-runner's `script`; each line is its own shell).
    required: true
  disable-animations:
    description: "'false' keeps the system animations: the Ui contract's tour drags wheels that settle by a snap animation, which a zero animator scale skips."
    default: "true"

runs:
  using: composite
  steps:
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    # Retried downloads ahead of the emulator action's own, which never retry (`.github/scripts/android_sdk_install.sh`).
    - name: Install the emulator and the system image
      id: sysimg
      shell: bash
      run: bash .github/scripts/android_sdk_install.sh 'system-images;android-36;google_apis;x86_64'
    - name: Boot the emulator and run the script
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        profile: pixel_6
        # `swangle_indirect`, not the default SwiftShader GLES: the latter segfaults in its JIT on some hosts
        # (measured on the dev box, emulator 36.1.9 and 37.1.11); the Vulkan path boots on both.
        # `-feature -WiFiPacketStream`: the emulator's own virtio-wifi, not netsimd's, whose access point booted dead
        # in ~1 CI boot in 10 on 37.2.12.
        emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle_indirect -memory 3072 -feature -WiFiPacketStream
        disable-animations: ${{ inputs.disable-animations }}
        # Each line is its own shell, so the capture is detached: it ends when the emulator does.
        script: |
          adb logcat -G 16M
          nohup sh -c 'adb logcat -b all -v threadtime > "${{ runner.temp }}/emulator-logcat.txt" 2>&1' > /dev/null 2>&1 &
          bash ${{ github.action_path }}/settle.sh
          ${{ inputs.script }}
    # The device's side of a failure: what the system did around it (ANRs, kills, window and activity changes), which
    # the test's own report does not carry. One per job and attempt.
    - name: Keep the emulator's logcat
      if: failure()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: emulator-logcat-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/emulator-logcat.txt
        if-no-files-found: ignore
