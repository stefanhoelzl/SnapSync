# The simulator, already past its first boot: the runner image's iPhone 17 Pro Max (`scripts/lib/sim.sh`), its device
# directory cached as `scripts/sim-settle` leaves it — booted, the unneeded daemons disabled, Photos' library created,
# shut down clean, no app and no photo. ONE device for both of its users: `journeys (ios)` (ci.yml), which settles and
# saves it on main, and `screenshots.yml`, which only restores it — a Pro Max because the store's required screenshot
# class is 6.9" (1320x2868), so the journeys run on the listing's device rather than the screenshots keeping a second
# ~0.9 GB entry of their own.
#
# A first boot on the runner otherwise spent ~4.5 min at a load of 100-480 booting and installing (run 38393803729), and
# the image's device pays it as fully as a created one — the image never booted it (run 38458729276: 1:49 "Waiting on
# Data Migration" for the image's Pro Max, 1:50 for a created one); restored, boot and install took 2.7 min and the
# library's migration 4 s (run 38402060923). Keyed on the image version, the device and the settle scripts. On a miss the
# device is settled (~12 min) and saved only where `settle` is true; anywhere else the image's own directory is put back.
name: Settled simulator
description: Restore the image's iPhone 17 Pro Max past its first boot (settle and save it on a miss when asked).
inputs:
  settle:
    description: "'true' to settle and save the device on a cache miss (journeys (ios) on main); otherwise restore only"
    required: false
    default: 'false'
outputs:
  udid:
    description: The device's UDID, empty when the image carries none.
    value: ${{ steps.sim.outputs.udid }}
runs:
  using: composite
  steps:
    - name: Find the image's simulator
      id: sim
      shell: bash
      run: |
        . scripts/lib/sim.sh
        UDID="$(image_iphone)"
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"
        echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
        if [ -n "$UDID" ]; then
          echo "the image's iPhone 17 Pro Max: $UDID"
          mv "$HOME/Library/Developer/CoreSimulator/Devices/$UDID" "$HOME/Library/Developer/CoreSimulator/Devices/$UDID.image"
        else
          echo "::warning::the image carries no iPhone 17 Pro Max"
        fi
    - name: Restore the settled simulator
      id: restore
      if: steps.sim.outputs.udid != ''
      uses: actions/cache/restore@v6
      with:
        path: ~/Library/Developer/CoreSimulator/Devices/${{ steps.sim.outputs.udid }}
        key: sim-settled-${{ steps.sim.outputs.image }}-${{ steps.sim.outputs.udid }}-${{ hashFiles('scripts/sim-settle', 'scripts/lib/sim.sh') }}
    - name: Settle the simulator
      id: settle
      if: steps.sim.outputs.udid != ''
      shell: bash
      env:
        UDID: ${{ steps.sim.outputs.udid }}
        HIT: ${{ steps.restore.outputs.cache-hit }}
        SETTLE: ${{ inputs.settle }}
      run: |
        D="$HOME/Library/Developer/CoreSimulator/Devices/$UDID"
        if [ "$HIT" = true ]; then
          rm -rf "$D.image"; echo "restored the settled simulator ($(du -sh "$D" | cut -f1))"
        else
          rm -rf "$D"; mv "$D.image" "$D"
          if [ "$SETTLE" = true ]; then scripts/sim-settle "$UDID" && echo "save=true" >> "$GITHUB_OUTPUT"
          else echo "no settled simulator cached — the image's own device pays its first boot"; fi
        fi
        # CoreSimulatorService read the device set before its directory moved; the next simctl starts it afresh.
        killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
    - name: Save the settled simulator
      if: steps.settle.outputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/Library/Developer/CoreSimulator/Devices/${{ steps.sim.outputs.udid }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
    # One entry is ~0.9 GB of a full 10 GB budget: drop the ones a new image, a changed settle or a changed device
    # superseded. Needs `actions: write`.
    - name: Reclaim superseded simulator entries
      if: steps.settle.outputs.save == 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP: ${{ steps.restore.outputs.cache-primary-key }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&key=sim-settled-" \
          --jq ".actions_caches[] | select(.key != \"$KEEP\") | .id" |
          while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent; done
