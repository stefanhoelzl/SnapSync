# Shared "archive a signed iOS device app" steps, used by ios.yml → ios-build (the merge gate). The
# archive it produces is what ios-deliver uploads and what the App Store release later PROMOTES
# (ios-appstore-promote.yml builds nothing — it promotes an existing build).
#
# WHY a COMPOSITE action and not a reusable (workflow_call) workflow: a reusable workflow renames the
# caller's status-check context to "<job> / <inner-job>", which would rename `ios-build` and freeze
# merges (branch-protection requires exactly "ios-build"). A composite action is STEP-level, so the
# calling job keeps its name (= its required status-check context) unchanged.
#
# It holds the security-sensitive scaffolding that was previously duplicated inline: Java/Gradle/Konan
# setup, the extension-framework compile (the shipping iosArm64 klib), the App Store Connect API key,
# an ephemeral signing keychain, and BOTH persistent certs (Distribution + Development — importing both
# is deliberate: an empty keychain makes automatic signing mint a NEW cert each run, and
# `xcodebuild archive` provisions a development identity in addition to the distribution one; see
# ios.yml's header and the ios-testflight-delivery spec).
#
# Version / APNs / host are INJECTED on the xcodebuild line (never read from a committed bump):
#   * marketing-version  — empty = the Config.xcconfig floor (0.1); ios.yml passes the computed
#     max(floor, latest tag + minor 1) for a Release build.
#   * There is deliberately NO aps-environment / apns-env / sentry-dsn input any more: those are
#     DERIVED into the generated Deployment.xcconfig from one `channel` value (capability
#     `deployment-configuration`), so the three environments cannot disagree and the DSN cannot be
#     armed on an undistributed build. An override here would beat the fragment and reopen both.
#   * There is deliberately NO upload-host input: every CI archive bakes the Config.xcconfig host,
#     the single source of the host literal (capability ios-ci). Pointing a DEV build at another
#     backend is done on the ssh-mac loop's own xcodebuild line, where the IPA is actually delivered
#     to a device — CI never produced an installable dev IPA, so the input it once had was dead.
name: iOS archive (signed)
description: Compile the extension framework, import signing certs, and produce a signed device xcarchive.

inputs:
  build-config:
    description: Xcode configuration. Release for TestFlight/App Store distribution; Debug for the branch gate.
    default: Release
  marketing-version:
    description: Override MARKETING_VERSION (CFBundleShortVersionString). Empty = Config.xcconfig floor.
    default: ""
  current-project-version:
    description: CFBundleVersion (build number) — the caller's github.run_number.
    required: true
  archive-path:
    description: Output path for the produced .xcarchive.
    required: true
  asc-key-id:
    description: App Store Connect API key id (Admin).
    required: true
  asc-issuer-id:
    description: App Store Connect issuer id.
    required: true
  asc-api-private-key:
    description: App Store Connect .p8 private key (PEM contents).
    required: true
  signing-cert-p12-base64:
    description: Apple Distribution cert (.p12, base64).
    required: true
  signing-cert-password:
    description: Password for the Distribution .p12.
    required: true
  signing-dev-cert-p12-base64:
    description: Apple Development cert (.p12, base64).
    required: true
  signing-dev-cert-password:
    description: Password for the Development .p12.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
    - uses: gradle/actions/setup-gradle@v5

    # Cache the Kotlin/Native toolchain AND the per-dependency compiler caches a link builds into it
    # (~/.konan = the 1.6 GB prebuilt compiler + ~500 MB of dependencies + the `klib/cache` families).
    # That second half is the part this comment got wrong for two weeks; see below.
    #
    # ⚠️ THE PREMISE THIS STEP USED TO CARRY IS FALSE, and it matters which half. It said "a Debug
    # device link writes NOTHING to ~/.konan … no ~/.konan entry can shorten it", from a 2026-08-09
    # measurement, and concluded "do not re-add a configuration-keyed key expecting to". Re-measured
    # 2026-08-26, macos-26 / Kotlin 2.4.0 (`hw.ncpu`=3, 7 GB, Apple M1 virtual — so "3-core runner"
    # below is right, and GitHub's published macos-26 spec of 4 vCPU / 14 GB does not describe the
    # runner this account gets):
    #
    #   * `~/.konan/kotlin-native-prebuilt-macos-aarch64-2.4.0/klib/cache` EXISTS and holds eight
    #     families, with `ios_arm64-gSTATIC-*` (Debug) and `ios_arm64STATIC-*` kept separate.
    #   * One cold `:app:ios:linkDebugFrameworkIosArm64` grows that directory 505 MB → 819 MB.
    #   * That same link, re-run after a real source edit with those caches on disk: 525 s → 38 s.
    #
    # So the link is not CPU-bound optimisation no cache can shorten — it is ~90% REBUILDING DEPENDENCY
    # COMPILER CACHES. `-Xprofile-phases` corroborates from the other side: it accounts for only ~29 s
    # of compiler work inside a 302 s task, because the cache-building compilations are separate
    # invocations the profiled one never sees. And the `-Pkotlin.native.cacheKind.iosArm64=none` no-op
    # offered as independent corroboration is not evidence either way: that property was DEPRECATED in
    # Kotlin 2.3.20 (replaced by the `disableNativeCache()` DSL), so at 2.4.0 an ignored property and a
    # real no-op are indistinguishable.
    #
    # Refreshed per-task cost (`--profile`, same three Gradle invocations the archive runs):
    # `:app:ios:linkDebugFrameworkIosArm64` 301.9 s (96% of its invocation) and
    # `:app:ios:extension:linkDebugFrameworkIosArm64` 56.5 s (97%) — up from 248.8 s / 44.8 s at run
    # 31329437059. Every klib compile in the app invocation put together is 10.5 s.
    #
    # WHY THIS DOES NOT RE-ADD THE CONFIGURATION-KEYED KEY. That key was live 2026-07-21 → 2026-08-09
    # and bought nothing measurable — branch-push ios.yml wall clock was 11.8 min median while it was
    # keyed and 12.2 min after removal (n=66 / n=71). The removal commit had the reason right even
    # though its premise was wrong: GitHub cache entries are BRANCH-SCOPED and branches here are
    # one-ship-and-deleted, so a Debug entry a branch saved was restorable by nothing. Both eras ran
    # cold. Keying on the configuration does not fix that. What fixes it is the main-owned entry this
    # job restores actually CONTAINING the Debug family — which it never has, for two independent
    # reasons that had to be fixed together: main archives Release, so nothing ever built one (the
    # warm-up step below the archive), and this job's save could not have landed it anyway (the
    # `-device-` namespace on the key below).
    #
    # RESTORE AND SAVE ARE SPLIT, and saving is GATED TO main — the same pattern, for the same
    # reasons, as ios.yml's ios-test (see its comment). Two things forced it here:
    #   * actions/cache writes its post-step entry only when the primary key MISSED. With the old
    #     branch key (stable, no run id) a branch MISSED every time and therefore SAVED every time —
    #     a ~510 MB entry per push, into a 10 GB budget that was already over (10.92 GB, evicting).
    #   * GitHub cache scoping means a branch's entry is visible ONLY to that branch. Branches here
    #     are one-ship-and-deleted (across 40 consecutive ios.yml runs, every branch appeared exactly
    #     once), so those entries were never restorable by anything: 1.53 GB of the budget was pure
    #     orphan, evicting main's live entries. main OWNS the entry; every branch run is a consumer.
    # The run id in the primary key makes it never hit, so the restore always falls through to
    # restore-keys (newest match wins) and main's save always writes a fresh entry — the same
    # stale-entry trap ios-test documents (both konan families were once frozen 18 days). That
    # never-hit key is now doubly load-bearing: it is what keeps the Debug family the warm-up builds
    # from going stale as dependencies move, which is exactly how the family in the entry rotted
    # before anyone noticed it was there.
    - name: Restore Kotlin/Native (~/.konan)
      id: konan
      uses: actions/cache/restore@v6
      with:
        path: ~/.konan
        # `-device-` NAMESPACES THIS JOB'S ENTRY, and that is a bug fix, not tidiness. ios-build and
        # ios-test are two jobs of the SAME workflow run, so `github.run_id` is identical — and both
        # used to save under this one key. ios-test finishes in ~4 min and ios-build in ~14, so
        # ios-test won every time and ios-build's save NEVER LANDED: `Failed to save: Unable to
        # reserve cache with key konan-macOS-<hash>-<run_id>`, reported as `outcome=success` with no
        # warning and no annotation (main run 32908143963, 23:06:59, against ios-test's save at
        # 22:55:00). What main published was therefore always the entry a SIMULATOR TEST job warmed;
        # the device families in it were inherited leftovers, copied forward run after run and never
        # refreshed. That is the stale `ios_arm64-gSTATIC-*` the warm-up below exists to fix, and
        # without this namespace the warm-up would build it and then have its save discarded too.
        #
        # It also explains the "frozen 18 days" both konan entries were once observed in: adding the
        # run id unfroze the race's WINNER and permanently locked out the loser.
        #
        # Narrow → broad: this job's own family first, then either job's entry for this dependency
        # set (the pre-namespace shape included), then any konan entry at all — so a cold runner
        # still lands on a toolchain rather than downloading 1.6 GB.
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-device-${{ github.run_id }}
        restore-keys: |
          konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-device-
          konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-
          konan-${{ runner.os }}-

    # Compile the background-upload extension's Kotlin core (the shipping iosArm64 framework). The
    # Xcode project has no extension target yet, so the archive below would not touch it — compile it
    # here so it stays part of the gate/archive.
    - name: Compile the background-upload extension framework
      shell: bash
      run: ./gradlew :app:ios:extension:compileKotlinIosArm64

    # Write the App Store Connect API key (.p8) for xcodebuild's auth flags.
    - name: Prepare App Store Connect API key
      shell: bash
      env:
        ASC_API_PRIVATE_KEY: ${{ inputs.asc-api-private-key }}
      run: |
        mkdir -p "$RUNNER_TEMP/asc"
        printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
        echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

    # Random password for the throwaway signing keychain, shared across both imports via $GITHUB_ENV
    # (masked). The keychain dies with the ephemeral runner, so this protects nothing — it just avoids
    # a hardcoded credential.
    - name: Generate ephemeral keychain password
      shell: bash
      run: |
        PW="$(openssl rand -base64 24)"
        echo "::add-mask::$PW"
        echo "KEYCHAIN_PW=$PW" >> "$GITHUB_ENV"

    # Import BOTH persistent certs into ONE keychain so automatic signing reuses them instead of
    # minting a fresh cert every run (which would exhaust Apple's per-account cert cap).
    - name: Import Distribution signing certificate
      uses: apple-actions/import-codesign-certs@v7.0.0
      with:
        p12-file-base64: ${{ inputs.signing-cert-p12-base64 }}
        p12-password: ${{ inputs.signing-cert-password }}
        keychain: snapsync-signing
        keychain-password: ${{ env.KEYCHAIN_PW }}
    - name: Import Development signing certificate
      uses: apple-actions/import-codesign-certs@v7.0.0
      with:
        p12-file-base64: ${{ inputs.signing-dev-cert-p12-base64 }}
        p12-password: ${{ inputs.signing-dev-cert-password }}
        keychain: snapsync-signing
        create-keychain: false
        keychain-password: ${{ env.KEYCHAIN_PW }}

    # Assemble the optional xcodebuild build-setting overrides. Each is applied only when non-empty, so
    # an omitted input leaves the Config.xcconfig default in place. The `$()` trick is unnecessary on
    # the CLI (only xcconfig comments need it).
    - name: Assemble xcodebuild overrides
      shell: bash
      env:
        IN_MARKETING_VERSION: ${{ inputs.marketing-version }}
      run: |
        args=""
        [ -n "$IN_MARKETING_VERSION" ] && args="$args MARKETING_VERSION=$IN_MARKETING_VERSION"
        echo "XCB_OVERRIDES=$args" >> "$GITHUB_ENV"

    # The signed archive both compiles iosArm64 (so it doubles as the build gate) and is the delivery
    # source. -allowProvisioningUpdates cloud-manages the PROFILE while reusing the imported cert.
    - name: Archive signed device app
      shell: bash
      env:
        ASC_KEY_ID: ${{ inputs.asc-key-id }}
        ASC_ISSUER_ID: ${{ inputs.asc-issuer-id }}
        BUILD_CONFIG: ${{ inputs.build-config }}
        ARCHIVE_PATH: ${{ inputs.archive-path }}
        CPV: ${{ inputs.current-project-version }}
      run: |
        xcodebuild \
          -project iosApp/iosApp.xcodeproj \
          -scheme iosApp \
          -configuration "$BUILD_CONFIG" \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath "$ARCHIVE_PATH" \
          -derivedDataPath build/ios \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$ASC_KEY_PATH" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
          CURRENT_PROJECT_VERSION="$CPV" \
          $XCB_OVERRIDES \
          archive

    # Build the DEBUG cache family main would otherwise never produce (capability `ios-ci`).
    #
    # The branch gate archives Debug; main archives Release. Only main's ~/.konan entry is restorable
    # by a branch, so the `ios_arm64-gSTATIC-*` family the gate needs has only ever been whatever an
    # older era happened to leave behind — carried along and re-saved on every merge, never refreshed
    # against the current dependency set. Every branch push therefore rebuilds ~314 MB of it, which is
    # ~90% of the archive step: 525 s cold against 38 s warm for the same link (see the restore step).
    #
    # These are exactly the two link tasks the archive's two Xcode "Compile Kotlin Framework" script
    # phases run on a branch. `compileKotlinIosArm64` is configuration-independent and the Release
    # archive above already ran it, so this is the two links and nothing else. Its own output is
    # discarded — the cache entries it leaves in ~/.konan are the entire point — and it writes to
    # `app/ios/build/bin/`, not the archive `ios-deliver` re-signs, so it cannot disturb delivery.
    #
    # COST, and why it is not on anyone's critical path: the first main run after this lands pays the
    # full cold build (~9 min); every merge after restores the family it saved and pays roughly the
    # warm link. `ios-build` on main posts a required check but no merge waits on a main run, and
    # `ios-deliver` needs this job only for its archive artifact, which is already uploaded above.
    #
    # `continue-on-error` because a cache warm-up must NEVER fail a merge that delivers to TestFlight.
    # Absence is not silent, though: the step below reports what actually landed and warns when the
    # family is missing, so a warm-up that quietly stops working shows up in the run summary instead
    # of resurfacing months later as a slow gate nobody can account for.
    - name: Warm the Debug Kotlin/Native cache for the branch gate
      if: github.ref == 'refs/heads/main'
      continue-on-error: true
      shell: bash
      run: ./gradlew :app:ios:linkDebugFrameworkIosArm64 :app:ios:extension:linkDebugFrameworkIosArm64

    # What the entry is about to carry. Reported unconditionally so the number is in the run log of the
    # merge that produced the entry, and warned on when the Debug family is absent — the one state that
    # silently returns the branch gate to rebuilding it on every push.
    - name: Report the Debug Kotlin/Native cache family
      if: github.ref == 'refs/heads/main'
      shell: bash
      run: |
        set -uo pipefail
        K=""
        for d in "$HOME"/.konan/kotlin-native-prebuilt-*/klib/cache; do [ -d "$d" ] && K="$d"; done
        if [ -z "$K" ]; then
          echo "::warning::No Kotlin/Native klib/cache directory under ~/.konan — the branch gate will rebuild its dependency caches on every push (see the restore step's comment)."
          exit 0
        fi
        echo "klib/cache: $K"
        du -sh "$K"
        ls -1 "$K"
        if ! ls -1 "$K" | grep -q '^ios_arm64-g'; then
          echo "::warning::Debug cache family (ios_arm64-g*) absent from ~/.konan — the warm-up did not produce one, so every branch push will rebuild ~314 MB of dependency caches (see the restore step's comment)."
        fi

    # main OWNS the ~/.konan entry; branch runs are pure consumers (see the restore step). Deliberately
    # last and deliberately un-`always()`-ed: a failed archive can leave ~/.konan half-written, and a
    # poisoned entry on main would have to be deleted by hand. actions/cache's post-step had no such
    # protection — which is the other half of why the combined step was split.
    - name: Save Kotlin/Native (~/.konan)
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: ~/.konan
        key: ${{ steps.konan.outputs.cache-primary-key }}
