# App Store listing SCREENSHOTS (capability ios-appstore-metadata). Sibling to appstore.yml, which syncs
# the listing TEXT. One job: composite the committed raw captures onto the brand canvas with the committed
# headline copy, and replace the live set.
#
# WHY A SEPARATE WORKFLOW FILE — two reasons, both structural:
#
#  1. THE TRIGGER IS THE GATE. This must run only when the composite's INPUTS change: `screenshots/**` (the
#     raws) and `metadata/**` (the headline copy). Both feed it — gating on one would silently strand the
#     other (a fresh capture that never reaches the listing, or a headline edit that never re-renders).
#     A `paths:` trigger says exactly that, with no changed-files job and no git-diff guesswork. It is safe
#     HERE and would not be in appstore.yml: that file hosts `appstore-metadata-validate`, a REQUIRED status
#     check, and a required check that is skipped is never posted — which freezes merges. No required check
#     lives in this file, so path-filtering it costs nothing.
#
#  2. CANCELLATION WOULD CORRUPT THE LISTING. `--replace` DELETES the set before uploading, so a cancel
#     mid-flight leaves a PARTIAL screenshot set on the public storefront. appstore.yml runs
#     `cancel-in-progress: true` deliberately — a newer text apply SHOULD supersede an older one rather than
#     race it — and that cancels the whole RUN, which a job-level `concurrency` cannot opt out of. So this
#     job needs its own workflow to hold `cancel-in-progress: false`. Uploads serialise instead; the newest
#     still lands last, because the queue is FIFO.
#
# Like appstore-metadata-apply / ios-deliver / ios-promote, this posts NO required status check and is free
# to fail RED without blocking a merge (do NOT add it to .github/rulesets/main.json). It reuses the existing
# Admin ASC key — no new secret.
name: appstore-screenshots

on:
  push:
    branches: [main]
    paths:
      - "screenshots/**"
      - "metadata/**"
      - ".github/scripts/compose_screenshots.sh"
      - ".github/scripts/asc_screenshots_upload.sh"
      - ".github/workflows/appstore-screenshots.yml"

permissions:
  contents: read

# NOT cancel-in-progress: see (2) above — cancelling a --replace mid-flight leaves a partial public set.
concurrency:
  group: appstore-screenshots
  cancel-in-progress: false

jobs:
  appstore-screenshots-upload:
    name: appstore-screenshots-upload
    runs-on: ubuntu-latest
    env:
      # The same Admin key appstore-metadata-apply uses — asc reads its OWN var names. No new secret.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      ASC_BYPASS_KEYCHAIN: "1"
      DO_NOT_TRACK: "1"
      ASC_APP_ID: "6781692480"
    steps:
      - uses: actions/checkout@v7.0.0

      # The composite moved off the macOS capture runner, so the macOS system fonts it used are gone;
      # fonts-liberation gives a bold sans that is metric-compatible with Arial.
      - name: Install ImageMagick
        run: |
          command -v magick >/dev/null 2>&1 || {
            sudo apt-get -qq update
            sudo apt-get -qq install -y imagemagick fonts-liberation
          }
          magick --version | head -1

      - name: Fetch pinned asc
        run: bash .github/scripts/asc_fetch.sh "$RUNNER_TEMP/asc"

      # Resolves the EDITABLE version itself and refuses anything else (the gate is ours, not the tool's —
      # replacing a set on an in-review version could void a submission). A run with no editable version is
      # a green no-op. Dry-runs before it applies.
      - name: Compose from the committed raws and replace the set
        env:
          ASC: ${{ runner.temp }}/asc
        run: bash .github/scripts/asc_screenshots_upload.sh
