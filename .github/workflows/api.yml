# The api's check gate (capabilities docs/deployment.md, docs/deployment.md). One job,
# `api-test`, running the full Deno check set — fmt, lint, type-check, tests — plus the bundle and its
# commit stamp, on EVERY ref.
#
# THIS IS THE THING THAT KEEPS A BROKEN BACKEND OFF `main`, and it is a separate workflow from the
# deploy (deploy.yml's `api` job) for two reasons that both matter.
#
# ① NO PATH FILTER, deliberately. GitHub treats a required status check that is never posted as
# permanently PENDING, so a path-filtered required check freezes every PR whose diff falls outside the
# filter — forever, with no error anywhere. The deploy runs only on `main` and only when the api changed,
# which is precisely why its context can never be added to the ruleset and why these steps live here
# instead. Every required check in this repository comes from an unfiltered job for this reason (see
# build.yml's and ios.yml's `on:` comments). Do NOT add a `paths:` filter here.
#
# ② The check set used to live in the deploy workflow, ordered before its deploy step, and was required
# by NOTHING. `/ship` arms auto-merge, and auto-merge waits on REQUIRED checks only, so a PR that broke
# the backend went red and merged anyway; the deploy then failed on `main` before its deploy step,
# leaving `main` broken with production silently serving the previous bundle and nothing watching. A
# check that can only fail after merge is not a gate. Now it is one — and the deploy deliberately does
# not repeat it, because no commit can reach `main` without this having passed.
#
# It is isolated from the Gradle/iOS workflows (its own file, coupled to neither) — a standing
# requirement of `docs/deployment.md` — and carries its own concurrency group rather than
# sharing build.yml's or deploy.yml's.
name: api

on:
  push:
    # EVERY branch, NO path filter. See ① above: the absence of a `paths:` key is what makes this
    # context safe to require. `branches: ["**"]` excludes tags, matching build.yml and ios.yml — a
    # `vX.Y` tag is a release receipt and triggers nothing.
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    # This display name is the status-check context required by `main`'s branch ruleset,
    # which `/ship` owns (there is no committed copy).
    # Changing it without updating the ruleset would freeze merges (the required check would never
    # be posted).
    name: api-test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Resolve the deployment BEFORE anything reads it. Every rendering is generated and none is
      # committed, so the checks below would hit a missing module without this. `prod` is named
      # explicitly — there is no default deployment, and an unknown name fails closed. Kept a SEPARATE
      # invocation so it cannot widen the permissions the suite below runs under.
      - name: Resolve the deployment
        run: python3 scripts/resolve-deployment.py prod

      - name: Format check
        working-directory: api
        run: deno fmt --check

      - name: Lint
        working-directory: api
        run: deno lint

      # Type-check all source explicitly. `deno test` only checks test-reachable code, so this
      # covers main.ts/SDK wiring (no test imports it) and any future orphan source file.
      # Invoked through the deno task (rather than restating the globs) so the set of type-checked
      # directories is defined in exactly one place — deno.json — and cannot drift from what a
      # developer runs locally. The task covers src/, src/dev/ (the local backend rig) AND
      # src/scripts/ (the out-of-bundle programs other workflows invoke).
      - name: Type check
        working-directory: api
        run: deno task check

      # Likewise through the task, which carries --allow-read/--allow-write for the dev filesystem
      # shim's contract test. --allow-net stays ABSENT: that absence is what guarantees no test can
      # reach the real bunny zone (a network call fails as a permission error, not a live request).
      - name: Test
        working-directory: api
        run: deno task test

      # The committed schema snapshot must be exactly what replaying `api/migrations/*.sql` produces
      # (`docs/architecture.md`). It has two readers and a stale copy makes both wrong: a REVIEWER reads
      # its diff to see what a migration did to the schema — including what the migration silently
      # dropped, which is visible nowhere else — and the DEPLOY asserts the live store against it.
      #
      # This is a freshness check, not a correctness one: regenerating after a mistake makes it pass.
      # That is why the deletion shows up in the diff instead.
      - name: Schema snapshot is current
        working-directory: api
        run: deno task schema:check

      # Bundling is a check too, not only a deploy step: an import that does not resolve, or a bundle
      # that outgrows the Edge Scripting 10 MB script limit, fails here rather than on `main`.
      # deploy.yml's `api` job bundles again for real — this run's artifact is not the deploy's, and it
      # needs the file on disk for the deploy action.
      - name: Bundle
        working-directory: api
        run: deno task bundle

      # The stamp is what the post-publish boot probe matches against, so a resolver that stopped
      # stamping must fail here — at PR time — rather than after a bad script is already live with no
      # rollback available. `GITHUB_SHA` is set by Actions in every job and is the environment
      # reference `deployments/components/build.json` declares for the `sha` key, so this needs no
      # wiring beyond running in CI at all.
      - name: Verify the bundle carries this commit
        working-directory: api
        run: |
          grep -q "${{ github.sha }}" dist/main.js || {
            echo "::error::dist/main.js does not carry ${{ github.sha }} — the resolver did not stamp it"
            exit 1
          }

  # ── Rehearse a migration change against a pseudonymised copy of the deployed store ──────────────────
  #
  # (`docs/deployment.md`, "Gates".) The deploy is the first place a migration meets the real store — after
  # merge, inside a maintenance window, where a failure rolls back and nothing gates. Measured: c19b6c4b
  # edited comments in the applied 0001–0003, and the next migration (0004) failed three deploys in a row
  # on the runner's checksum refusal, leaving `main` claiming a backend production never served.
  #
  # So a branch that changes anything under `api/migrations/` runs the SAME `bunny db migrations apply` the
  # deploy runs — against a local libSQL server holding a copy of the deployed store — and then the same
  # shape assertion. That catches both failure classes the deploy would: history drift (the copy carries the
  # store's recorded checksums byte-exact) and data (a precondition that aborts, a constraint the real rows
  # break, a rebuild that loses rows).
  #
  # WHY ONLY WHEN `api/migrations/` CHANGED. Drift and data failures are both caused by a change there; a
  # branch that touches nothing there migrates nothing new. Compared against the MERGE BASE (`main...HEAD`),
  # so a branch that is merely behind `main` does not count. A conditional STEP, not a `paths:` filter: the
  # job must post on every branch or a required check freezes merges (see ① above). What it cannot see is
  # drift made outside any branch — a hand edit to `__bunny_migrations`, or a CLI release that changes its
  # checksum; those still surface at the deploy.
  #
  # THE COPY IS PSEUDONYMISED AND NEVER WRITTEN DOWN (`rehearsal-copy.ts`): every secret-bearing value is
  # rewritten by a per-run key, store to store in memory, and the job prints counts only. The credential is
  # the READ-ONLY database token; a push-triggered job on every branch must never hold the deploy's.
  #
  # THE PLATFORM RUNNER, NOT OURS. The CLI refuses any unencrypted URL and has no flag to lift it, so the
  # local `sqld` sits behind a loopback TLS proxy with a throwaway CA (`tls-proxy.ts`). Measured: the CLI's
  # per-batch foreign-keys-off holds on `sqld` (a parent rebuild kept every child row; the control with
  # enforcement on emptied them), and its drift refusal is word for word the deploy's.
  migration-rehearsal:
    name: migration-rehearsal
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Did this branch change a migration?
        id: diff
        run: |
          if git diff --quiet origin/main...HEAD -- api/migrations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing under api/migrations/ differs from the merge base with main — nothing to rehearse"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat origin/main...HEAD -- api/migrations/
          fi

      - uses: denoland/setup-deno@v2
        if: steps.diff.outputs.changed == 'true'
        with:
          deno-version: v2.x

      # Unpinned, as in deploy.yml: the rehearsal must run the CLI the deploy will run.
      - name: Install the bunny CLI
        if: steps.diff.outputs.changed == 'true'
        run: npm install -g @bunny.net/cli

      # sqld 0.24.33, pinned by digest: the stand-in for the deployed store must not move under a rehearsal.
      - name: Start a local libSQL server behind TLS
        if: steps.diff.outputs.changed == 'true'
        run: |
          docker run -d --name sqld -p 127.0.0.1:8080:8080 \
            ghcr.io/tursodatabase/libsql-server@sha256:134f3a465ade779e417b258d8e4fbfa8ca0a3212a2dbe83457b2fa104b75d54a
          tls="$RUNNER_TEMP/rehearsal-tls"; mkdir -p "$tls"; cd "$tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj /CN=rehearsal-ca -keyout ca.key -out ca.pem 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=localhost \
            -keyout srv.key -out srv.csr 2>/dev/null
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > ext
          openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 \
            -extfile ext -out srv.pem 2>/dev/null
          nohup deno run --allow-net --allow-read "$GITHUB_WORKSPACE/api/src/scripts/tls-proxy.ts" \
            srv.pem srv.key 8443 http://127.0.0.1:8080 > proxy.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf --cacert ca.pem https://localhost:8443/health >/dev/null && break
            sleep 0.5
          done
          curl -sf --cacert ca.pem https://localhost:8443/health >/dev/null || {
            echo "::error::the local libSQL server never answered through the TLS proxy"
            docker logs sqld | tail -20; cat proxy.log
            exit 1
          }
          echo "NODE_EXTRA_CA_CERTS=$tls/ca.pem" >> "$GITHUB_ENV"

      - name: Copy the deployed store, pseudonymised
        if: steps.diff.outputs.changed == 'true'
        working-directory: api
        env:
          BUNNY_DATABASE_URL: ${{ secrets.BUNNY_DATABASE_URL }}
          BUNNY_DATABASE_AUTH_TOKEN: ${{ secrets.BUNNY_DATABASE_READONLY_TOKEN }}
          REHEARSAL_DATABASE_URL: http://127.0.0.1:8080
        run: deno run --allow-net --allow-env --allow-read src/scripts/rehearsal-copy.ts

      - name: Apply the migrations, as the deploy will
        if: steps.diff.outputs.changed == 'true'
        working-directory: api
        run: bunny db migrations apply --dir migrations --url libsql://localhost:8443 --token rehearsal --force

      - name: The migrated copy has the schema the migrations build
        if: steps.diff.outputs.changed == 'true'
        working-directory: api
        env:
          BUNNY_DATABASE_URL: http://127.0.0.1:8080
          BUNNY_DATABASE_AUTH_TOKEN: rehearsal
        run: deno run --allow-net --allow-env --allow-read src/scripts/assert-schema.ts
