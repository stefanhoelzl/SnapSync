# CI — every merge gate and every delivery, in one workflow (`docs/deployment.md`, "CI"; `docs/testing.md`, "Where each
# test runs").
#
# TWO SETS OF JOBS, by event, and no job runs in both:
#
#   a push to a BRANCH (the PR gate)    build · ios · android → ci
#   a push to MAIN, or a dispatch       ios-release · android-release → deliver, and on main build-cache
#
# MAIN RE-TESTS NOTHING. Merges are rebases onto an up-to-date main (`/ship`, the ruleset's strict policy), so the tree a
# push to main carries is the tree its PR's run already passed. Main builds what it delivers, delivers it, and builds
# the caches the next PRs restore (GitHub saves caches only from the default branch). Its warm-up steps fail nothing.
#
# ONE macOS RUNNER PER RUN. The account gets about three, and a main run that held two or three of them for 30+ min
# queued the PRs behind it. So each platform is ONE job on either side — `ios` / `android` on a PR, `ios-release` /
# `android-release` on main — and the two platforms have the same shape.
#
# REQUIRED CHECKS. `/ship` owns `main`'s branch ruleset (there is no committed copy) and requires every check that ran
# on a PR: `build`, `ios`, `android` and `ci`, beside `check-label` (its own file). `ci` needs every gate and fails
# unless each one succeeded. A RENAMED or REMOVED gate must be dropped from the ruleset in its ship (`--drop-context`),
# because a required context that is never posted again freezes every merge.
#
# NO PATH FILTER, deliberately, on the workflow or any gate: GitHub treats a required check that is never posted as
# permanently PENDING, so a path-filtered gate would freeze every PR whose diff fell outside it. A step that has nothing
# to do on a diff decides that itself and its job still posts (the migration rehearsal).
#
# WHAT RUNS WHERE ON A PR. The shared `commonTest` runs ONCE, on the JVM, in `build`. A platform runtime runs only what
# only it can answer:
#
#   build     Linux: `./gradlew build` (every target compiled, every JVM test, every architecture gate), the diagrams
#             freshness check, and the checks with no Gradle — specs, deployment resolver, listings, api/, site/, the
#             migration rehearsal — each step `if: !cancelled()`, so one red check hides no other's result
#   ios       the SIGNED Debug device archive (the shipping iosArm64 compile, Swift, entitlements, signing), then on the
#             simulator: `./gradlew iosPlatformTest` (the adapters' contract bindings on the test executable), then
#             `scripts/sim-contracts` — the simulator app's in-app port contracts and the all-real journeys
#   android   on ONE emulator: every module's device tests (the adapters' contract bindings), then
#             `scripts/android-journeys` — the all-real journeys over the rig release build (R8 output)
#
# Delivery. `ios-release` archives RELEASE and exports the signed IPA; `android-release` builds the store bundle; each
# reads its DSN back out of what it built. `deliver` (Linux) uploads both, so one build number (`BUILD_NUMBER_OFFSET`)
# lands in both stores or neither, barring an upload failure. None of them posts a required check, so each is free to
# fail red without blocking anything. They reach only internal testers — TestFlight's `development` group; on Play, a
# push to main reaches the internal testing track and a dispatch an internal-app-sharing link. Real users get builds
# only through the dispatch-driven store promotion (promote.yml).
#
# Deployers stay in their own files: deploy.yml (api, site, listing text — main only), promote.yml, screenshots.yml,
# nightly-cleanup.yml, ssh-runner-macos.yml.
name: ci

on:
  push:
    # BRANCHES only. A `vX.Y` tag is a release RECEIPT created by promote.yml; it triggers nothing.
    branches: ["**"]
  # A DELIBERATE BRANCH DELIVERY (`docs/deployment.md`): dispatch this workflow on any ref and it archives RELEASE and
  # DELIVERS to internal TestFlight, exactly as a push to main does (no gate: the branch's push ran them) — the one route to a tester's
  # phone reachable only through the stores. On Play it goes out as an INTERNAL APP SHARING link in the run's summary,
  # never to the internal track: that track serves only its latest release, so a branch build there replaced main's
  # for every internal tester until the next merge. It must be marked distributed (`SNAPSYNC_CHANNEL: release`): the xcconfig
  # renderer emits the crash-reporting DSN only for a distributed build, and without it the in-app bug-report dialog
  # does not open at all (capability `privacy-security`); a TestFlight build must carry production APNs anyway.
  workflow_dispatch:
    inputs:
      what_to_test:
        description: "TestFlight 'What to Test', also shown beside the Play sharing link (blank → <branch> (<short sha>))"
        required: false
        type: string

permissions:
  contents: read

env:
  # THE BUILD NUMBER (`CFBundleVersion`, and Android's `versionCode` — one number per run, both stores) is this
  # workflow's `run_number` PLUS this offset. Builds were numbered by the
  # retired ios.yml's run number (about 1100 when it retired), and App Store Connect refuses a build number that is not
  # higher than the last one uploaded for the same version, so a fresh workflow counting from 1 could deliver nothing.
  # The offset keeps the sequence monotonic; promote.yml maps a number above it back to THIS workflow's
  # run (build − offset) and one at or below it to ios.yml's. Never lower it; never change it once a build used it.
  BUILD_NUMBER_OFFSET: 2000

# A newer push to a BRANCH cancels its own in-progress run. On main it never does: a cancelled delivery leaves a build
# number in neither store, and a cancelled warm-up a cache one merge behind. Main's runs queue instead, one at a time, so
# deliveries also land in build-number order. (GitHub keeps one PENDING run per group: a third merge while one runs and
# one waits still displaces the waiting one — the newest commit's run covers it.) The event is part of the group so a
# push and a dispatch on the SAME ref never cancel each other: a probe build killed by an unrelated push to its branch
# is a wasted TestFlight round-trip.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  # ═══ The PR gate: a push to any branch but main ══════════════════════════════════════════════════════════════════

  build:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      # Full history: the migration rehearsal diffs against the merge base with main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # `./gradlew build` launches the REAL backend: `:adapter:generic:app`'s jvmTest runs the backend port contracts'
      # live bindings against `api/src/dev/serve.ts --ephemeral` (loopback only, filesystem store). Without Deno they
      # FAIL naming it; they never skip. The api/ checks below run under the same Deno.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Compose Desktop UI tests render offscreen under -Djava.awt.headless=true, so no X server is needed.
      - run: ./gradlew build
      # A red test's whole record: the log prints each failure's message and stack (FULL, set in the root build), the
      # XML results add its standard streams — the rig host's log lines leading up to it — and the HTML reports the rest.
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          # One artifact per attempt: a re-run's results would otherwise replace the attempt it re-runs.
          name: build-test-results-${{ github.run_attempt }}
          path: |
            **/build/test-results/
            **/build/reports/tests/
          if-no-files-found: ignore
      # The diagrams freshness check (`docs/architecture.md`). `:tools:diagrams:test` under `build` is its local half;
      # this half regenerates on a clean checkout and asks git, which also catches untracked new files and the
      # sidecar's self-staleness.
      - name: Regenerate diagrams
        if: ${{ !cancelled() }}
        run: ./gradlew architectureDiagrams
      - name: Fail if committed diagrams are stale
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain architecture/)" ]; then
            echo "::error::architecture/ is stale — run ./gradlew architectureDiagrams and commit the result"
            git status --porcelain architecture/
            git diff architecture/
            exit 1
          fi
          echo "architecture/ is fresh"
      # Every rendering is generated and none is committed, so the listings, api/ and site/ below would read a missing
      # file without this.
      - name: Resolve the deployment
        if: ${{ !cancelled() }}
        run: python3 scripts/resolve-deployment.py prod
      # ── The checks with no Gradle (once four jobs of their own; each ran in seconds, under its runner's setup) ──
      # The spec, the deployment resolver, the listings.
      # Keep openspec/specs the contract of record: every spec must parse and carry a normative (SHALL/MUST)
      # requirement and a scenario. Pinned, so an upstream rule change cannot turn CI red without a deliberate bump.
      # Structure, not truth: green means well-formed.
      - name: Validate the specs
        if: ${{ !cancelled() }}
        run: npx --yes @fission-ai/openspec@1.13.2 validate --specs --strict
      # The deployment resolver's own suite (`docs/deployment.md`), and the only place it runs. It once ran only in the
      # api deploy, on main, where it could only fail after a merge — and did: two required inventory keys broke 20 of
      # its tests, the PR merged clean, and production kept serving the previous bundle.
      - name: Test the deployment resolver
        if: ${{ !cancelled() }}
        run: python3 scripts/resolve_deployment_test.py
      # The photo-library migration gate `ios` waits on (scripts/await-photo-migration.py): its reading of
      # `assetsd`'s log, tested here because the macOS job only ever exercises the one path the runner takes.
      - name: Test the photo-library migration gate
        if: ${{ !cancelled() }}
        run: python3 scripts/await_photo_migration_test.py
      # The use-case graphic (metadata/graphic/): its renders are committed, not built here, so this catches a tagline
      # changed in metadata/screenshots/en-US.json without re-running metadata/graphic/render.py.
      - name: Check the graphic renders carry the current tagline
        if: ${{ !cancelled() }}
        run: python3 metadata/graphic/check.py
      # The App Store listing (`docs/deployment.md`), validated OFFLINE: schema, character limits, URL format. It
      # validates what will be APPLIED — the files the resolver renders from the one listing source
      # (metadata/listing/), placeholders filled — not the committed source. The apply half is deploy.yml's `appstore-metadata-apply` (main only). `asc` is a pinned,
      # checksum-verified binary (asc_fetch.sh).
      - name: Fetch pinned asc
        if: ${{ !cancelled() }}
        run: bash .github/scripts/asc_fetch.sh "$RUNNER_TEMP/asc"
      - name: Validate the App Store listing
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/asc" metadata validate --dir build/metadata'
      # The Play half of the same rendered listing (one source, metadata/listing/): Play has no offline validator, so
      # its character limits are ours. The apply half is promote.yml's diff-gated listing update.
      - name: Validate the Google Play listing
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_play_listing.py build/metadata/play
      # The backend's check set (`docs/deployment.md`). The deploy (deploy.yml's `api` job) deliberately does not repeat
      # it: no commit reaches main without this having passed.
      - name: Format check
        if: ${{ !cancelled() }}
        working-directory: api
        run: deno fmt --check
      - name: Lint
        if: ${{ !cancelled() }}
        working-directory: api
        run: deno lint
      # The wire format's one source (`api/openapi.yaml`): Redocly's recommended rules plus ours (`api/redocly.yaml`).
      - name: OpenAPI lint
        if: ${{ !cancelled() }}
        working-directory: api
        run: deno task lint:openapi
      # All source, explicitly: `deno test` checks only test-reachable code. The task (deno.json) is the one place the
      # type-checked directories are listed.
      - name: Type check
        if: ${{ !cancelled() }}
        working-directory: api
        run: deno task check
      # --allow-net stays ABSENT from the task: that absence is what guarantees no test can reach the real bunny zone.
      - name: Test
        if: ${{ !cancelled() }}
        working-directory: api
        run: deno task test
      # The committed schema snapshot must be exactly what replaying `api/migrations/*.sql` produces: a reviewer reads
      # its diff, and the deploy asserts the live store against it. Freshness, not correctness.
      - name: Schema snapshot is current
        if: ${{ !cancelled() }}
        working-directory: api
        run: deno task schema:check
      # An import that does not resolve, or a bundle past the Edge Scripting 10 MB limit, fails here, not on main.
      - name: Bundle
        if: ${{ !cancelled() }}
        working-directory: api
        run: deno task bundle
      # The stamp is what the deploy's post-publish boot probe matches, so a resolver that stopped stamping fails here
      # rather than after a bad script is live.
      - name: Verify the bundle carries this commit
        if: ${{ !cancelled() }}
        working-directory: api
        run: |
          grep -q "${{ github.sha }}" dist/main.js || {
            echo "::error::dist/main.js does not carry ${{ github.sha }} — the resolver did not stamp it"
            exit 1
          }
      # The site (capability web-site): type-check, formatting, self-containment. The deploy (deploy.yml's `site` job)
      # builds again for its output but does not repeat the checks.
      - name: Install
        if: ${{ !cancelled() }}
        working-directory: site
        run: npm ci
      # Fails if astro:assets cannot process the screenshots, so a broken capture or import is caught before main.
      - name: Build
        if: ${{ !cancelled() }}
        working-directory: site
        run: npm run build
      #   check:types        — astro check (TS type-checking of the .astro pages + island)
      #   check:fmt          — prettier --check
      #   check:selfcontained — Deno: fail on any off-origin subresource (load-bearing for /join privacy),
      #                         and on an event page whose %%TOKEN%%s disagree with the api's (check-event-template.ts)
      - name: Check
        if: ${{ !cancelled() }}
        working-directory: site
        run: npm run check
      # Rehearse a migration change against a pseudonymised copy of the deployed store (`docs/deployment.md`, "Gates"):
      # a branch that changes anything under `api/migrations/` (against the MERGE BASE) runs the SAME `bunny db
      # migrations apply` the deploy runs, against a local libSQL server holding a copy of the store, then the same shape
      # assertion. The copy is pseudonymised in memory and never written down (`rehearsal-copy.ts`); the credential is the
      # READ-ONLY database token. Last, because its libSQL server takes 127.0.0.1:8080. A conditional STEP, not a path
      # filter: the job must post on every branch.
      - name: Did this branch change a migration?
        if: ${{ !cancelled() }}
        id: diff
        run: |
          if git diff --quiet origin/main...HEAD -- api/migrations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing under api/migrations/ differs from the merge base with main — nothing to rehearse"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat origin/main...HEAD -- api/migrations/
          fi
      - uses: denoland/setup-deno@v2
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        with:
          deno-version: v2.x
      # Unpinned, as in deploy.yml: the rehearsal must run the CLI the deploy will run.
      - name: Install the bunny CLI
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        run: npm install -g @bunny.net/cli
      # sqld 0.24.33, pinned by digest: the stand-in for the deployed store must not move under a rehearsal.
      - name: Start a local libSQL server behind TLS
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        run: |
          docker run -d --name sqld -p 127.0.0.1:8080:8080 \
            ghcr.io/tursodatabase/libsql-server@sha256:134f3a465ade779e417b258d8e4fbfa8ca0a3212a2dbe83457b2fa104b75d54a
          tls="$RUNNER_TEMP/rehearsal-tls"; mkdir -p "$tls"; cd "$tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj /CN=rehearsal-ca -keyout ca.key -out ca.pem 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=localhost \
            -keyout srv.key -out srv.csr 2>/dev/null
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > ext
          openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 \
            -extfile ext -out srv.pem 2>/dev/null
          nohup deno run --allow-net --allow-read "$GITHUB_WORKSPACE/api/src/scripts/tls-proxy.ts" \
            srv.pem srv.key 8443 http://127.0.0.1:8080 > proxy.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf --cacert ca.pem https://localhost:8443/health >/dev/null && break
            sleep 0.5
          done
          curl -sf --cacert ca.pem https://localhost:8443/health >/dev/null || {
            echo "::error::the local libSQL server never answered through the TLS proxy"
            docker logs sqld | tail -20; cat proxy.log
            exit 1
          }
          echo "NODE_EXTRA_CA_CERTS=$tls/ca.pem" >> "$GITHUB_ENV"
      - name: Copy the deployed store, pseudonymised
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        working-directory: api
        env:
          BUNNY_DATABASE_URL: ${{ secrets.BUNNY_DATABASE_URL }}
          BUNNY_DATABASE_AUTH_TOKEN: ${{ secrets.BUNNY_DATABASE_READONLY_TOKEN }}
          REHEARSAL_DATABASE_URL: http://127.0.0.1:8080
        run: deno run --allow-net --allow-env --allow-read src/scripts/rehearsal-copy.ts
      - name: Apply the migrations, as the deploy will
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        working-directory: api
        run: bunny db migrations apply --dir migrations --url libsql://localhost:8443 --token rehearsal --force
      - name: The migrated copy has the schema the migrations build
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        working-directory: api
        env:
          BUNNY_DATABASE_URL: http://127.0.0.1:8080
          BUNNY_DATABASE_AUTH_TOKEN: rehearsal
        run: deno run --allow-net --allow-env --allow-read src/scripts/assert-schema.ts

  # The iOS gate, ONE macOS job: the device archive, then everything that runs on the simulator. Signing on every push
  # is deliberate: a signing or entitlement break must fail before merge, not on main's delivery. DEBUG, the identical
  # compile surface minus the LLVM optimization pass that dominates the Release link, on an archive that is discarded;
  # a Release-only failure surfaces on main, where it stops the delivery (the pre-merge escape is a dispatch).
  #
  # Signing: TWO persistent certs — Apple Distribution (SIGNING_CERT_*) and Apple Development (SIGNING_DEV_CERT_*) —
  # imported into one keychain, and `-allowProvisioningUpdates` manages the profiles through the App Store Connect API
  # key. Both, because an empty keychain makes automatic signing mint a NEW cert every run, exhausting Apple's
  # per-account cap. The scaffolding lives in .github/actions/ios-archive, shared with `ios-release`.
  ios:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: macos-26
    env:
      # `channel` is the single discriminator the xcconfig renderer derives APS_ENVIRONMENT / APNS_ENV /
      # SENTRY_ENVIRONMENT from, and it gates the DSN: none is rendered off a distributed channel.
      SNAPSYNC_CHANNEL: dev
      # Gradle's cache: `ios-release`'s, read only (a branch never writes one).
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: ios
    steps:
      - uses: actions/checkout@v7.0.1
      # Render the deployment BEFORE anything reads it: `Config.xcconfig` hard-`#include`s the generated fragment.
      - name: Resolve the deployment
        run: python3 scripts/resolve-deployment.py prod
      - name: Compute the build number
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
      - name: Archive signed device app
        uses: ./.github/actions/ios-archive
        with:
          build-config: Debug
          current-project-version: ${{ env.BUILD_NUMBER }}
          archive-path: ${{ runner.temp }}/SnapSync.xcarchive
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
          signing-cert-p12-base64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          signing-cert-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
          signing-dev-cert-p12-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          signing-dev-cert-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}
      # Assert the built BUNDLES carry the resolved deployment — read back out of the archive, not checked on the
      # generator's output. A renderer test proves the intended bytes were emitted and cannot see a grammar that
      # reinterprets them (the DSN was once truncated at its `//` to `https:` and shipped four mute TestFlight builds
      # with every unit test green) nor a resource that never reached a bundle.
      #
      # BOTH bundles, because each process reads its OWN `Deployment.plist`; a copy missing from one fails all four
      # values in that process at once, silently. The FIFTH value, `BackgroundUploadURLBase`, lives in each bundle's
      # Info.plist because `assetsd` reads it there to validate the upload registration (absent, the OS never launches
      # the extension); it must EQUAL `Deployment.plist`'s `uploadBase`. The two reach the bundle by different routes
      # (a Python-rendered plist; an xcconfig, which truncates at `//`), so their equality is a differential test of
      # the grammar — a prefix test would pass on an empty or truncated value.
      - name: Verify the archive baked the resolved deployment
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SnapSync.xcarchive/Products/Applications/SnapSync.app"
          APPEX="$APP/Extensions/BackgroundUploadExtension.appex"   # iOS 26 uses Extensions/, not PlugIns/
          prop() { sed -n "s/^$1=//p" build/deployment.properties; }
          pb() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null || true; }

          DOMAIN="$(prop domain)"
          [ -n "$DOMAIN" ] || { echo "::error::the resolver produced no domain"; exit 1; }
          if [ "$SNAPSYNC_CHANNEL" = "release" ]; then EXPECT_APNS=production; EXPECT_ENV=production
          else EXPECT_APNS=sandbox; EXPECT_ENV=development; fi

          for BUNDLE_DIR in "$APP" "$APPEX"; do
            NAME="$(basename "$BUNDLE_DIR")"
            DEP="$BUNDLE_DIR/Deployment.plist"
            [ -f "$DEP" ] || { echo "::error::$NAME carries no Deployment.plist — the resource did not reach this bundle"; exit 1; }

            BASE="$(pb "$DEP" uploadBase)"
            APNS="$(pb "$DEP" apnsEnv)"
            SENV="$(pb "$DEP" sentryEnvironment)"
            ID="$(pb "$BUNDLE_DIR/Info.plist" CFBundleIdentifier)"
            INFOBASE="$(pb "$BUNDLE_DIR/Info.plist" BackgroundUploadURLBase)"
            echo "$NAME: base=$BASE infoBase=$INFOBASE apns=$APNS sentryEnv=$SENV id=$ID"

            [ "$BASE" = "https://$DOMAIN/api/v2" ] || { echo "::error::$NAME upload base '$BASE' is not https://$DOMAIN/api/v2"; exit 1; }
            [ -n "$INFOBASE" ] || { echo "::error::$NAME Info.plist carries no BackgroundUploadURLBase — assetsd validates the registration insert against this key and refuses with a bare PHPhotosErrorDomain -1 without it"; exit 1; }
            [ "$INFOBASE" = "$BASE" ] || { echo "::error::$NAME Info.plist BackgroundUploadURLBase '$INFOBASE' does not equal Deployment.plist uploadBase '$BASE'"; exit 1; }
            [ "$APNS" = "$EXPECT_APNS" ] || { echo "::error::$NAME apnsEnv is '$APNS', expected '$EXPECT_APNS'"; exit 1; }
            [ "$SENV" = "$EXPECT_ENV" ] || { echo "::error::$NAME sentryEnvironment is '$SENV', expected '$EXPECT_ENV'"; exit 1; }
            [ -n "$ID" ] || { echo "::error::$NAME CFBundleIdentifier is empty — the fragment did not resolve"; exit 1; }

            # The DSN is COMPARED, never echoed. Absence is the off-switch, so an undistributed build must carry none.
            DSN="$(pb "$DEP" sentryDsn)"
            if [ "$SNAPSYNC_CHANNEL" = "release" ]; then
              if [ -z "$DSN" ] || [ "$DSN" != "$SENTRY_DSN" ]; then
                echo "::error::$NAME sentryDsn does not match the resolved DSN (present=$([ -n "$DSN" ] && echo yes || echo no))"; exit 1
              fi
              echo "$NAME: sentryDsn matches the resolved value"
            else
              [ -z "$DSN" ] || { echo "::error::$NAME carries a DSN on an undistributed build"; exit 1; }
              echo "$NAME: no sentryDsn, as expected off a distributed channel"
            fi
          done
      # Kotlin/Native imports every Objective-C class STRONGLY — it has no notion of availability — so a class newer
      # than a bundle's minimum OS kills that process in dyld on an older iOS, before any of our code runs (a rig build
      # on the iOS 18 XS, 2026-10-03: `Symbol not found: _OBJC_CLASS_$_PHAssetResourceUploadJob`). Clang, asked per
      # class at the bundle's own MinimumOSVersion, is the authority on which ones must be weak.
      - name: Verify no bundle strongly imports a class newer than its minimum OS
        run: |
          APP="$RUNNER_TEMP/SnapSync.xcarchive/Products/Applications/SnapSync.app"
          python3 scripts/check-weak-links.py "$APP" "$APP/Extensions/BackgroundUploadExtension.appex"
      # The platform-bound tests (`docs/testing.md`, "Where each test runs"): every module's `iosTest` on a booted
      # simulator — the iOS adapters and their contract bindings on the unentitled test executable (IOS_SIM_KEXE), and
      # the native SQLite drivers behind the storage contracts. Then every daemon and simulator goes: the 7 GB runner
      # holds one simulator at a time (`changes/archive/2026-09-25-one-simulator-journeys`).
      - name: Platform tests on the simulator
        run: |
          ./gradlew iosPlatformTest
          ./gradlew -q --stop
          xcrun simctl shutdown all
      - uses: ./.github/actions/settled-simulator
      # The rig app's Kotlin/Native incremental-link caches (`kotlin.incremental.native`, gradle.properties), which the
      # Gradle cache does not hold: `ios-release` saves them after building the same rig app. ~60-90 MB.
      - name: Restore the rig app's link caches
        uses: actions/cache/restore@v6
        with:
          path: |
            app/ios/build/kotlin-native-ic-cache
            app/ios/extension/build/kotlin-native-ic-cache
          key: ios-rig-ic-${{ github.run_id }}
          restore-keys: ios-rig-ic-
      # The real backend the journeys run against, served locally on the address the `local` deployment bakes in.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # First the port contracts whose bindings live in the APP — the simulator app is the only simulator process
      # `applesimutils` can grant photo access to, so it is where PhotoKit runs under a real full grant (IOS_SIM_APP) —
      # then the all-real journeys on the same app. The rig property goes into the RUNNER's ~/.gradle, never a tracked
      # file: a committed `snapsync.rig=true` would link the control channel into every shipped build. Spotlight
      # indexes build outputs as they are written on this 3-vCPU runner; the runner is discarded, so it is switched off.
      - name: Run the simulator app's port contracts and the journeys
        run: |
          mkdir -p ~/.gradle && printf "snapsync.rig=true\n" >> ~/.gradle/gradle.properties
          sudo mdutil -a -i off >/dev/null || true
          scripts/sim-contracts
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          # One artifact per attempt: a re-run's evidence would otherwise replace the attempt it re-runs.
          name: ios-evidence-${{ github.run_attempt }}
          path: build/sim-contracts/
          if-no-files-found: ignore

  # The Android gate, the same shape on Linux: ONE emulator (`.github/actions/android-emulator`: Pixel 6 / API 36) for
  # the device tests and then the journeys. Everything is built BEFORE it boots and the daemons stopped, so the build and
  # the emulator never compete for the runner. No store build here: `build` already runs the same R8
  # `:app:android:assembleRelease`, so only a delivering run builds the bundle.
  android:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    # Gradle's cache: `build-cache`'s entries, read only. It builds every Android library, the device tests and the rig
    # release app, so this job's compiles come from it; a second writer would only store a duplicate.
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      # The real backend the journeys run against, served locally on the address the `local` deployment bakes in.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The device tests' APKs, then the rig RELEASE build (R8 as the store build runs it, so every journey exercises R8
      # output) baked for the local backend, the journeys' classpath and the `rig` CLI the script drives the app with.
      # Two invocations: the device tests build under the repo's own deployment, the journeys under `local`.
      - name: Build the device tests, the rig app and the journeys
        run: |
          ./gradlew assembleAndroidDeviceTest
          ./gradlew :app:android:assembleRelease :test:integration:journeysClasses :test:integration:journeysClasspath \
            :test:cli:installDist -Psnapsync.rig=true -Psnapsync.deployment=local
          ./gradlew --stop
      # The device tests first, with the system animations ON as on the managed device (the Ui contract's tour drags
      # wheels that settle by a snap animation, run 38439772784), the upload contract's transfer fixture served on the
      # host by the build. The modules that test a grant short of full run first, on the clean device, before
      # `:adapter:android`'s seed the library; each APK holds only the runtime permissions it declares. Then the Gradle
      # daemon goes, the animations are switched off as the journeys expect, and the journeys run on the same device —
      # as on iOS, after the contracts' seeds, which sit outside every journey's capture window.
      - name: Device tests and journeys on the emulator
        uses: ./.github/actions/android-emulator
        with:
          disable-animations: "false"
          script: |
            ./gradlew :test:no-grant:connectedAndroidDeviceTest :test:partial-grant:connectedAndroidDeviceTest
            ./gradlew :adapter:android:connectedAndroidDeviceTest :adapter:generic:sentry:connectedAndroidDeviceTest
            ./gradlew --stop
            adb shell settings put global window_animation_scale 0 && adb shell settings put global transition_animation_scale 0 && adb shell settings put global animator_duration_scale 0
            scripts/android-journeys
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-evidence-${{ github.run_attempt }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            build/transfer-fixture.log
            build/android-journeys/
          if-no-files-found: ignore

  # `always()` so it posts whatever the gates did: a gate that failed, was cancelled or was skipped fails it. Without
  # `always()` a red gate would SKIP this job, and a skipped required check counts as passing. Branch pushes only, as
  # the gates are.
  ci:
    needs: [build, ios, android]
    if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - name: Every gate succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null || {
            echo "::error::a gate did not succeed"
            exit 1
          }

  # ═══ Delivery: a push to main, or a dispatch ═════════════════════════════════════════════════════════════════════

  # The RELEASE archive TestFlight receives, ONE macOS job: archive, read the deployment back out of it, export the
  # signed IPA for `deliver`. Then, on main only, the warm-up: what the next PRs' `ios` job restores is built here —
  # the simulator test executables, the rig app and the settled simulator — without running anything. The warm-up's
  # steps are `continue-on-error`: a cache one merge behind must never stop a delivery.
  ios-release:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    # `actions: write`: the ~/.konan, rig-cache and simulator saves reclaim the entries they supersede.
    permissions:
      contents: read
      actions: write
    env:
      SNAPSYNC_CHANNEL: release
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: ios
    steps:
      # fetch-tags so the marketing-version computation below can see the release tags (vX.Y).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
      - name: Resolve the deployment
        run: python3 scripts/resolve-deployment.py prod
      # MARKETING_VERSION = max(floor, latest vX.Y tag with its minor + 1) — `scripts/marketing-version.py`, the ONE
      # rule `android-release` runs too, so both stores receive the same version for the same commit.
      - name: Compute the version and build number
        run: |
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
          VERSION="$(python3 scripts/marketing-version.py)"
          echo "MARKETING_VERSION_OUT=$VERSION" >> "$GITHUB_ENV"
          echo "computed marketing version: $VERSION"
      # APNs environment and the DSN are NOT passed: they are derived into the deployment fragment from `channel`, and
      # an xcodebuild override would let them disagree.
      - name: Archive signed device app
        id: archive
        uses: ./.github/actions/ios-archive
        with:
          build-config: Release
          marketing-version: ${{ env.MARKETING_VERSION_OUT }}
          current-project-version: ${{ env.BUILD_NUMBER }}
          archive-path: ${{ runner.temp }}/SnapSync.xcarchive
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
          signing-cert-p12-base64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          signing-cert-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
          signing-dev-cert-p12-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          signing-dev-cert-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}
      # Assert the built BUNDLES carry the resolved deployment — read back out of the archive, not checked on the
      # generator's output. A renderer test proves the intended bytes were emitted and cannot see a grammar that
      # reinterprets them (the DSN was once truncated at its `//` to `https:` and shipped four mute TestFlight builds
      # with every unit test green) nor a resource that never reached a bundle.
      #
      # BOTH bundles, because each process reads its OWN `Deployment.plist`; a copy missing from one fails all four
      # values in that process at once, silently. The FIFTH value, `BackgroundUploadURLBase`, lives in each bundle's
      # Info.plist because `assetsd` reads it there to validate the upload registration (absent, the OS never launches
      # the extension); it must EQUAL `Deployment.plist`'s `uploadBase`. The two reach the bundle by different routes
      # (a Python-rendered plist; an xcconfig, which truncates at `//`), so their equality is a differential test of
      # the grammar — a prefix test would pass on an empty or truncated value.
      - name: Verify the archive baked the resolved deployment
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SnapSync.xcarchive/Products/Applications/SnapSync.app"
          APPEX="$APP/Extensions/BackgroundUploadExtension.appex"   # iOS 26 uses Extensions/, not PlugIns/
          prop() { sed -n "s/^$1=//p" build/deployment.properties; }
          pb() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null || true; }

          DOMAIN="$(prop domain)"
          [ -n "$DOMAIN" ] || { echo "::error::the resolver produced no domain"; exit 1; }
          if [ "$SNAPSYNC_CHANNEL" = "release" ]; then EXPECT_APNS=production; EXPECT_ENV=production
          else EXPECT_APNS=sandbox; EXPECT_ENV=development; fi

          for BUNDLE_DIR in "$APP" "$APPEX"; do
            NAME="$(basename "$BUNDLE_DIR")"
            DEP="$BUNDLE_DIR/Deployment.plist"
            [ -f "$DEP" ] || { echo "::error::$NAME carries no Deployment.plist — the resource did not reach this bundle"; exit 1; }

            BASE="$(pb "$DEP" uploadBase)"
            APNS="$(pb "$DEP" apnsEnv)"
            SENV="$(pb "$DEP" sentryEnvironment)"
            ID="$(pb "$BUNDLE_DIR/Info.plist" CFBundleIdentifier)"
            INFOBASE="$(pb "$BUNDLE_DIR/Info.plist" BackgroundUploadURLBase)"
            echo "$NAME: base=$BASE infoBase=$INFOBASE apns=$APNS sentryEnv=$SENV id=$ID"

            [ "$BASE" = "https://$DOMAIN/api/v2" ] || { echo "::error::$NAME upload base '$BASE' is not https://$DOMAIN/api/v2"; exit 1; }
            [ -n "$INFOBASE" ] || { echo "::error::$NAME Info.plist carries no BackgroundUploadURLBase — assetsd validates the registration insert against this key and refuses with a bare PHPhotosErrorDomain -1 without it"; exit 1; }
            [ "$INFOBASE" = "$BASE" ] || { echo "::error::$NAME Info.plist BackgroundUploadURLBase '$INFOBASE' does not equal Deployment.plist uploadBase '$BASE'"; exit 1; }
            [ "$APNS" = "$EXPECT_APNS" ] || { echo "::error::$NAME apnsEnv is '$APNS', expected '$EXPECT_APNS'"; exit 1; }
            [ "$SENV" = "$EXPECT_ENV" ] || { echo "::error::$NAME sentryEnvironment is '$SENV', expected '$EXPECT_ENV'"; exit 1; }
            [ -n "$ID" ] || { echo "::error::$NAME CFBundleIdentifier is empty — the fragment did not resolve"; exit 1; }

            # The DSN is COMPARED, never echoed. Absence is the off-switch, so an undistributed build must carry none.
            DSN="$(pb "$DEP" sentryDsn)"
            if [ "$SNAPSYNC_CHANNEL" = "release" ]; then
              if [ -z "$DSN" ] || [ "$DSN" != "$SENTRY_DSN" ]; then
                echo "::error::$NAME sentryDsn does not match the resolved DSN (present=$([ -n "$DSN" ] && echo yes || echo no))"; exit 1
              fi
              echo "$NAME: sentryDsn matches the resolved value"
            else
              [ -z "$DSN" ] || { echo "::error::$NAME carries a DSN on an undistributed build"; exit 1; }
              echo "$NAME: no sentryDsn, as expected off a distributed channel"
            fi
          done
      # Kotlin/Native imports every Objective-C class STRONGLY — it has no notion of availability — so a class newer
      # than a bundle's minimum OS kills that process in dyld on an older iOS, before any of our code runs (a rig build
      # on the iOS 18 XS, 2026-10-03: `Symbol not found: _OBJC_CLASS_$_PHAssetResourceUploadJob`). Clang, asked per
      # class at the bundle's own MinimumOSVersion, is the authority on which ones must be weak.
      - name: Verify no bundle strongly imports a class newer than its minimum OS
        run: |
          APP="$RUNNER_TEMP/SnapSync.xcarchive/Products/Applications/SnapSync.app"
          python3 scripts/check-weak-links.py "$APP" "$APP/Extensions/BackgroundUploadExtension.appex"
      # Crash-report symbolication (capability `privacy-security`): Bugsink ingests no dSYMs, so each delivered build's
      # symbols stay fetchable BY BUILD NUMBER (the `/bugsink` skill reads them). 90 days is the platform's maximum.
      - name: Publish dSYMs for crash symbolication
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dsyms-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/SnapSync.xcarchive/dSYMs
          retention-days: 90
          if-no-files-found: error
      # The IPA, exported here where the archive's keychain still is, so `deliver` uploads it from Linux.
      # `ASC_KEY_PATH` and the signing keychain are the archive action's.
      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload the IPA for delivery
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/SnapSync.ipa
          # A build intermediate for the next job of this run, in a public repo: one day, then gone.
          retention-days: 1
          if-no-files-found: error

      # ── The warm-up (main only) ──
      # The simulator test executables `ios`'s `iosPlatformTest` links, built and not run, so the ~/.konan entry
      # below carries the simulator caches beside the device ones.
      # Every warm-up build resolves the `dev` channel, as `ios` does: the job's `release` channel and DSN would bake a
      # DSN into the rig app and key every compile differently from the PR's, which then could not use them.
      - name: Warm the simulator test executables
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SNAPSYNC_CHANNEL: dev
          SENTRY_DSN: ""
        run: ./gradlew linkDebugTestIosSimulatorArm64
      - name: Save Kotlin/Native (~/.konan)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: ./.github/actions/konan-save
        with:
          family: device
          key: ${{ steps.archive.outputs.konan-key }}
      # The rig app and the journeys' classpath, as `scripts/sim-contracts` builds them, so their Gradle build-cache
      # entries reach the Gradle cache this job saves, and their link caches the entry below.
      - name: Warm the rig app
        id: rig
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SNAPSYNC_CHANNEL: dev
          SENTRY_DSN: ""
        run: |
          mkdir -p ~/.gradle && printf "snapsync.rig=true\n" >> ~/.gradle/gradle.properties
          sudo mdutil -a -i off >/dev/null || true
          SIM_CONTRACTS_BUILD_ONLY=1 scripts/sim-contracts
      # Success only: a half-written link cache must never be published.
      - name: Save the rig app's link caches
        if: github.ref == 'refs/heads/main' && steps.rig.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            app/ios/build/kotlin-native-ic-cache
            app/ios/extension/build/kotlin-native-ic-cache
          key: ios-rig-ic-${{ github.run_id }}
      - name: Reclaim superseded rig-app cache entries
        if: github.ref == 'refs/heads/main' && steps.rig.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ios-rig-ic-${{ github.run_id }}
        run: |
          for prefix in ios-rig-ic- journeys-ios-build-; do
            gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&key=$prefix" \
              --jq ".actions_caches[] | select(.key != \"$KEEP\") | .id" |
              while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent; done
          done
      # The settled simulator, settled and saved only when its key misses (a new image or a changed settle script).
      - name: Settle the simulator
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: ./.github/actions/settled-simulator
        with:
          settle: "true"

  # The store bundle Play receives, marked distributed so the resolver bakes the crash-reporting DSN
  # (`docs/deployment.md`), and the R8 mapping kept for it — from one R8 run, so the mapping is the bundle's.
  android-release:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    # Gradle's cache: `build-cache`'s entries, read only.
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
      SNAPSYNC_CHANNEL: release
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      # fetch-tags so the marketing-version computation below can see the release tags (vX.Y).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      # The version and build number BOTH stores receive for this run: the rule `ios-release` runs.
      - name: Compute the version and build number
        run: |
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
          VERSION="$(python3 scripts/marketing-version.py)"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "computed marketing version: $VERSION"
      - name: Build the store bundle
        run: ./gradlew :app:android:bundleRelease -Psnapsync.versionCode="$BUILD_NUMBER" -Psnapsync.versionName="$VERSION_NAME"
      # Assert the BUNDLE carries the DSN — read out of its dex, not off the generator: the DSN once reached a grammar
      # that truncated it and shipped mute builds with every test green. COMPARED, never echoed.
      - name: Verify the bundle baked the DSN
        run: |
          [ -n "$SENTRY_DSN" ] || { echo "::error::the SENTRY_DSN secret is empty"; exit 1; }
          if unzip -p app/android/build/outputs/bundle/release/android-release.aab 'base/dex/*.dex' | grep -q -a -F "$SENTRY_DSN"; then
            echo "the bundle carries the resolved DSN"
          else
            echo "::error::the bundle's dex does not carry the resolved DSN"; exit 1
          fi
      # Hand the UNSIGNED bundle, its R8 mapping and the version it was built with to `deliver`, which signs, keeps the
      # mapping and uploads. The version travels with the bundle so the release's name cannot disagree.
      - name: Record the bundle's version
        run: echo "$VERSION_NAME" > app/android/build/outputs/version.txt
      - name: Upload the bundle for delivery
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-bundle
          path: |
            app/android/build/outputs/bundle/release/android-release.aab
            app/android/build/outputs/mapping/release/mapping.txt
            app/android/build/outputs/version.txt
          retention-days: 1
          if-no-files-found: error

  # BOTH stores, from Linux. It compiles nothing: it uploads the IPA `ios-release` exported and signs the bundle
  # `android-release` built with the UPLOAD key. Play first, then TestFlight with `if: !cancelled()`, so one store's
  # failure does not keep the build from the other.
  deliver:
    needs: [ios-release, android-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      # For the release note's fallback, the package name and the Play script.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Compute the version and build number
        run: |
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
          echo "PACKAGE=$(jq -r .androidPackageName deployments/components/android.json)" >> "$GITHUB_ENV"
      # The "What to Test" note (`.github/scripts/delivery_note.sh`), the same for both stores.
      - name: Compose the release note
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          NOTE="$(bash .github/scripts/delivery_note.sh)"
          echo "note: $NOTE"
          echo "RELEASE_NOTE=$NOTE" >> "$GITHUB_ENV"
      - name: Download the bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: android-bundle
          path: ${{ runner.temp }}/android
      # Crash-report retracing (capability `privacy-security`): Bugsink takes no mapping, and Play is not given one, so
      # each delivered build's R8 mapping stays fetchable BY BUILD NUMBER — an Android crash report's `dist` — for the
      # `/bugsink` skill. 90 days is the platform's maximum, as for `dsyms-<build>`.
      - name: Publish the R8 mapping for crash retracing
        uses: actions/upload-artifact@v7.0.2
        with:
          name: r8-mapping-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/android/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error
      # The upload key: a PKCS12 store whose one key is aliased `upload`, its password the store's. Written to the
      # runner's temp only, for this step, and the password reaches jarsigner through the environment.
      - name: Sign the bundle with the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/upload.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          AAB="$RUNNER_TEMP/android/bundle/release/android-release.aab"
          jarsigner -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            "$AAB" upload
          rm -f "$KEYSTORE"
          # `-verify` exits 0 on an UNSIGNED jar too, so its verdict is read, not its status.
          jarsigner -verify "$AAB" | grep -q '^jar verified\.' || { echo "::error::the bundle is not signed"; exit 1; }
      # play_release.py's dependencies are declared inline (PEP 723) and resolved by `uv run`.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      # ONE Play edit: upload, the internal track's one release (named `<version> (<build>)`), commit — or nothing.
      # The store listing is NOT written here: Play's listing is one per app, so promote.yml writes it with the release
      # it describes (`docs/deployment.md`, "Google Play listing delivery").
      - name: Upload to the Play internal track with the release note
        if: github.event_name == 'push'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          VERSION="$(cat "$RUNNER_TEMP/android/version.txt")"
          uv run .github/scripts/play_release.py deliver "$PACKAGE" \
            "$RUNNER_TEMP/android/bundle/release/android-release.aab" internal "$VERSION ($BUILD_NUMBER)" "$RELEASE_NOTE"
      # A DISPATCH: no edit, no track, no listing — the bundle goes through internal app sharing, and the install link
      # goes to the run's summary. The script refuses a build Play signed with a certificate android.json does not
      # accept, since prod would refuse that app's attestation. Installing needs the Play Store's "Internal app sharing"
      # toggle on the phone and an address on the Console's tester list (`docs/deployment.md`).
      - name: Share the bundle through Play internal app sharing
        id: share
        if: github.event_name == 'workflow_dispatch'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          uv run .github/scripts/play_release.py share "$PACKAGE" \
            "$RUNNER_TEMP/android/bundle/release/android-release.aab" deployments/components/android.json
      - name: Put the install link in the summary
        if: always() && github.event_name == 'workflow_dispatch' && steps.share.outputs.link != ''
        env:
          LINK: ${{ steps.share.outputs.link }}
          SHARED: ${{ steps.share.outcome }}
        run: |
          VERSION="$(cat "$RUNNER_TEMP/android/version.txt")"
          {
            echo "## Android build $BUILD_NUMBER — internal app sharing"
            echo
            if [ "$SHARED" = success ]; then
              echo "### [Install $VERSION ($BUILD_NUMBER) from Google Play]($LINK)"
              # The QR code is drawn by a public generator: GitHub strips data: images and inline SVG from a summary.
              # The link reaches that service, which is harmless — it opens only for the Console's email list.
              echo
              echo "<img alt=\"QR code of the install link\" width=\"300\" src=\"https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=$(jq -rn --arg l "$LINK" '$l|@uri')\">"
            else
              echo "⚠️ **Prod refuses this build's signing certificate** — it installs, but cannot create or join an event: $LINK"
            fi
            echo
            echo "\`$GITHUB_REF_NAME\` at \`${GITHUB_SHA:0:7}\` — $RELEASE_NOTE"
            echo
            echo "Opens in the Play Store on a phone whose account is on the Console's internal-app-sharing list, with"
            echo "the Store's \"Internal app sharing\" toggle on. Over the Play-installed app, Play offers to uninstall it first"
            echo "(another signing key): that wipes its local state, and the link build enrols as a new device."
          } >> "$GITHUB_STEP_SUMMARY"
      # ── TestFlight ──
      - name: Download the IPA
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ios
      # Upload + note: the pinned `asc` (asc_fetch.sh, the metadata check's) uploads through the App Store Connect API —
      # no Xcode, so no Mac — waits for the build to process and attaches the "What to Test" note. No group assignment
      # and no beta-review submission: internal testers get every build.
      - name: Upload to TestFlight with the release note
        if: ${{ !cancelled() }}
        env:
          ASC_APP_ID: "6781692480"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: |
          bash .github/scripts/asc_fetch.sh "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc" builds upload --ipa "$RUNNER_TEMP/ios/SnapSync.ipa" \
            --test-notes "$RELEASE_NOTE" --locale en-US --wait

  # ═══ The cache warm-up on main (no gate, delays no delivery) ═════════════════════════════════════════════════════

  # The Linux Gradle cache every Linux job restores: `./gradlew build`, so a PR's JVM tests of modules it did not touch
  # come from the cache, and the Android device tests and rig release app `android` builds. Nothing needs this job;
  # a red one is a cache one merge behind. Last, the Gradle entries every writer of this run superseded are reclaimed.
  build-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: ./gradlew build
      - name: Build the device tests and the rig app
        if: ${{ !cancelled() }}
        run: |
          ./gradlew assembleAndroidDeviceTest
          ./gradlew :app:android:assembleRelease :test:integration:journeysClasses :test:integration:journeysClasspath \
            :test:cli:installDist -Psnapsync.rig=true -Psnapsync.deployment=local

  # setup-gradle saves a new set of `gradle-*` entries per main commit and never deletes the old ones (~4.7 GB of
  # superseded entries measured 2026-10-14, beside a ~6 GB live set, over the 10 GB budget). After this run's writers
  # saved theirs, every `gradle-*` entry nothing in this run created or restored is superseded: delete it.
  reclaim-gradle-caches:
    needs: [build-cache, ios-release]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Delete the Gradle entries this run neither created nor restored
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STARTED="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)"
          echo "reclaiming gradle-* entries last used before $STARTED"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&ref=refs/heads/main" \
            --jq ".actions_caches[] | select(.key | startswith(\"gradle-\")) | select(.last_accessed_at < \"$STARTED\") | [.id, .key, .size_in_bytes] | @tsv" |
            while IFS=$'\t' read -r id key size; do
              echo "reclaiming $key ($((size / 1000000)) MB)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent || echo "::warning::could not delete $key"
            done
