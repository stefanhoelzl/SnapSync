# CI — EVERY merge gate, in one workflow (`docs/deployment.md`, "CI"; `docs/testing.md`, "Where each test runs").
#
# REQUIRED CHECKS. `/ship` owns `main`'s branch ruleset (there is no committed copy) and requires every check that ran
# on a PR, so each gate below is a required context of its own, beside `check-label` (pull-request-triggered, its own
# file). `ci` needs every gate and fails unless each one succeeded; it is what `ios-deliver` waits on. A new gate joins
# the ruleset on the next ship by having run; a RENAMED or REMOVED gate must be dropped from the ruleset in that ship
# (`--drop-context`), because a required context that is never posted again freezes every merge.
#
# NO PATH FILTER, deliberately, on the workflow or any gate: GitHub treats a required check that is never posted as
# permanently PENDING, so a path-filtered gate would freeze every PR whose diff fell outside it. A gate that has
# nothing to do on a diff decides that in a STEP (migration-rehearsal) and still posts.
#
# WHAT RUNS WHERE. The shared `commonTest` runs ONCE, on the JVM, in `build`. A platform runtime runs only what only it
# can answer, and both platforms have the same two gates:
#
#   build           Linux: `./gradlew build` (every target compiled, every JVM test, every architecture gate) and the
#                   diagrams freshness check
#   ios-build       the SIGNED device archive — the shipping iosArm64 compile, and the delivery source on main — then
#                   the platform-bound tests, `./gradlew iosPlatformTest` on the simulator (the iOS adapters and their
#                   contract bindings on the test executable, the native SQLite drivers)
#   android-build   the plain RELEASE build, the store's — R8 and resource shrinking over its whole graph, its R8 mapping
#                   in app/android/build/outputs/mapping/release/, and on a delivering run the BUNDLE Play receives
#                   (the delivery source, as ios-build's archive is) — then the platform-bound tests,
#                   `./gradlew androidPlatformTest` on a Gradle-managed emulator (the Android adapters' contract bindings)
#
#                   Build and tests share a runner because together they stay under the journeys (measured: ~8 min
#                   on iOS against ~10): the critical path does not move, and a push holds one macOS runner fewer —
#                   the account gets about three. The journeys stay a job of their own; folding them in too doubled
#                   the iOS wall clock (a one-job-per-platform spike: ~21 min against ~10).
#   journeys (ios|android)   the all-real journeys against a local api/ — on iOS after the simulator app's in-app port
#                   contracts (`scripts/sim-contracts`), on Android over every real adapter it has
#                   (`scripts/android-journeys`). Scripts, not Gradle: every Gradle and Kotlin daemon
#                   must be gone before the simulator boots on the 7 GB macOS runner, and the journeys run in a bare JVM
#   metadata · api-test · migration-rehearsal · site-build    the Linux checks of the spec, deployment resolver, App
#                   Store listing, backend and site
#
# NO HAND-OFFS BETWEEN GATES: each compiles what it needs, so no gate waits on another and a red one skips nothing.
# The only artifact edges are ios-build → ios-deliver and android-build → android-deliver.
#
# DELIVERY. `ios-deliver` and `android-deliver` run on a push to main or a `workflow_dispatch` of a branch, and each
# `needs: ci`: a red gate — any gate, either platform — stops BOTH uploads, so one build number (`BUILD_NUMBER_OFFSET`)
# lands in both stores or neither, barring an upload failure. Neither posts a required check (neither runs on a PR
# push, so requiring one would freeze merges), so each is free to fail red without blocking anything. A dispatch runs
# every gate too. They reach only internal testers — TestFlight's `development` group; on Play, a push to main reaches
# the internal testing track and a dispatch an internal-app-sharing link. Real users get builds only through the
# dispatch-driven store promotion (promote.yml).
#
# Deployers stay in their own files: deploy.yml (api, site, listing text — main only), promote.yml,
# screenshots.yml, nightly-cleanup.yml, ssh-runner-macos.yml.
name: ci

on:
  push:
    # BRANCHES only. A `vX.Y` tag is a release RECEIPT created by promote.yml; it triggers nothing.
    branches: ["**"]
  # A DELIBERATE BRANCH DELIVERY (`docs/deployment.md`): dispatch this workflow on any ref and it runs every gate,
  # archives RELEASE and DELIVERS to internal TestFlight, exactly as a push to main does — the one route to a tester's
  # phone reachable only through the stores. On Play it goes out as an INTERNAL APP SHARING link in the run's summary,
  # never to the internal track: that track serves only its latest release, so a branch build there replaced main's
  # for every internal tester until the next merge. It must be marked distributed (`SNAPSYNC_CHANNEL: release`): the xcconfig
  # renderer emits the crash-reporting DSN only for a distributed build, and without it the in-app bug-report dialog
  # does not open at all (capability `privacy-security`); a TestFlight build must carry production APNs anyway.
  workflow_dispatch:
    inputs:
      what_to_test:
        description: "TestFlight 'What to Test', also shown beside the Play sharing link (blank → <branch> (<short sha>))"
        required: false
        type: string

permissions:
  contents: read

env:
  # THE BUILD NUMBER (`CFBundleVersion`, and Android's `versionCode` — one number per run, both stores) is this
  # workflow's `run_number` PLUS this offset. Builds were numbered by the
  # retired ios.yml's run number (about 1100 when it retired), and App Store Connect refuses a build number that is not
  # higher than the last one uploaded for the same version, so a fresh workflow counting from 1 could deliver nothing.
  # The offset keeps the sequence monotonic; promote.yml maps a number above it back to THIS workflow's
  # run (build − offset) and one at or below it to ios.yml's. Never lower it; never change it once a build used it.
  BUILD_NUMBER_OFFSET: 2000

# A newer push to a ref cancels its own in-progress run, main included (the next merge's build supersedes a cancelled
# delivery). The event is part of the group so a push and a dispatch on the SAME ref never cancel each other: a probe
# build killed by an unrelated push to its branch is a wasted TestFlight round-trip.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────────────────────────────────────────────

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # `./gradlew build` launches the REAL backend: `:adapter:generic:app`'s jvmTest runs the backend port contracts'
      # live bindings against `api/src/dev/serve.ts --ephemeral` (loopback only, filesystem store). Without Deno they
      # FAIL naming it; they never skip. Same pin as api-test, so both run the backend under one Deno.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Compose Desktop UI tests render offscreen under -Djava.awt.headless=true, so no X server is needed.
      - run: ./gradlew build
      # A red test's whole record: the log prints each failure's message and stack (FULL, set in the root build), the
      # XML results add its standard streams — the rig host's log lines leading up to it — and the HTML reports the rest.
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          # One artifact per attempt: a re-run's results would otherwise replace the attempt it re-runs.
          name: build-test-results-${{ github.run_attempt }}
          path: |
            **/build/test-results/
            **/build/reports/tests/
          if-no-files-found: ignore

      # The diagrams freshness check (`docs/architecture.md`). `:tools:diagrams:test` under `build` is its local half;
      # this half regenerates on a clean checkout and asks git, which also catches untracked new files and the
      # sidecar's self-staleness. A semantically-stale merge shows up as this gate red on main, fixed by a regen PR.
      - name: Regenerate diagrams
        run: ./gradlew architectureDiagrams
      - name: Fail if committed diagrams are stale
        run: |
          if [ -n "$(git status --porcelain architecture/)" ]; then
            echo "::error::architecture/ is stale — run ./gradlew architectureDiagrams and commit the result"
            git status --porcelain architecture/
            git diff architecture/
            exit 1
          fi
          echo "architecture/ is fresh"

  # The small checks with no Gradle: each runs in seconds, so one runner carries all three.
  metadata:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Keep openspec/specs the contract of record: every spec must parse and carry a normative (SHALL/MUST)
      # requirement and a scenario. Pinned, so an upstream rule change cannot turn CI red without a deliberate bump.
      # Structure, not truth: green means well-formed.
      - name: Validate the specs
        run: npx --yes @fission-ai/openspec@1.13.2 validate --specs --strict
      # The deployment resolver's own suite (`docs/deployment.md`), and the only place it runs. It once ran only in the
      # api deploy, on main, where it could only fail after a merge — and did: two required inventory keys broke 20 of
      # its tests, the PR merged clean, and production kept serving the previous bundle.
      - name: Test the deployment resolver
        run: python3 scripts/resolve_deployment_test.py
      # The App Store listing (`docs/deployment.md`), validated OFFLINE: schema, character limits, URL format. It
      # validates what will be APPLIED — the files the resolver renders from the one listing source
      # (metadata/listing/), placeholders filled — not the committed source. The apply half is deploy.yml's `appstore-metadata-apply` (main only). `asc` is a pinned,
      # checksum-verified binary (asc_fetch.sh).
      - name: Resolve the deployment
        run: python3 scripts/resolve-deployment.py prod
      - name: Fetch pinned asc
        run: bash .github/scripts/asc_fetch.sh "$RUNNER_TEMP/asc"
      - name: Validate the App Store listing
        run: '"$RUNNER_TEMP/asc" metadata validate --dir build/metadata'
      # The Play half of the same rendered listing (one source, metadata/listing/): Play has no offline validator, so
      # its character limits are ours. The apply half is android-deliver's diff-gated listing update (main only).
      - name: Validate the Google Play listing
        run: python3 scripts/validate_play_listing.py build/metadata/play

  # The backend's check set (`docs/deployment.md`). The deploy (deploy.yml's `api` job) deliberately does not repeat
  # it: no commit reaches main without this having passed. It once lived in the deploy only, where a PR that broke the
  # backend merged, and the deploy then failed on main with production silently serving the previous bundle.
  api-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Every rendering is generated and none is committed, so the checks below would hit a missing module without
      # this. A SEPARATE invocation, so it cannot widen the permissions the suite runs under.
      - name: Resolve the deployment
        run: python3 scripts/resolve-deployment.py prod
      - name: Format check
        working-directory: api
        run: deno fmt --check
      - name: Lint
        working-directory: api
        run: deno lint
      # All source, explicitly: `deno test` checks only test-reachable code. The task (deno.json) is the one place the
      # type-checked directories are listed.
      - name: Type check
        working-directory: api
        run: deno task check
      # --allow-net stays ABSENT from the task: that absence is what guarantees no test can reach the real bunny zone.
      - name: Test
        working-directory: api
        run: deno task test
      # The committed schema snapshot must be exactly what replaying `api/migrations/*.sql` produces: a reviewer reads
      # its diff, and the deploy asserts the live store against it. Freshness, not correctness.
      - name: Schema snapshot is current
        working-directory: api
        run: deno task schema:check
      # An import that does not resolve, or a bundle past the Edge Scripting 10 MB limit, fails here, not on main.
      - name: Bundle
        working-directory: api
        run: deno task bundle
      # The stamp is what the deploy's post-publish boot probe matches, so a resolver that stopped stamping fails here
      # rather than after a bad script is live.
      - name: Verify the bundle carries this commit
        working-directory: api
        run: |
          grep -q "${{ github.sha }}" dist/main.js || {
            echo "::error::dist/main.js does not carry ${{ github.sha }} — the resolver did not stamp it"
            exit 1
          }

  # Rehearse a migration change against a pseudonymised copy of the deployed store (`docs/deployment.md`, "Gates").
  # The deploy is otherwise the first place a migration meets the real store — after merge, where a failure rolls back
  # and nothing gates (c19b6c4b's comment edits to applied migrations failed three deploys in a row). So a branch that
  # changes anything under `api/migrations/` (against the MERGE BASE) runs the SAME `bunny db migrations apply` the
  # deploy runs, against a local libSQL server holding a copy of the store, then the same shape assertion. A
  # conditional STEP, not a path filter: the job must post on every branch.
  #
  # The copy is pseudonymised in memory and never written down (`rehearsal-copy.ts`); the credential is the READ-ONLY
  # database token — a push-triggered job on every branch must never hold the deploy's. The CLI refuses unencrypted
  # URLs, so the local `sqld` sits behind a loopback TLS proxy with a throwaway CA (`tls-proxy.ts`).
  migration-rehearsal:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Did this branch change a migration?
        id: diff
        run: |
          if git diff --quiet origin/main...HEAD -- api/migrations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing under api/migrations/ differs from the merge base with main — nothing to rehearse"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat origin/main...HEAD -- api/migrations/
          fi
      - uses: denoland/setup-deno@v2
        if: steps.diff.outputs.changed == 'true'
        with:
          deno-version: v2.x
      # Unpinned, as in deploy.yml: the rehearsal must run the CLI the deploy will run.
      - name: Install the bunny CLI
        if: steps.diff.outputs.changed == 'true'
        run: npm install -g @bunny.net/cli
      # sqld 0.24.33, pinned by digest: the stand-in for the deployed store must not move under a rehearsal.
      - name: Start a local libSQL server behind TLS
        if: steps.diff.outputs.changed == 'true'
        run: |
          docker run -d --name sqld -p 127.0.0.1:8080:8080 \
            ghcr.io/tursodatabase/libsql-server@sha256:134f3a465ade779e417b258d8e4fbfa8ca0a3212a2dbe83457b2fa104b75d54a
          tls="$RUNNER_TEMP/rehearsal-tls"; mkdir -p "$tls"; cd "$tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj /CN=rehearsal-ca -keyout ca.key -out ca.pem 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=localhost \
            -keyout srv.key -out srv.csr 2>/dev/null
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > ext
          openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 \
            -extfile ext -out srv.pem 2>/dev/null
          nohup deno run --allow-net --allow-read "$GITHUB_WORKSPACE/api/src/scripts/tls-proxy.ts" \
            srv.pem srv.key 8443 http://127.0.0.1:8080 > proxy.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf --cacert ca.pem https://localhost:8443/health >/dev/null && break
            sleep 0.5
          done
          curl -sf --cacert ca.pem https://localhost:8443/health >/dev/null || {
            echo "::error::the local libSQL server never answered through the TLS proxy"
            docker logs sqld | tail -20; cat proxy.log
            exit 1
          }
          echo "NODE_EXTRA_CA_CERTS=$tls/ca.pem" >> "$GITHUB_ENV"
      - name: Copy the deployed store, pseudonymised
        if: steps.diff.outputs.changed == 'true'
        working-directory: api
        env:
          BUNNY_DATABASE_URL: ${{ secrets.BUNNY_DATABASE_URL }}
          BUNNY_DATABASE_AUTH_TOKEN: ${{ secrets.BUNNY_DATABASE_READONLY_TOKEN }}
          REHEARSAL_DATABASE_URL: http://127.0.0.1:8080
        run: deno run --allow-net --allow-env --allow-read src/scripts/rehearsal-copy.ts
      - name: Apply the migrations, as the deploy will
        if: steps.diff.outputs.changed == 'true'
        working-directory: api
        run: bunny db migrations apply --dir migrations --url libsql://localhost:8443 --token rehearsal --force
      - name: The migrated copy has the schema the migrations build
        if: steps.diff.outputs.changed == 'true'
        working-directory: api
        env:
          BUNNY_DATABASE_URL: http://127.0.0.1:8080
          BUNNY_DATABASE_AUTH_TOKEN: rehearsal
        run: deno run --allow-net --allow-env --allow-read src/scripts/assert-schema.ts

  # The site (capability web-site): type-check, formatting, self-containment. The deploy (deploy.yml's `site` job)
  # builds again for its output but does not repeat the checks.
  site-build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # `check:selfcontained` runs under Deno.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The site reads the resolved deployment for its canonical URLs; renderings are generated, never committed.
      - name: Resolve the deployment
        run: python3 scripts/resolve-deployment.py prod
      - name: Install
        working-directory: site
        run: npm ci
      # Fails if astro:assets cannot process the screenshots, so a broken capture or import is caught before main.
      - name: Build
        working-directory: site
        run: npm run build
      #   check:types        — astro check (TS type-checking of the .astro pages + island)
      #   check:fmt          — prettier --check
      #   check:selfcontained — Deno: fail on any off-origin subresource (load-bearing for /join privacy)
      - name: Check
        working-directory: site
        run: npm run check

  # ── The platforms: build · test · journeys ───────────────────────────────────────────────────────────────────────

  # The signed device archive (macos-26, GM Xcode). It compiles the shipping iosArm64 framework, Swift, entitlements and
  # signing, so it IS the device gate — and on a delivering run it is the delivery source. Signing on every push is
  # deliberate: a signing or entitlement break must fail before merge, not on main's delivery.
  #
  # Configuration is keyed on whether the run DELIVERS: a push to main or a dispatch archives RELEASE; every other push
  # archives DEBUG, the identical compile surface minus the LLVM optimization pass that dominates the Release link
  # (~5-9.5 min) on an archive that is discarded. Trade-off (accepted): a Release-only failure surfaces on main, where
  # it stops the delivery; the pre-merge escape is a dispatch, which takes the Release path in full.
  #
  # Signing: TWO persistent certs — Apple Distribution (SIGNING_CERT_*) and Apple Development (SIGNING_DEV_CERT_*) —
  # are imported into one keychain, and `-allowProvisioningUpdates` manages the profiles through the App Store Connect
  # API key. Both, because an empty keychain makes automatic signing mint a NEW cert every run, exhausting Apple's
  # per-account cap, and `xcodebuild archive` provisions a development identity beside the distribution one. The
  # scaffolding lives in .github/actions/ios-archive (a composite action keeps this job's name; a reusable workflow
  # would prefix it).
  ios-build:
    # `actions: write`: the `-device-` ~/.konan save reclaims the entries it supersedes.
    permissions:
      contents: read
      actions: write
    # Build-scope values, read by EVERY resolver invocation in this job — the explicit step below and the one
    # `:domain` performs at Gradle configuration time — which is what makes re-resolving idempotent. `channel` is the
    # single discriminator the xcconfig renderer derives APS_ENVIRONMENT / APNS_ENV / SENTRY_ENVIRONMENT from, and it
    # gates the DSN: the renderer emits none unless the channel names a distributed build, so a stray secret cannot
    # arm crash reporting on a branch-gate archive.
    env:
      SNAPSYNC_CHANNEL: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'release' || 'dev' }}
      SENTRY_DSN: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && secrets.SENTRY_DSN || '' }}
    runs-on: macos-26
    steps:
      # fetch-tags so the marketing-version computation below can see the release tags (vX.Y).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
      # The upload host is NEVER overridden: every ref bakes the resolved deployment's. A dev build aimed at another
      # backend is built on the dev build loop (`ssh-mac-build`) instead.
      - name: Select build configuration
        env:
          DELIVERING: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DELIVERING" = "true" ]; then
            echo "BUILD_CONFIG=Release" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONFIG=Debug" >> "$GITHUB_ENV"
          fi
      # Render the deployment BEFORE anything reads it: `Config.xcconfig` hard-`#include`s the generated fragment.
      - name: Resolve the deployment
        run: python3 scripts/resolve-deployment.py prod
      # MARKETING_VERSION = max(floor, latest vX.Y tag with its minor + 1) — `scripts/marketing-version.py`, the ONE rule
      # `android-build` runs too, so both stores receive the same version for the same commit. A promoted build's store
      # version is DERIVED from this value. A Debug archive leaves it empty (the floor): it never reaches App Store
      # Connect.
      - name: Compute marketing version
        run: |
          if [ "$BUILD_CONFIG" != "Release" ]; then
            echo "MARKETING_VERSION_OUT=" >> "$GITHUB_ENV"
            echo "dev/Debug build — marketing version left to the Config.xcconfig floor"
            exit 0
          fi
          VERSION="$(python3 scripts/marketing-version.py)"
          echo "MARKETING_VERSION_OUT=$VERSION" >> "$GITHUB_ENV"
          echo "computed marketing version: $VERSION"
      - name: Compute the build number
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
      # Build number = the run number + the offset (see `BUILD_NUMBER_OFFSET`). APNs environment and the DSN are NOT
      # passed: they are derived into the deployment fragment from `channel`, and an xcodebuild override would let
      # them disagree.
      - name: Archive signed device app
        id: archive
        uses: ./.github/actions/ios-archive
        with:
          build-config: ${{ env.BUILD_CONFIG }}
          marketing-version: ${{ env.MARKETING_VERSION_OUT }}
          current-project-version: ${{ env.BUILD_NUMBER }}
          archive-path: ${{ runner.temp }}/SnapSync.xcarchive
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
          signing-cert-p12-base64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          signing-cert-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
          signing-dev-cert-p12-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          signing-dev-cert-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}
      # Assert the built BUNDLES carry the resolved deployment — read back out of the archive, not checked on the
      # generator's output. A renderer test proves the intended bytes were emitted and cannot see a grammar that
      # reinterprets them (the DSN was once truncated at its `//` to `https:` and shipped four mute TestFlight builds
      # with every unit test green) nor a resource that never reached a bundle.
      #
      # BOTH bundles, because each process reads its OWN `Deployment.plist`; a copy missing from one fails all four
      # values in that process at once, silently. The FIFTH value, `BackgroundUploadURLBase`, lives in each bundle's
      # Info.plist because `assetsd` reads it there to validate the upload registration (absent, the OS never launches
      # the extension); it must EQUAL `Deployment.plist`'s `uploadBase`. The two reach the bundle by different routes
      # (a Python-rendered plist; an xcconfig, which truncates at `//`), so their equality is a differential test of
      # the grammar — a prefix test would pass on an empty or truncated value.
      - name: Verify the archive baked the resolved deployment
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SnapSync.xcarchive/Products/Applications/SnapSync.app"
          APPEX="$APP/Extensions/BackgroundUploadExtension.appex"   # iOS 26 uses Extensions/, not PlugIns/
          prop() { sed -n "s/^$1=//p" build/deployment.properties; }
          pb() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null || true; }

          DOMAIN="$(prop domain)"
          [ -n "$DOMAIN" ] || { echo "::error::the resolver produced no domain"; exit 1; }
          if [ "$SNAPSYNC_CHANNEL" = "release" ]; then EXPECT_APNS=production; EXPECT_ENV=production
          else EXPECT_APNS=sandbox; EXPECT_ENV=development; fi

          for BUNDLE_DIR in "$APP" "$APPEX"; do
            NAME="$(basename "$BUNDLE_DIR")"
            DEP="$BUNDLE_DIR/Deployment.plist"
            [ -f "$DEP" ] || { echo "::error::$NAME carries no Deployment.plist — the resource did not reach this bundle"; exit 1; }

            BASE="$(pb "$DEP" uploadBase)"
            APNS="$(pb "$DEP" apnsEnv)"
            SENV="$(pb "$DEP" sentryEnvironment)"
            ID="$(pb "$BUNDLE_DIR/Info.plist" CFBundleIdentifier)"
            INFOBASE="$(pb "$BUNDLE_DIR/Info.plist" BackgroundUploadURLBase)"
            echo "$NAME: base=$BASE infoBase=$INFOBASE apns=$APNS sentryEnv=$SENV id=$ID"

            [ "$BASE" = "https://$DOMAIN/api/v2" ] || { echo "::error::$NAME upload base '$BASE' is not https://$DOMAIN/api/v2"; exit 1; }
            [ -n "$INFOBASE" ] || { echo "::error::$NAME Info.plist carries no BackgroundUploadURLBase — assetsd validates the registration insert against this key and refuses with a bare PHPhotosErrorDomain -1 without it"; exit 1; }
            [ "$INFOBASE" = "$BASE" ] || { echo "::error::$NAME Info.plist BackgroundUploadURLBase '$INFOBASE' does not equal Deployment.plist uploadBase '$BASE'"; exit 1; }
            [ "$APNS" = "$EXPECT_APNS" ] || { echo "::error::$NAME apnsEnv is '$APNS', expected '$EXPECT_APNS'"; exit 1; }
            [ "$SENV" = "$EXPECT_ENV" ] || { echo "::error::$NAME sentryEnvironment is '$SENV', expected '$EXPECT_ENV'"; exit 1; }
            [ -n "$ID" ] || { echo "::error::$NAME CFBundleIdentifier is empty — the fragment did not resolve"; exit 1; }

            # The DSN is COMPARED, never echoed. Absence is the off-switch, so an undistributed build must carry none.
            DSN="$(pb "$DEP" sentryDsn)"
            if [ "$SNAPSYNC_CHANNEL" = "release" ]; then
              if [ -z "$DSN" ] || [ "$DSN" != "$SENTRY_DSN" ]; then
                echo "::error::$NAME sentryDsn does not match the resolved DSN (present=$([ -n "$DSN" ] && echo yes || echo no))"; exit 1
              fi
              echo "$NAME: sentryDsn matches the resolved value"
            else
              [ -z "$DSN" ] || { echo "::error::$NAME carries a DSN on an undistributed build"; exit 1; }
              echo "$NAME: no sentryDsn, as expected off a distributed channel"
            fi
          done
      # The platform-bound tests, on this same runner after the archive (`docs/testing.md`, "Where each test runs"):
      # every module's `iosTest` on a booted simulator (iOS 26 runtime on macos-26) — the iOS adapters and their
      # contract bindings on the unentitled test executable (IOS_SIM_KEXE), and the native SQLite drivers behind the
      # storage contracts. Here rather than in a job of their own: together with the archive they take ~8 min, under
      # `journeys (ios)`, so the critical path does not move and a push holds one macOS runner fewer (the account gets
      # about three).
      - name: Platform tests on the simulator
        run: ./gradlew iosPlatformTest
      # One `-device-` entry for this job: the archive action restored it, and it is saved only here, after the tests,
      # so it carries the simulator caches they built as well as the device ones.
      - name: Save Kotlin/Native (~/.konan)
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/konan-save
        with:
          family: device
          key: ${{ steps.archive.outputs.konan-key }}
      # Hand the archive to ios-deliver on a delivering run. TAR first: upload-artifact zips its payload and drops
      # executable bits and symlinks, which would corrupt the signed bundle and break `-exportArchive`.
      - name: Pack the signed archive for delivery
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        run: tar -czf "$RUNNER_TEMP/SnapSync.xcarchive.tar.gz" -C "$RUNNER_TEMP" SnapSync.xcarchive
      - name: Upload the signed archive for delivery
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-archive
          path: ${{ runner.temp }}/SnapSync.xcarchive.tar.gz
          # A build intermediate for the next job of this run, in a public repo: one day, then gone.
          retention-days: 1
          if-no-files-found: error

  android-build:
    runs-on: ubuntu-26.04
    steps:
      # fetch-tags so the marketing-version computation below can see the release tags (vX.Y).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # The version and build number BOTH stores receive for this run (`docs/deployment.md`): the build number is
      # ios-build's `CFBundleVersion`, and `scripts/marketing-version.py` is the rule ios-build runs. Off a delivering
      # run the version stays the Config.xcconfig floor, as on iOS.
      - name: Compute the version and build number
        env:
          DELIVERING: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
          echo "DELIVERING=$DELIVERING" >> "$GITHUB_ENV"
          if [ "$DELIVERING" = "true" ]; then
            VERSION="$(python3 scripts/marketing-version.py)"
            echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
            echo "VERSION_ARG=-Psnapsync.versionName=$VERSION" >> "$GITHUB_ENV"
            echo "computed marketing version: $VERSION"
          else
            echo "VERSION_ARG=" >> "$GITHUB_ENV"
          fi
      # The store build: R8 BUILDS over it here; that R8 output RUNS is the journeys' (they run the rig release). A
      # delivering run also builds the BUNDLE Play receives — from this same R8 run, so the mapping kept for it is the
      # bundle's — marked distributed so the resolver bakes the crash-reporting DSN (`docs/deployment.md`). The channel
      # and the DSN are this STEP's only, so the platform tests below resolve the ordinary dev channel.
      - name: Build the store release
        env:
          SNAPSYNC_CHANNEL: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'release' || 'dev' }}
          SENTRY_DSN: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && secrets.SENTRY_DSN || '' }}
        run: |
          TASKS=":app:android:assembleRelease"
          if [ "$DELIVERING" = "true" ]; then TASKS="$TASKS :app:android:bundleRelease"; fi
          # $VERSION_ARG is unquoted on purpose: empty, it must be no argument at all.
          ./gradlew $TASKS -Psnapsync.versionCode="$BUILD_NUMBER" $VERSION_ARG
      # Assert the BUNDLE carries the DSN — read out of its dex, not off the generator: the DSN once reached a grammar
      # that truncated it and shipped mute builds with every test green. COMPARED, never echoed.
      - name: Verify the bundle baked the DSN
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          [ -n "$SENTRY_DSN" ] || { echo "::error::the SENTRY_DSN secret is empty"; exit 1; }
          if unzip -p app/android/build/outputs/bundle/release/android-release.aab 'base/dex/*.dex' | grep -q -a -F "$SENTRY_DSN"; then
            echo "the bundle carries the resolved DSN"
          else
            echo "::error::the bundle's dex does not carry the resolved DSN"; exit 1
          fi
      # Hand the UNSIGNED bundle, its R8 mapping and the version it was built with to android-deliver, which signs,
      # keeps the mapping and uploads. The version travels with the bundle so the release's name cannot disagree.
      - name: Record the bundle's version
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        run: echo "$VERSION_NAME" > app/android/build/outputs/version.txt
      - name: Upload the bundle for delivery
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-bundle
          path: |
            app/android/build/outputs/bundle/release/android-release.aab
            app/android/build/outputs/mapping/release/mapping.txt
            app/android/build/outputs/version.txt
          # A build intermediate for the next job of this run: one day, then gone.
          retention-days: 1
          if-no-files-found: error
      # The platform-bound tests, on this same runner after the build: `:adapter:android`'s device tests on a
      # Gradle-managed Pixel 6 / API 36 emulator, with the upload contract's transfer fixture served on the host by
      # the build. The hosted runner exposes /dev/kvm to root only; the managed emulator needs it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Platform tests on the managed emulator
        run: ./gradlew androidPlatformTest
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-build-reports-${{ github.run_attempt }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            build/transfer-fixture.log
          if-no-files-found: ignore

  # The all-real journeys against a local api/ (`docs/testing.md`, "All-real journeys are the contracts' safety net"),
  # the second member played by the journey itself over the backend's public HTTP surface. ONE simulator or emulator,
  # built before it boots: a second fresh simulator's first-boot work swamped the 3-vCPU runner
  # (`changes/archive/2026-09-25-one-simulator-journeys`).
  journeys:
    name: journeys (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runs-on: macos-26
          - platform: android
            runs-on: ubuntu-26.04
    runs-on: ${{ matrix.runs-on }}
    # `actions: write`: on main the iOS cell reclaims its superseded ~/.konan entries, the Android cell its system images.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # The real backend the journeys run against, served locally on the address the `local` deployment bakes in.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # iOS: first the port contracts whose bindings live in the APP — the simulator app is the only simulator process
      # `applesimutils` can grant photo access to, so it is where PhotoKit runs under a real full grant
      # (IOS_SIM_APP) — then the journeys, on the same app (`scripts/sim-contracts`, which builds, boots and runs).
      - name: Restore Kotlin/Native (~/.konan)
        id: konan
        if: matrix.platform == 'ios'
        uses: ./.github/actions/konan-restore
        with:
          family: sim-journeys
      - name: Run the simulator app's port contracts and the journeys
        if: matrix.platform == 'ios'
        # The rig property goes into the RUNNER's ~/.gradle, never a tracked file: a committed `snapsync.rig=true`
        # would link the control channel into every shipped build. Spotlight indexes build outputs as they are written
        # on this 3-vCPU runner (~26 s of CPU in the build, ~45 s while the simulator settled, run 36177197880); the
        # runner is discarded, so switching it off costs nothing. Here, not in the script, which also runs on Macs.
        run: |
          mkdir -p ~/.gradle && printf "snapsync.rig=true\n" >> ~/.gradle/gradle.properties
          sudo mdutil -a -i off >/dev/null || true
          scripts/sim-contracts
      - name: Save Kotlin/Native (~/.konan)
        if: matrix.platform == 'ios' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/konan-save
        with:
          family: sim-journeys
          key: ${{ steps.konan.outputs.key }}

      # Android: the rig RELEASE build (R8 as the store build runs it, so every journey exercises R8 output) baked for
      # the local backend, and the journeys' classpath, built BEFORE the emulator boots and with the daemons stopped
      # after, so the two never hold memory at once; then the emulator and `scripts/android-journeys`.
      - name: Build the rig app and the journeys
        if: matrix.platform == 'android'
        run: |
          ./gradlew :app:android:assembleRelease :test:integration:journeysClasses :test:integration:journeysClasspath \
            -Psnapsync.rig=true -Psnapsync.deployment=local
          ./gradlew --stop
      - name: Enable KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The system image is not on the runner image (~1 min to download each run), so it is cached — written on main
      # only, as ~/.konan is, and keyed by the installed image's fingerprint, so restore and save are split: a stable
      # primary key would always hit and never pick up a new revision. The emulator itself ships on the runner image.
      - name: Restore the Android system image
        if: matrix.platform == 'android'
        id: sysimg-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-36/google_apis/x86_64
          key: android-sysimg-36-google_apis-x86_64-
          restore-keys: android-sysimg-36-google_apis-x86_64-
      # Retried downloads ahead of the emulator action's own, which never retry (`.github/scripts/android_sdk_install.sh`).
      - name: Install the emulator and the system image
        if: matrix.platform == 'android'
        id: sysimg
        run: bash .github/scripts/android_sdk_install.sh 'system-images;android-36;google_apis;x86_64'
      - name: Save the Android system image
        if: matrix.platform == 'android' && github.ref == 'refs/heads/main' && steps.sysimg-restore.outputs.cache-matched-key != format('android-sysimg-36-google_apis-x86_64-{0}', steps.sysimg.outputs.fingerprint)
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-36/google_apis/x86_64
          key: android-sysimg-36-google_apis-x86_64-${{ steps.sysimg.outputs.fingerprint }}
      # One entry is ~1.5 GB of a full 10 GB budget: drop the revisions the save above superseded.
      - name: Reclaim superseded system-image entries
        if: matrix.platform == 'android' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: android-sysimg-36-google_apis-x86_64-${{ steps.sysimg.outputs.fingerprint }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&key=android-sysimg-" \
            --jq ".actions_caches[] | select(.key != \"$KEEP\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent; done
      - name: Run the journeys on the emulator
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # The phone the `snapsync-android` skill's emulator models, and the managed device `android-build` tests on.
          profile: pixel_6
          # `swangle_indirect`, not the default SwiftShader GLES: the latter segfaults in its JIT on some hosts
          # (measured on the dev box, emulator 36.1.9 and 37.1.11); the Vulkan path boots on both.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle_indirect -memory 3072
          disable-animations: true
          script: scripts/android-journeys

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          # One artifact per attempt: a re-run's evidence would otherwise replace the attempt it re-runs.
          name: journeys-${{ matrix.platform }}-evidence-${{ github.run_attempt }}
          path: |
            build/sim-contracts/
            build/android-journeys/
          if-no-files-found: ignore

  # ── The aggregate ───────────────────────────────────────────────────────────────────────────────────────

  # `always()` so it posts whatever the gates did: a gate that failed, was cancelled or was skipped fails it. Without
  # `always()` a red gate would SKIP this job, and a skipped required check counts as passing.
  ci:
    needs: [build, metadata, api-test, migration-rehearsal, site-build, ios-build, android-build, journeys]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every gate succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null || {
            echo "::error::a gate did not succeed"
            exit 1
          }

  # ── Delivery ─────────────────────────────────────────────────────────────────────────────────────────────────────

  # TestFlight delivery — a push to main, or a dispatch — once EVERY gate is green (`needs: ci`). It compiles nothing:
  # it re-signs and packages the archive ios-build produced, so the build number it delivers is this run's.
  ios-deliver:
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    steps:
      # Needed for iosApp/ExportOptions.plist (the export method + signing style).
      - uses: actions/checkout@v7.0.1
      # The number ios-build baked into the archive (see `BUILD_NUMBER_OFFSET`).
      - name: Compute the build number
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Generate ephemeral keychain password
        run: |
          PW="$(openssl rand -base64 24)"
          echo "::add-mask::$PW"
          echo "KEYCHAIN_PW=$PW" >> "$GITHUB_ENV"
      # BOTH certs here too, for the cert-cap reason on ios-build: the export runs `-allowProvisioningUpdates`.
      - name: Import Distribution signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
          keychain: snapsync-signing
          keychain-password: ${{ env.KEYCHAIN_PW }}
      - name: Import Development signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}
          keychain: snapsync-signing
          create-keychain: false
          keychain-password: ${{ env.KEYCHAIN_PW }}
      - name: Download the signed archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: ios-archive
          path: ${{ runner.temp }}
      - name: Unpack the signed archive
        run: tar -xzf "$RUNNER_TEMP/SnapSync.xcarchive.tar.gz" -C "$RUNNER_TEMP"
      # Crash-report symbolication (capability `privacy-security`): Bugsink ingests no dSYMs, so each delivered build's
      # symbols stay fetchable BY BUILD NUMBER (the `/bugsink` skill reads them). 90 days is the platform's maximum.
      - name: Publish dSYMs for crash symbolication
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsyms-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/SnapSync.xcarchive/dSYMs
          retention-days: 90
          if-no-files-found: error
      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      # The "What to Test" note (`.github/scripts/delivery_note.sh`, the same note android-deliver gives Play). It
      # reaches the publish step ONLY through $GITHUB_ENV.
      - name: Compose the release note
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          NOTE="$(bash .github/scripts/delivery_note.sh)"
          echo "note: $NOTE"
          echo "WHATS_NEW=$NOTE" >> "$GITHUB_ENV"
      # Upload + note are ONE atomic publish: codemagic's `publish` uploads, waits for the build to become
      # discoverable, and attaches the beta test info. No --testflight / submit flag: no beta-review submission and no
      # group assignment. macos-26's python3 is PEP-668 externally-managed, so `pipx run` gives it its own venv.
      - name: Upload to TestFlight with the release note
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          pipx run --spec codemagic-cli-tools app-store-connect publish \
            --path "$RUNNER_TEMP/export/SnapSync.ipa" \
            --whats-new "$WHATS_NEW"

  # Play delivery — the same runs and the same gate as ios-deliver (`needs: ci`), so a build number lands in both
  # stores or neither, barring an upload failure. It compiles nothing: it signs the bundle android-build built with the
  # UPLOAD key and, on a push to main, uploads it to the INTERNAL testing track (Play re-signs it with the app signing
  # key). A dispatch uploads it through INTERNAL APP SHARING instead and leaves the track alone, since the track serves
  # only its latest release; Play re-signs a sharing build with a separate key of its own. Prod's attestation pins
  # both certificates. Like ios-deliver it posts no required check and may fail red without blocking anything.
  android-deliver:
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    steps:
      # For the release note's fallback, the package name and the Play script.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Compute the version and build number
        run: |
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
          echo "PACKAGE=$(jq -r .androidPackageName deployments/components/android.json)" >> "$GITHUB_ENV"
      - name: Download the bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: android-bundle
          path: ${{ runner.temp }}/android
      # Crash-report retracing (capability `privacy-security`): Bugsink takes no mapping, and Play is not given one, so
      # each delivered build's R8 mapping stays fetchable BY BUILD NUMBER — an Android crash report's `dist` — for the
      # `/bugsink` skill. 90 days is the platform's maximum, as for `dsyms-<build>`.
      - name: Publish the R8 mapping for crash retracing
        uses: actions/upload-artifact@v7.0.1
        with:
          name: r8-mapping-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/android/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error
      # The upload key: a PKCS12 store whose one key is aliased `upload`, its password the store's. Written to the
      # runner's temp only, for this step, and the password reaches jarsigner through the environment.
      - name: Sign the bundle with the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/upload.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          AAB="$RUNNER_TEMP/android/bundle/release/android-release.aab"
          jarsigner -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            "$AAB" upload
          rm -f "$KEYSTORE"
          # `-verify` exits 0 on an UNSIGNED jar too, so its verdict is read, not its status.
          jarsigner -verify "$AAB" | grep -q '^jar verified\.' || { echo "::error::the bundle is not signed"; exit 1; }
      - name: Compose the release note
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          NOTE="$(bash .github/scripts/delivery_note.sh)"
          echo "note: $NOTE"
          echo "RELEASE_NOTE=$NOTE" >> "$GITHUB_ENV"
      # THE STORE LISTING (`docs/deployment.md`, "Listing metadata"), on MAIN ONLY: Play's listing is not per-track, so a
      # dispatched branch's draft copy must never reach it. The text is rendered from metadata/listing/ (and checked
      # against Play's limits, as the `metadata` gate did), the icon and feature graphic are the committed ones, and the
      # phone screenshots are composited here from screenshots/android/ with the shared headlines. The upload below
      # compares each with what Play holds and sends only a difference, so most merges send nothing to review.
      # ImageMagick 6 is ubuntu's (`convert`); the composite is byte-stable, which is what the comparison relies on.
      - name: Render the store listing and its images
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y imagemagick fonts-liberation
          python3 scripts/resolve-deployment.py prod --quiet
          python3 scripts/validate_play_listing.py build/metadata/play
          IMAGES="$RUNNER_TEMP/play-images"
          mkdir -p "$IMAGES/phoneScreenshots"
          cp metadata/play/images/icon.png metadata/play/images/featureGraphic.png "$IMAGES/"
          TARGET=play OUT_DIR="$RUNNER_TEMP/play-shots" bash .github/scripts/compose_screenshots.sh en-US
          cp "$RUNNER_TEMP/play-shots/en-US/"*.png "$IMAGES/phoneScreenshots/"
          echo "LISTING_ARGS=--listing build/metadata/play --images $IMAGES" >> "$GITHUB_ENV"
      # play_release.py's dependencies are declared inline (PEP 723) and resolved by `uv run`.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      # ONE Play edit: upload, the internal track's one release (named `<version> (<build>)`), the store listing's
      # differences, commit — or nothing. A rejected listing therefore fails the delivery too: the edit lands whole or not.
      - name: Upload to the Play internal track with the release note
        if: github.event_name == 'push'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # The listing's public contact email: the same address as the App Store's review contact, a secret only so
          # that it stays out of this public repo.
          PLAY_CONTACT_EMAIL: ${{ secrets.ASC_REVIEW_CONTACT_EMAIL }}
        run: |
          VERSION="$(cat "$RUNNER_TEMP/android/version.txt")"
          # shellcheck disable=SC2086
          uv run .github/scripts/play_release.py deliver "$PACKAGE" \
            "$RUNNER_TEMP/android/bundle/release/android-release.aab" internal "$VERSION ($BUILD_NUMBER)" "$RELEASE_NOTE" \
            $LISTING_ARGS
      # A DISPATCH: no edit, no track, no listing — the bundle goes through internal app sharing, and the install link
      # goes to the run's summary. The script refuses a build Play signed with a certificate android.json does not
      # accept, since prod would refuse that app's attestation. Installing needs the Play Store's "Internal app sharing"
      # toggle on the phone and an address on the Console's tester list (`docs/deployment.md`).
      - name: Share the bundle through Play internal app sharing
        id: share
        if: github.event_name == 'workflow_dispatch'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          uv run .github/scripts/play_release.py share "$PACKAGE" \
            "$RUNNER_TEMP/android/bundle/release/android-release.aab" deployments/components/android.json
      - name: Put the install link in the summary
        if: always() && github.event_name == 'workflow_dispatch' && steps.share.outputs.link != ''
        env:
          LINK: ${{ steps.share.outputs.link }}
          SHARED: ${{ steps.share.outcome }}
        run: |
          VERSION="$(cat "$RUNNER_TEMP/android/version.txt")"
          {
            echo "## Android build $BUILD_NUMBER — internal app sharing"
            echo
            if [ "$SHARED" = success ]; then
              echo "### [Install $VERSION ($BUILD_NUMBER) from Google Play]($LINK)"
            else
              echo "⚠️ **Prod refuses this build's signing certificate** — it installs, but cannot create or join an event: $LINK"
            fi
            echo
            echo "\`$GITHUB_REF_NAME\` at \`${GITHUB_SHA:0:7}\` — $RELEASE_NOTE"
            echo
            echo "Opens in the Play Store on a phone whose account is on the Console's internal-app-sharing list, with"
            echo "the Store's \"Internal app sharing\" toggle on. A phone holding the Play-installed app must uninstall it first"
            echo "if Play refuses the different signature."
          } >> "$GITHUB_STEP_SUMMARY"
