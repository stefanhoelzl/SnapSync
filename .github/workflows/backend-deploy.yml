name: backend-deploy

# Deploys the backend/ upload endpoint to bunny Edge Scripting — the ONE runtime. The device-facing host
# is the custom domain `snapsync.stho.net` (we own it via Bunny DNS), CNAME'd to the pull zone fronting
# the Edge Script. Path-scoped to the backend sources, isolated from the Gradle/iOS workflows, and gated
# on green Deno fmt/lint/check/test. Capability: backend-deployment.
#
# This workflow ships CODE ONLY — it configures nothing. bunny issues no scoped API key (writing an Edge
# Script's env vars needs the full-access ACCOUNT key, which also owns the photo storage zone and our DNS
# zone), so CI holds only the script-scoped deploy key. That is precisely why every non-secret config
# value is a SOURCE CONSTANT (backend/src/config.ts): config ships in the bundle with the code that reads
# it, and cannot drift. Only two SECRETS live in the Edge Script env, set once by hand.
#
# There is deliberately no post-deploy boot probe: `POST /code` + `POST /publish` succeed whether or not
# the script can boot, so a green run here does NOT prove the script serves. That was how the previous
# Deno-Deploy-era config drift went unnoticed for two weeks. Prevention (config in source) replaces it —
# so do NOT reintroduce platform-side required config without also reintroducing a probe.

on:
  push:
    paths:
      - "backend/**"
      # The served page embeds images DERIVED from these raws at build time (`deno task shots`), so a
      # capture refresh must redeploy — otherwise the live page keeps serving the previous screenshots
      # until some unrelated backend change happens to ship. The widening is exact, not a guess at a
      # dependency graph: this path IS the derive's input. Capability `marketing-site`.
      - "screenshots/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The landing page's screenshots are DERIVED from the committed raws in screenshots/ (capability
      # `marketing-site`) and are NOT committed — they are build output. Every step below that reads src/
      # therefore needs this first: `deno check`, `deno test` and `deno bundle` all resolve
      # `src/shots.generated.ts`, and without it the type-check fails on an unresolved import.
      #
      # It is a step here rather than folded into the deno.json tasks because THIS workflow invokes deno
      # directly (`deno check src/*.ts`, not `deno task check`) — deliberately, so what CI runs is legible
      # here rather than indirected through a task alias.
      #
      # Pure WASM (@jsquash), so it needs no system dependency — the same property that keeps a fresh clone
      # checkable with only Deno installed.
      - name: Derive the landing page's screenshots
        working-directory: backend
        run: deno task shots

      # --- Test gate: deploy runs only if these pass ---
      - name: Format check
        working-directory: backend
        run: deno fmt --check

      - name: Lint
        working-directory: backend
        run: deno lint

      # Type-check all source explicitly. `deno test` only checks test-reachable code, so this
      # covers main.ts/SDK wiring (no test imports it) and any future orphan source file.
      - name: Type check
        working-directory: backend
        run: deno check src/*.ts

      - name: Test
        working-directory: backend
        run: deno test

      # Bundle to a single file — the deploy action uploads the file as-is (no bundling). Must stay
      # within the Edge Scripting 10 MB script limit.
      - name: Bundle
        working-directory: backend
        run: deno bundle src/main.ts -o dist/main.js

      # --- Deploy: main only. Feature-branch pushes run the checks (incl. bundle) but do not ship
      #     to the single live script. Idempotent: re-deploys overwrite the same script_id. ---
      - name: Deploy to bunny Edge Scripting
        if: github.ref == 'refs/heads/main'
        uses: BunnyWay/actions/deploy-script@main
        with:
          script_id: ${{ secrets.BUNNY_SCRIPT_ID }}
          deploy_key: ${{ secrets.BUNNY_DEPLOY_KEY }}
          file: backend/dist/main.js
