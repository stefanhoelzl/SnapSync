name: backend-deploy

# Deploys the backend/ upload endpoint to bunny Edge Scripting.
# Path-scoped to the backend sources, isolated from the Gradle/iOS workflows, and gated on green
# Deno fmt/lint/check/test. Capability: backend-deployment.

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --- Test gate: deploy runs only if these pass ---
      - name: Format check
        working-directory: backend
        run: deno fmt --check

      - name: Lint
        working-directory: backend
        run: deno lint

      # Type-check all source explicitly. `deno test` only checks test-reachable code, so this
      # covers main.ts/SDK wiring (no test imports it) and any future orphan source file.
      - name: Type check
        working-directory: backend
        run: deno check src/*.ts

      - name: Test
        working-directory: backend
        run: deno test

      # --- TEMPORARY: deploy on EVERY push to test the pipeline from this branch.
      #     REVERT before /ship (restore `if: github.ref == 'refs/heads/main'`). ---
      - name: Deploy to bunny Edge Scripting
        uses: BunnyWay/actions/deploy-script@main
        with:
          script_id: ${{ secrets.BUNNY_SCRIPT_ID }}
          deploy_key: ${{ secrets.BUNNY_DEPLOY_KEY }}
          file: backend/src/main.ts
