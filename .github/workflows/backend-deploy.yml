name: backend-deploy

# Deploys the backend/ upload endpoint to BOTH bunny Edge Scripting and Deno Deploy. Deno Deploy is
# the device-facing host while bunny.net investigates dropping iOS's zero-window upload SYNs (the
# single main.ts serves both runtimes — bunny via the SDK, Deno Deploy via Deno.serve). Path-scoped
# to the backend sources, isolated from the Gradle/iOS workflows, and gated on green Deno
# fmt/lint/check/test. Capability: backend-deployment.

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --- Test gate: deploy runs only if these pass ---
      - name: Format check
        working-directory: backend
        run: deno fmt --check

      - name: Lint
        working-directory: backend
        run: deno lint

      # Type-check all source explicitly. `deno test` only checks test-reachable code, so this
      # covers main.ts/SDK wiring (no test imports it) and any future orphan source file.
      - name: Type check
        working-directory: backend
        run: deno check src/*.ts

      - name: Test
        working-directory: backend
        run: deno test

      # Bundle to a single file — the deploy action uploads the file as-is (no bundling), and the
      # SDK's serve() is runtime-aware (bundles a `case "bunny"` path).
      - name: Bundle
        working-directory: backend
        run: deno bundle src/main.ts -o dist/main.js

      # --- Deploy: main only. Feature-branch pushes run the checks (incl. bundle) but do not ship
      #     to the single live script. Idempotent: re-deploys overwrite the same script_id. ---
      - name: Deploy to bunny Edge Scripting
        if: github.ref == 'refs/heads/main'
        uses: BunnyWay/actions/deploy-script@main
        with:
          script_id: ${{ secrets.BUNNY_SCRIPT_ID }}
          deploy_key: ${{ secrets.BUNNY_DEPLOY_KEY }}
          file: backend/dist/main.js

      # Deno Deploy (the active iOS-facing host for now). The app's entrypoint (src/main.ts) and env
      # (BUNNY_STORAGE_*) are configured server-side; `deno deploy` uses the stored build config and
      # the --org/--app to target the app. It persists a `deploy:` block into deno.json on the
      # ephemeral runner (never committed). Requires the DENO_DEPLOY_TOKEN secret (the `ddo_` org
      # token). Revert path: when bunny fixes the SYN drop, drop this step + repoint the iOS host.
      - name: Deploy to Deno Deploy
        if: github.ref == 'refs/heads/main'
        working-directory: backend
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy --org stefanhoelzl --app snapsync --prod
