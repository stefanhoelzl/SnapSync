# App Store / landing-page marketing screenshots. DISPATCH-ONLY and NON-GATING dev infra — like
# ssh-mac.yml, it posts no status check and never blocks a merge. It changes no product behavior; the
# only product-facing part (the SNAPSYNC_FORGE_STATE launch trigger) is spec'd in ios-app-shell. Its
# rationale (why it exists at all, and every knob below) lives here so there is no separate capability.
#
# WHAT IT DOES: builds the app for the iOS simulator, boots a 6.9" iPhone, launches the app once per
# marketing state with SNAPSYNC_FORGE_STATE (which renders the shared StatusScreen over forged sources —
# no backend, attestation, or photo access), captures each with `simctl io screenshot`, composites each
# onto a brand-green band with a headline, and uploads the set as a workflow ARTIFACT. A human then
# places the PNGs on the App Store listing / landing page — this workflow does NOT auto-upload to App
# Store Connect (that path needs the Admin key + raw REST and touches the public listing; deliberately
# out of scope).
#
# WHY 6.9" ONLY: it is Apple's single REQUIRED iPhone screenshot class (iPhone 16 Pro Max, 1320x2868)
# and App Store Connect auto-scales it down to the 6.5"/6.7" listings. Older classes and iPad are not
# required (SnapSync is iPhone-only) and are deliberately omitted.
#
# WHY macos-26: only a macOS runner boots iOS simulators, and only the simulator gives authentic iOS
# chrome (a real status bar, system fonts) at exact device resolution. The real device is unreachable
# from a GitHub runner (it is USB-bridged into the codehydra sandbox), so an authentic on-device pass is
# an out-of-band operator runbook (see CLAUDE.md `dvt screenshot`), not this CI stage.

name: screenshots

on:
  workflow_dispatch:
  # TEMPORARY (revert before merge): a new workflow_dispatch workflow is not dispatchable until it
  # exists on the default branch, so this branch-scoped push trigger validates the pipeline on
  # ci-screenshot. Remove this `push:` block — leaving only workflow_dispatch — before shipping.
  push:
    branches: [ci-screenshot]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Same Kotlin/Native cache as ios.yml so a warm run skips the toolchain download and klib recompile.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # Build the app for the simulator SDK. UNSIGNED (a simulator .app needs no code signing —
      # ios-app-shell "No code signing required for the simulator build"). Debug so the Kotlin/Native
      # framework link skips the LLVM optimizer — a screenshot needs no optimization.
      #
      # NB the SPIKE (tasks.md 1.x): this builds the whole `iosApp` scheme, which pulls the PhotoKit
      # BackgroundUploadExtension into the closure. That extension conforms to
      # PHBackgroundResourceUploadExtension with no `#if targetEnvironment(simulator)` guard; if it does
      # not compile for the simulator SDK, switch this to an app-target-only build
      # (`-target iosApp` in place of `-scheme iosApp`) — the extension is irrelevant to a UI screenshot.
      - name: Build the app for the iOS simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="$(find build/ios/Build/Products -maxdepth 2 -name '*.app' -path '*-iphonesimulator*' | head -1)"
          if [ -z "$APP" ]; then echo "::error::no simulator .app produced"; exit 1; fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # Create + boot a 6.9" iPhone on the runner's newest iOS runtime, then install the app.
      - name: Boot the 6.9" simulator and install
        run: |
          DEVICE="$(xcrun simctl create screenshots-6.9 'iPhone 16 Pro Max')"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"

      # The clean App Store status bar: 9:41, full battery (charged), full signal. Persists per device
      # across launches, so one override covers every capture below.
      - name: Clean the status bar
        run: |
          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" \
            --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3

      # Launch once per state with the forge env var (SIMCTL_CHILD_ passes it to the app process),
      # let it render, capture, then terminate before the next launch (a fresh process per state).
      - name: Capture each forged state
        run: |
          mkdir -p shots
          for STATE in create joining in_sync; do
            # Hard reset between states: SnapSync ignores SIGTERM (Skiko runloop), so a relaunch that
            # LAYERS over a still-alive instance breaks the frame. Terminate, wait, then launch fresh —
            # no --terminate-running-process (which layers). A longer settle covers cold Compose init.
            xcrun simctl terminate "$DEVICE" app.snapsync 2>/dev/null || true
            sleep 2
            SIMCTL_CHILD_SNAPSYNC_FORGE_STATE="$STATE" \
              xcrun simctl launch "$DEVICE" app.snapsync
            sleep 8
            echo "running after $STATE launch: $(xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null | grep -c app.snapsync)"
            xcrun simctl io "$DEVICE" screenshot "shots/$STATE.png"
          done
          xcrun simctl terminate "$DEVICE" app.snapsync 2>/dev/null || true
          # Diagnostics: dump any crash reports so a launch-into-Joined crash is attributable, not guessed.
          echo "=== crash reports ==="
          CR="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/Logs/DiagnosticReports"
          if ls "$CR"/*.ips >/dev/null 2>&1; then
            for f in "$CR"/*.ips; do echo "--- $f ---"; head -50 "$f"; done
          else
            echo "no crash reports"
          fi

      # Composite each raw shot onto a brand-green (#0E9D6B) 1320x2868 canvas with a placeholder
      # headline. Headlines/art are intentionally provisional — retune here without touching the
      # capture pipeline. Output at the exact 6.9" resolution App Store Connect expects.
      - name: Composite marketing frames
        run: |
          brew list imagemagick >/dev/null 2>&1 || brew install imagemagick
          mkdir -p "out/en-US/6.9"
          # ImageMagick 7 cannot resolve Apple font ALIASES (e.g. "Helvetica-Bold"); it needs a font
          # FILE path. Pick the first present, ending on Helvetica.ttc which ships on every macOS.
          FONT=""
          for f in "/System/Library/Fonts/Supplemental/Arial Bold.ttf" \
                   "/System/Library/Fonts/HelveticaNeue.ttc" \
                   "/System/Library/Fonts/Helvetica.ttc"; do
            [ -f "$f" ] && { FONT="$f"; break; }
          done
          echo "using font: $FONT"
          # `caption:` word-WRAPS inside a fixed 1140px box at a fixed pointsize, so a long headline
          # becomes two lines instead of bleeding off the 1320px canvas (which `-annotate` did — it
          # neither wraps nor clips-safely). Any future copy length fits by construction.
          compose() { # <raw> <headline> <out>
            magick -size 1320x2868 "xc:#0E9D6B" \
              \( "$1" -resize 1120x \) -gravity south -geometry +0+100 -composite \
              \( -background none -fill white -font "$FONT" -pointsize 72 \
                 -size 1140x -gravity center caption:"$2" \) \
              -gravity north -geometry +0+170 -composite \
              "$3"
          }
          compose shots/create.png   "Start an event in seconds"        "out/en-US/6.9/01-create.png"
          compose shots/joining.png  "One scan — everyone's in"         "out/en-US/6.9/02-joining.png"
          compose shots/in_sync.png  "Every photo, shared automatically" "out/en-US/6.9/03-in-sync.png"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: out/
          if-no-files-found: error
