# App Store / landing-page marketing screenshots. DISPATCH-ONLY and NON-GATING dev infra:
# it posts no status check and never blocks a merge. It changes no product behavior. Its
# rationale (why it exists at all, and every knob below) lives here so there is no separate capability.
# The one product-facing PROPERTY — that a committed raw depicts the real screen in a state the real
# reduction reached — is spec'd in `docs/deployment.md`, beside the requirement making those raws
# the source of truth for the listing.
#
# WHAT IT DOES: builds the RIG build of the real app for the iOS simulator, boots a 6.9" iPhone, and runs
# `:test:integration`'s screenshot capture (`CaptureShots`): it sets the app's launch adapters — every system
# mocked but the screen and the app's foreground life — drives the app to each marketing state through the
# control channel (the scenarios in `Shots.kt`, which `ShotsTest` runs on the JVM host on every build), and
# captures each with `simctl io screenshot`, light and dark.
#
# WHY THE REAL APP: these raws used to come from a separate forge binary that fed canned inputs to the status
# screen. That could show a frame the app never reached (its joining shot had no photo count; its in_sync shot
# no downloads), and it rotted between dispatches because nothing ran it. Now each state is one the real
# reduction reached over the mocks, and the scenario that reaches it gates every build on the JVM host.
# It uploads **6 RAW captures** (3 states x light/dark) as a workflow ARTIFACT and stops there.
#
# RAW ONLY, BY DESIGN. An operator commits these to `screenshots/` and they become the SINGLE SOURCE OF
# TRUTH for two surfaces, each of which composites its own way: `appstore.yml` bakes on the brand band +
# headline and uploads to App Store Connect; the backend derives small WebP for the landing page. Emitting
# raws (rather than finished frames) is what lets a headline or a size change re-render WITHOUT a 10-20
# minute macOS run. See `changes/archive/…-wire-screenshots-into-listing-and-site`.
#
# WHY COMMIT simctl'S OUTPUT: `simctl` stamps no timestamp — its only PNG metadata is an `eXIf` chunk of
# dimensions + colour space, byte-identical across captures. So a re-run with an unchanged UI produces an
# unchanged file and `git status` stays clean; a diff means the UI really moved. The clock is MOCKED at a fixed
# instant (`Shot.NOW`) and the status bar overridden, so no shot renders the wall clock — `create`, which
# re-diffed every run under the forge, is as stable as the others.
#
# WHY 6.9" ONLY: it is Apple's single REQUIRED iPhone screenshot class (iPhone 16 Pro Max, 1320x2868)
# and App Store Connect auto-scales it down to the 6.5"/6.7" listings. Older classes and iPad are not
# required (SnapSync is iPhone-only) and are deliberately omitted.
#
# WHY macos-26: only a macOS runner boots iOS simulators, and only the simulator gives authentic iOS
# chrome (a real status bar, system fonts) at exact device resolution. The real device is unreachable
# from a GitHub runner (it is USB-bridged into the codehydra sandbox), so an authentic on-device pass is
# an out-of-band operator runbook (see CLAUDE.md `dvt screenshot`), not this CI stage.

name: screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Same Kotlin/Native cache as ios.yml so a warm run skips the toolchain download and klib
      # recompile — but RESTORE-ONLY: main owns that entry (ios.yml writes it), and this dispatch-only
      # workflow is a pure consumer. That is also what it already did, just accidentally: with a key
      # rotating only on libs.versions.toml the primary key always HIT, so actions/cache's post-step
      # logged "not saving cache" and wrote nothing. Making it explicit costs nothing and fixes the
      # half of that accident which hurt: an always-hitting primary key pins this run to a possibly
      # ancient entry, because a hit means restore-keys are never consulted. The run id guarantees the
      # primary misses, so the restore falls through and picks the NEWEST konan entry instead.
      - name: Restore Kotlin/Native (~/.konan)
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-
            konan-${{ runner.os }}-

      # Render the deployment BEFORE xcodebuild reads it. `Config.xcconfig` hard-`#include`s the
      # GENERATED, gitignored `Deployment.xcconfig` (`docs/deployment.md`), so a build without this step fails
      # at CONFIGURATION time — "could not find included file". This workflow once failed there for a month
      # unnoticed, because it is dispatch-only and NON-GATING; keep this step ahead of any xcodebuild.
      #
      # `local`, as `scripts/sim-contracts` does, and through GRADLE_OPTS so the Gradle that Xcode's build phase
      # launches renders the same one. The backend is MOCKED on every launch that drives a shot, so no request leaves
      # the app; `local` makes that doubly true — a launch that reached a real backend would find nothing on the
      # loopback, never the shared zone real users' photos live in.
      - name: Resolve the deployment
        run: |
          python3 scripts/resolve-deployment.py local
          echo "GRADLE_OPTS=-Dorg.gradle.project.snapsync.deployment=local" >> "$GITHUB_ENV"

      # The RIG build of the real app for the simulator SDK (`-Psnapsync.rig=true`, in ~/.gradle and never in the
      # repo's gradle.properties — exactly as ios-contracts builds it). Debug so the Kotlin/Native framework link
      # skips the LLVM optimizer. Built unsigned, then AD-HOC signed: an unsigned simulator app has no App Group,
      # and the launch adapters' choice and the mocked systems' state live there (`scripts/sim-sign`).
      - name: Build the rig app for the iOS simulator
        run: |
          mkdir -p ~/.gradle && printf "snapsync.rig=true\n" >> ~/.gradle/gradle.properties
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="$(find build/ios/Build/Products -maxdepth 2 -name '*.app' -path '*-iphonesimulator*' | head -1)"
          if [ -z "$APP" ]; then echo "::error::no simulator .app produced"; exit 1; fi
          scripts/sim-sign "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # The capture compiles now, and every Gradle and Kotlin daemon stops before the simulator boots: they hold
      # gigabytes the simulator would swap against (the reason ios-contracts runs its journeys as a bare JVM too).
      - name: Compile the capture
        run: |
          ./gradlew -q :test:integration:screenshotsClasses :test:integration:screenshotsClasspath
          ./gradlew -q --stop
          pkill -f 'org.jetbrains.kotlin.daemon.KotlinCompileDaemon' || true

      # Boot a 6.9" iPhone and install. REUSE the runner image's pre-created device rather than
      # `simctl create`: a brand-new device pays a first-boot data-container migration that measured
      # 209-224s — longer than capturing all six screenshots. A device the image already booted skips it.
      # (It is also the fresh-device onboarding that fires the "Ready for Apple Intelligence" banner which
      # contaminated a capture, so reusing one should make that rarer too.)
      # Falls back to creating one if the image ever ships without it.
      - name: Boot the 6.9" simulator and install
        run: |
          DEVICE="$(xcrun simctl list devices available | grep -m1 'iPhone 16 Pro Max' | grep -oE '[0-9A-F-]{36}' || true)"
          if [ -n "$DEVICE" ]; then
            echo "reusing pre-created device $DEVICE"
          else
            echo "no pre-created iPhone 16 Pro Max — creating one"
            DEVICE="$(xcrun simctl create screenshots-6.9 'iPhone 16 Pro Max')"
          fi
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true   # already-booted is fine
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"

      # The clean App Store status bar: 9:41, full battery (charged), full signal. Persists per device
      # across launches, so one override covers every capture below.
      - name: Clean the status bar
        run: |
          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" \
            --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3

      # Drive the real app to each state and capture it, light and dark (`CaptureShots`). One launch per state;
      # the appearance flips on the running app — `AppTheme` selects on `isSystemInDarkTheme()`, which
      # Compose/iOS resolves from the UIKit trait collection that `simctl ui appearance` sets — and a settled
      # frame is two byte-identical consecutive captures. A bare JVM on the classpath the compile step wrote.
      - name: Capture each state, light and dark
        run: |
          "${JAVA_HOME:+$JAVA_HOME/bin/}java" -Xmx512m -cp "$(cat test/integration/build/screenshots-classpath.txt)" \
            app.snapsync.screenshots.CaptureShotsKt "$DEVICE" 18099 shots

      # Diagnostics on a failed capture: the app's own log, what the screen showed, and any crash report — so a
      # launch that never answered or a state never reached is attributable, not guessed.
      - name: Keep the evidence
        if: failure()
        run: |
          mkdir -p evidence
          DATA="$(xcrun simctl get_app_container "$DEVICE" app.snapsync data 2>/dev/null || true)"
          [ -n "$DATA" ] && cp "$DATA/Documents/debug.log" evidence/ 2>/dev/null || true
          xcrun simctl io "$DEVICE" screenshot evidence/screen.png >/dev/null 2>&1 || true
          cp "$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/Logs/DiagnosticReports/"*.ips evidence/ 2>/dev/null || true
      - name: Upload the evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: screenshots-evidence
          path: evidence/
          if-no-files-found: ignore
      # Whatever was captured before the failure, so a partial run is still something to look at — never to commit.
      - name: Upload the partial captures
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: screenshots-partial
          path: shots/
          if-no-files-found: ignore

      # Fail loudly rather than upload a short set: a missing shot means a launch or capture failed, and
      # the operator is about to commit these as the source of truth for two surfaces.
      - name: Check the set is complete
        run: |
          COUNT="$(find shots -name '*.png' | wc -l | tr -d ' ')"
          echo "captured $COUNT shot(s):"; ls -l shots
          [ "$COUNT" -eq 6 ] || { echo "::error::expected 6 raw captures, got $COUNT"; exit 1; }

      - name: Upload the raw captures
        uses: actions/upload-artifact@v7.0.1
        with:
          name: screenshots-raw
          path: shots/
          if-no-files-found: error
