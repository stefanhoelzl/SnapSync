# App Store / landing-page marketing screenshots. DISPATCH-ONLY and NON-GATING dev infra — like
# ssh-mac.yml, it posts no status check and never blocks a merge. It changes no product behavior; the
# only product-facing part (the SNAPSYNC_FORGE_STATE launch trigger) is spec'd in ios-app-shell. Its
# rationale (why it exists at all, and every knob below) lives here so there is no separate capability.
#
# WHAT IT DOES: builds the app for the iOS simulator, boots a 6.9" iPhone, and launches the app once per
# (appearance, marketing state) with SNAPSYNC_FORGE_STATE (which renders the shared StatusScreen over
# forged sources — no backend, attestation, or photo access), capturing each with `simctl io screenshot`.
# It uploads **6 RAW captures** (3 states x light/dark) as a workflow ARTIFACT and stops there.
#
# RAW ONLY, BY DESIGN. An operator commits these to `screenshots/` and they become the SINGLE SOURCE OF
# TRUTH for two surfaces, each of which composites its own way: `appstore.yml` bakes on the brand band +
# headline and uploads to App Store Connect; the backend derives small WebP for the landing page. Emitting
# raws (rather than finished frames) is what lets a headline or a size change re-render WITHOUT a 10-20
# minute macOS run. See `changes/archive/…-wire-screenshots-into-listing-and-site`.
#
# WHY COMMIT simctl'S OUTPUT: `simctl` stamps no timestamp — its only PNG metadata is an `eXIf` chunk of
# dimensions + colour space, byte-identical across captures. So a re-run with an unchanged UI produces an
# unchanged file and `git status` stays clean; a diff means the UI really moved. (Every PNG ImageMagick
# writes carries `tIME`/`date:*`, so committing composites would churn on every regeneration — another
# reason composition belongs downstream.) NB the `create` shot is the exception: it renders the wall clock,
# so it re-diffs every run until that is fixed (see the change's design D3).
#
# WHY 6.9" ONLY: it is Apple's single REQUIRED iPhone screenshot class (iPhone 16 Pro Max, 1320x2868)
# and App Store Connect auto-scales it down to the 6.5"/6.7" listings. Older classes and iPad are not
# required (SnapSync is iPhone-only) and are deliberately omitted.
#
# WHY macos-26: only a macOS runner boots iOS simulators, and only the simulator gives authentic iOS
# chrome (a real status bar, system fonts) at exact device resolution. The real device is unreachable
# from a GitHub runner (it is USB-bridged into the codehydra sandbox), so an authentic on-device pass is
# an out-of-band operator runbook (see CLAUDE.md `dvt screenshot`), not this CI stage.

name: screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Same Kotlin/Native cache as ios.yml so a warm run skips the toolchain download and klib recompile.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # Build the app for the simulator SDK. UNSIGNED (a simulator .app needs no code signing —
      # ios-app-shell "No code signing required for the simulator build"). Debug so the Kotlin/Native
      # framework link skips the LLVM optimizer — a screenshot needs no optimization.
      #
      # This builds the whole `iosApp` scheme, so the PhotoKit BackgroundUploadExtension is in the closure
      # (it compiles for the simulator SDK — proven by the predecessor change's spike).
      #
      # The extension is irrelevant to a UI screenshot and costs ~78s of the ~368s build (21%; the other
      # 79% is the Compose/Skiko framework link, which is not cacheable and genuinely needed). Dropping it
      # is NOT the one-word swap this comment used to claim: `-target iosApp` in place of `-scheme iosApp`
      # FAILS — `xcodebuild` rejects `-target` together with `-derivedDataPath` ("The flag -scheme,
      # -testProductsPath, or -xctestrun is required when specifying -derivedDataPath"), which this step
      # uses. Doing it properly needs a dedicated app-only scheme in the Xcode project.
      - name: Build the app for the iOS simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="$(find build/ios/Build/Products -maxdepth 2 -name '*.app' -path '*-iphonesimulator*' | head -1)"
          if [ -z "$APP" ]; then echo "::error::no simulator .app produced"; exit 1; fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # Create + boot a 6.9" iPhone on the runner's newest iOS runtime, then install the app.
      - name: Boot the 6.9" simulator and install
        run: |
          DEVICE="$(xcrun simctl create screenshots-6.9 'iPhone 16 Pro Max')"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"

      # The clean App Store status bar: 9:41, full battery (charged), full signal. Persists per device
      # across launches, so one override covers every capture below.
      - name: Clean the status bar
        run: |
          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" \
            --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3

      # Launch once per (appearance, state) with the forge env var (SIMCTL_CHILD_ passes it to the app
      # process), let it render, capture, then terminate before the next launch (a fresh process per shot).
      #
      # The APPEARANCE pass drives the app's REAL dark theme: `AppTheme` selects on
      # `isSystemInDarkTheme()`, which Compose/iOS resolves from the UIKit trait collection
      # (`LocalSystemTheme` -> `userInterfaceStyle`) — exactly what `simctl ui appearance` sets. So no
      # app change, no theme override, and the dark shot is a frame the production app genuinely
      # renders. Verified: the captures come back with backgrounds #F4F6F8 / #0C0E12, the literal
      # `AppTheme` LightColors/DarkColors constants.
      - name: Capture each forged state, light and dark
        run: |
          mkdir -p shots
          for MODE in light dark; do
            xcrun simctl ui "$DEVICE" appearance "$MODE"
            echo "appearance now: $(xcrun simctl ui "$DEVICE" appearance)"
            for STATE in create joining in_sync; do
              # Hard reset between shots: SnapSync ignores SIGTERM (Skiko runloop), so a relaunch that
              # LAYERS over a still-alive instance breaks the frame. Terminate, wait, then launch fresh —
              # no --terminate-running-process (which layers). A longer settle covers cold Compose init.
              xcrun simctl terminate "$DEVICE" app.snapsync 2>/dev/null || true
              sleep 2
              SIMCTL_CHILD_SNAPSYNC_FORGE_STATE="$STATE" \
                xcrun simctl launch "$DEVICE" app.snapsync
              sleep 8
              echo "running after $MODE/$STATE launch: $(xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null | grep -c app.snapsync)"
              xcrun simctl io "$DEVICE" screenshot "shots/$STATE-$MODE.png"
            done
          done
          xcrun simctl terminate "$DEVICE" app.snapsync 2>/dev/null || true
          # Diagnostics: dump any crash reports so a launch-into-Joined crash is attributable, not guessed.
          echo "=== crash reports ==="
          CR="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data/Library/Logs/DiagnosticReports"
          if ls "$CR"/*.ips >/dev/null 2>&1; then
            for f in "$CR"/*.ips; do echo "--- $f ---"; head -50 "$f"; done
          else
            echo "no crash reports"
          fi

      # Fail loudly rather than upload a short set: a missing shot means a launch or capture failed, and
      # the operator is about to commit these as the source of truth for two surfaces.
      - name: Check the set is complete
        run: |
          COUNT="$(find shots -name '*.png' | wc -l | tr -d ' ')"
          echo "captured $COUNT shot(s):"; ls -l shots
          [ "$COUNT" -eq 6 ] || { echo "::error::expected 6 raw captures, got $COUNT"; exit 1; }

      - name: Upload the raw captures
        uses: actions/upload-artifact@v7.0.1
        with:
          name: screenshots-raw
          path: shots/
          if-no-files-found: error
