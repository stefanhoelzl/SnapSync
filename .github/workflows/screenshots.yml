# The store listings' and landing page's marketing screenshots: a dispatch captures them for an operator to commit. The
# steps are two composite actions (`.github/actions/screenshots-ios`, `-android`) ci.yml also runs on every branch push
# with `compare` — in `ios-build` and in `screenshots (android)` — failing when a capture differs from the committed raw,
# so a change that moves a listing image carries its new raws, and the raws never rot. It changes no
# product behavior. Its rationale (why it exists at all, and every knob below) lives here so there is no separate
# capability.
# The one product-facing PROPERTY — that a committed raw depicts the real screen in a state the real
# reduction reached — is spec'd in `docs/deployment.md`, beside the requirement making those raws
# the source of truth for the listing.
#
# WHAT IT DOES: builds the RIG build of the real app for the iOS simulator, boots a 6.9" iPhone, and runs
# `:test:integration`'s screenshot capture (`CaptureShots`): it sets the app's launch adapters — every system
# mocked but the screen and the app's foreground life — drives the app to each marketing state through the
# control channel (the scenarios in `Shots.kt`, which `ShotsTest` runs on the JVM host on every build), and
# captures each with `simctl io screenshot`, light and dark.
#
# WHY THE REAL APP: these raws used to come from a separate forge binary that fed canned inputs to the status
# screen. That could show a frame the app never reached (its joining shot had no photo count; its in_sync shot
# no downloads), and it rotted between dispatches because nothing ran it. Now each state is one the real
# reduction reached over the mocks, and the scenario that reaches it gates every build on the JVM host.
# It uploads **6 RAW captures** (3 states x light/dark) as a workflow ARTIFACT, and under `compare` checks them against
# the committed set (`CompareShots`, which says what it forgives) and uploads a diff image of each differing shot.
#
# ANDROID (the `android` job): the same three states, captured the same way from the Android rig build on an emulator
# on a Linux runner with KVM — the DEBUG build, because the capture resets the mocked systems' saved state through
# `run-as`, which reaches only a debuggable app. Its six raws are the artifact `screenshots-android-raw`, committed to
# `screenshots/android/`; they feed only the Google Play listing (composited with the same headlines by
# compose_screenshots.sh's `play` target, uploaded by promote.yml's Play release when they changed). The status
# bar is SystemUI's demo mode (9:41, full battery and Wi-Fi), set by the capture itself.
#
# RAW ONLY, BY DESIGN. An operator commits these to `screenshots/ios/` and they become the SINGLE SOURCE OF
# TRUTH for two surfaces, each of which composites its own way: the release (promote.yml)
# bakes on the brand band + headline and uploads to App Store Connect; the backend derives small WebP for
# the landing page. Emitting raws (rather than finished frames) is what lets a headline or a size change
# re-render WITHOUT a 10-20 minute macOS run. See `changes/archive/…-wire-screenshots-into-listing-and-site`.
#
# WHY COMMIT simctl'S OUTPUT: `simctl` stamps no timestamp — its only PNG metadata is an `eXIf` chunk of
# dimensions + colour space, byte-identical across captures. So a re-run with an unchanged UI produces an
# unchanged file and `git status` stays clean; a diff means the UI really moved. The clock is MOCKED at a fixed
# instant (`Shot.NOW`), the event id the `in_sync` QR encodes is fixed (`Shot.EVENT_ID`) and the status bar
# overridden, so no shot renders the wall clock — `create`, which re-diffed every run under the forge, is as stable
# as the others. The one residue is the simulator's anti-aliasing of the Dynamic Island's rim (≤~120 pixels, each
# ≤2/255), which is noise: never commit a raw whose only diff is that.
#
# WHY 6.9" ONLY: it is Apple's single REQUIRED iPhone screenshot class (iPhone 17 Pro Max, 1320x2868)
# and App Store Connect auto-scales it down to the 6.5"/6.7" listings. Older classes and iPad are not
# required (SnapSync is iPhone-only) and are deliberately omitted.
#
# WHY macos-26: only a macOS runner boots iOS simulators, and only the simulator gives authentic iOS
# chrome (a real status bar, system fonts) at exact device resolution. The real device is unreachable
# from a GitHub runner (it is USB-bridged into the codehydra sandbox), so an authentic on-device pass is
# an out-of-band operator runbook (see CLAUDE.md `dvt screenshot`), not this CI stage.

name: screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    # Gradle's cache: ios-build's, read only, as journeys (ios) reads it. Under its own job name this restored an entry
    # only a dispatch on main ever wrote — five days stale once, so nearly every task rebuilt — while ios-build's carries
    # what this build needs: the simulator libraries its platform tests compile and, on main, the rig app's own (its
    # "Seed the Gradle cache with the rig simulator app" step).
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: ios-build
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      # The Kotlin/Native cache ci.yml's `ios-build` saves on main, so a warm run skips the toolchain download and klib
      # recompile. RESTORE-ONLY: main owns that entry, and this dispatch-only workflow is a pure consumer. The run id
      # in its key guarantees the primary misses, so the restore falls through to the NEWEST konan entry rather than
      # pinning an ancient one (with a key rotating only on libs.versions.toml it always hit, and a hit never consults
      # restore-keys).
      - name: Restore Kotlin/Native (~/.konan)
        uses: ./.github/actions/konan-restore
        with:
          family: device

      - uses: ./.github/actions/screenshots-ios

  android:
    runs-on: ubuntu-26.04
    # Gradle's cache: ci.yml's `build`'s, read only, as journeys (android) reads it.
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - uses: ./.github/actions/screenshots-android
