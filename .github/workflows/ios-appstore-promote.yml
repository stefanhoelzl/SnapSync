# Dispatch-driven App Store release (capability ios-appstore-release). This PROMOTES a build that
# `ios-deliver` already uploaded to App Store Connect — it BUILDS NOTHING. `gh workflow run
# ios-appstore-promote.yml -f build_number=N` picks build N (its CFBundleVersion), DERIVES the store
# version from the build's own marketing version, finds-or-creates that App Store version record, attaches
# the build, applies the App Review details, OPTIONALLY submits, and — last — creates the `vX.Y` tag.
#
# WHY PROMOTE, NOT BUILD: every main merge already uploads a signed, gated build to the internal TestFlight
# group. Promoting one ships the EXACT bits you tested and reuses a build already in ASC, instead of
# compiling a fourth never-run copy. It also collapses the old two-job (macOS build + ubuntu finish) split
# to a SINGLE ubuntu job — no Xcode, no signing certs, no keychain.
#
# VERSION IS DERIVED, NOT INPUT. The store version = the build's own `preReleaseVersion.version` (which
# ios.yml computed as max(floor, lastTag+1) at build time). So the version record and the build always
# match by construction — the "attach a mismatched build" hazard cannot arise. There is no `version` input.
#
# PROVENANCE IS AN UPLOAD-TIME GUARANTEE. `ios-deliver` runs only on main and only when both merge gates
# pass, so every promotable build is from a merged, gate-passing commit. This workflow therefore does NOT
# re-check the commit's ancestry or check-runs (the old green-check apparatus is gone). Two guards remain:
# the derived version must be two-part `^\d+\.\d+$`, and the `vX.Y` tag must not already exist.
#
# TAG ORDERING IS LOAD-BEARING. Tag existence is checked FIRST (fail in seconds, not after the ASC work)
# and the tag is created LAST (after submit). A failed run then leaves no tag and retries cleanly; a
# released tag is never moved. The tag points at the BUILD'S ORIGIN COMMIT, resolved
# `build_number → ios.yml run(branch=main, run_number=N) → head_sha`. If that origin cannot be resolved
# (e.g. the run was deleted), the run FAILS rather than tag a guess. The tag message records `build N`.
# NB: a wrong resolution would be a wrong TAG, never wrong bits — the attach identifies the build by N.
#
# SUBMIT is opt-in (`-f submit=true`) AND gated: `asc review doctor` must report zero blocking checks or
# the run refuses. The gate is OURS — a submission is outward-facing and effectively irreversible.
#
# This workflow posts NO branch-protection status check and is NOT in .github/rulesets/main.json: it runs
# only when dispatched and never as part of a PR's checks, so requiring it would freeze merges. A failed
# release is RED but blocks nothing. It introduces no new App Store Connect credential (the review CONTACT
# secrets grant no ASC access; they are secrets only because this repo is public and they are personal data).
name: ios-appstore-promote

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion) of the App Store Connect build to promote, e.g. 512."
        required: true
        type: string
      submit:
        description: "Submit for App Store Review after attaching. Refused if `asc review doctor` reports a blocker."
        required: false
        default: false
        type: boolean

permissions:
  contents: write # push the release tag
  actions: read # read ios.yml runs to resolve the build's origin commit

# Per-build group: two promotions of the SAME build_number don't run concurrently; distinct builds do not
# cancel one another.
concurrency:
  group: ios-appstore-promote-${{ inputs.build_number }}
  cancel-in-progress: true

jobs:
  promote:
    name: ios-appstore-promote
    runs-on: ubuntu-latest
    env:
      ASC_APP_ID: "6781692480"
      BUILD_NUMBER: ${{ inputs.build_number }}
      # asc reads ASC_PRIVATE_KEY; appstore_release.py reads ASC_API_PRIVATE_KEY. Same Admin key the rest
      # of the pipeline uses — no new ASC credential.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      ASC_BYPASS_KEYCHAIN: "1"
      DO_NOT_TRACK: "1"
    steps:
      # fetch-depth: 0 so the resolved origin commit is present locally to tag; fetch-tags for the guard.
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch pinned asc
        run: bash .github/scripts/asc_fetch.sh "$RUNNER_TEMP/asc"

      - name: Install the App Store Connect client
        run: pip install --quiet 'pyjwt[crypto]' requests

      # DERIVE the store version from the build (no mutation). Fails fast if the build's marketing version
      # is not two-part X.Y (e.g. a pre-change 0.1.0 build cannot be promoted). Emits `version` output.
      - name: Resolve the store version from the build
        id: resolve
        run: python .github/scripts/appstore_release.py resolve "$ASC_APP_ID" "$BUILD_NUMBER"

      - name: Carry the derived version into env
        run: |
          echo "STORE_VERSION=${{ steps.resolve.outputs.version }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${{ steps.resolve.outputs.version }}" >> "$GITHUB_ENV"
          # asc ≥2.8 `review submit` requires the ASC build id (not the build NUMBER); resolve emits it.
          echo "BUILD_ID=${{ steps.resolve.outputs.build_id }}" >> "$GITHUB_ENV"

      # Guard 1 (before any ASC mutation): the vX.Y tag must not already exist — a released version is
      # never re-released, and a released tag is never moved. The tag is created LAST, so a failed run
      # leaves none and retries cleanly.
      - name: Require the release tag to be absent
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::tag $RELEASE_TAG already exists (points at $(git rev-parse "refs/tags/$RELEASE_TAG"))."
            echo "::error::That store version already shipped. Promote a newer build (a higher version)."
            exit 1
          fi
          echo "tag $RELEASE_TAG is free"

      # Guard 2 (before any ASC mutation): resolve the build's ORIGIN COMMIT, or fail loud. Map
      # build_number → the ios.yml run on main whose run_number equals it → head_sha. Restricting to
      # branch=main disambiguates from any other workflow's run_number space. On a deleted/unresolvable
      # run we FAIL rather than tag a wrong or placeholder commit.
      - name: Resolve the build's origin commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ios.yml/runs?branch=main" \
            --jq ".workflow_runs[] | select(.run_number == ${BUILD_NUMBER}) | .head_sha" | head -1)"
          if [ -z "$sha" ]; then
            echo "::error::cannot resolve the origin commit for build ${BUILD_NUMBER} from an ios.yml run"
            echo "::error::(run deleted, or the number is not an ios.yml build). Tag ${RELEASE_TAG} by hand."
            exit 1
          fi
          echo "ORIGIN_SHA=$sha" >> "$GITHUB_ENV"
          echo "resolved build ${BUILD_NUMBER} → origin commit $sha"

      # Find-or-create the X.Y App Store version record and attach this EXISTING build. Waits for the build
      # to be VALID (an already-uploaded build is normally VALID immediately) and is idempotent. The store
      # version is derived from the build itself, so no version argument is passed.
      - name: Attach the build to its App Store version record
        run: python .github/scripts/appstore_release.py release "$ASC_APP_ID" "$BUILD_NUMBER"

      # App Review details, applied on EVERY release (not just when submitting), so a promote-only run
      # leaves the version submit-ready. Declarative: the committed notes win. The notes live OUTSIDE the
      # metadata tool's canonical schema (metadata/review/) — an unknown key in version/<v>/<locale>.json
      # or app-info/<locale>.json would fail the REQUIRED appstore-metadata-validate check and freeze
      # merges. An appStoreReviewDetail is version-scoped and NOT localized: one per version.
      - name: Apply the App Review details
        env:
          ASC: ${{ runner.temp }}/asc
          CONTACT_FIRST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_FIRST_NAME }}
          CONTACT_LAST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_LAST_NAME }}
          CONTACT_EMAIL: ${{ secrets.ASC_REVIEW_CONTACT_EMAIL }}
          CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
        run: bash .github/scripts/asc_review_details_apply.sh

      # The submit gate is OURS, not the tool's: a submission is outward-facing and effectively
      # irreversible, so an unready version must not reach App Review even when submission was requested.
      - name: Refuse to submit an unready version
        if: ${{ inputs.submit }}
        env:
          ASC: ${{ runner.temp }}/asc
        run: |
          "$ASC" review doctor --app "$ASC_APP_ID" --output json > doctor.json
          blocking="$(jq -r '.summary.blocking // 0' doctor.json)"
          if [ "$blocking" -ne 0 ]; then
            echo "::error::refusing to submit: $blocking blocking check(s) on version $STORE_VERSION"
            jq -r '.blockingChecks[] | "::error::  \(.id): \(.message) — \(.remediation)"' doctor.json
            exit 1
          fi
          echo "review doctor: no blocking checks — safe to submit"

      - name: Submit for App Store Review
        if: ${{ inputs.submit }}
        env:
          ASC: ${{ runner.temp }}/asc
        run: |
          "$ASC" review submit --app "$ASC_APP_ID" --version "$STORE_VERSION" --build "$BUILD_ID" --confirm
          echo "::notice::version $STORE_VERSION submitted for App Store Review"

      # LAST, deliberately. The tag records what SHIPPED — the build's origin commit — and is written only
      # once everything else has succeeded, so a failed submit leaves no tag and a retry is not blocked by
      # the existence guard. Annotated, with the promoted build number in the message for auditability.
      - name: Create the release tag
        run: |
          # An annotated tag records a tagger identity; the runner has none, so set one (the
          # github-actions bot) or `git tag -a` fails with "empty ident name not allowed".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$ORIGIN_SHA" -m "App Store release $STORE_VERSION (build $BUILD_NUMBER)"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "::notice::tagged $ORIGIN_SHA as $RELEASE_TAG (build $BUILD_NUMBER)"
