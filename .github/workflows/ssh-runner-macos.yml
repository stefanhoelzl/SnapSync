# GENERATED by the ssh-runner skill from .ssh-runner.yml — do not edit.
# Run `ssh-runner init --update` after changing the config, then commit and push:
# the workflow that runs is the one on GitHub, not the one in your working tree.
# ssh-runner-template: 7
# ssh-runner-config: 1f99c9f54b26e4d6
name: ssh-runner macos
run-name: ssh-runner macos ${{ inputs.session_id }}

# Input names use underscores, NOT the config's hyphens: GitHub expressions parse
# `inputs.runs-on` as a subtraction, so a hyphenated input needs inputs['runs-on'].
on:
  workflow_dispatch:
    inputs:
      ssh_pubkey:
        description: SSH PUBLIC key authorized on the runner. Safe to pass; a pubkey is public.
        required: true
        type: string
      session_id:
        description: Correlates this run with the client's session.
        required: true
        type: string
      runs_on:
        description: Runner image.
        required: false
        default: "macos-26"
        type: string
      stop_after:
        description: Hard maximum session length, minutes.
        required: false
        default: "90"
        type: string
      idle_timeout:
        description: Close after this many minutes with no ssh connection.
        required: false
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  ssh-runner:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5

      # Warm from the same Kotlin/Native entry as ios.yml, so the first in-session build is not cold.
      # RESTORE-ONLY, deliberately: `main` owns that entry (ios.yml writes it) and a session is a pure
      # consumer. A ~500 MB session-end write into an already-full 10 GB budget would evict entries
      # every PR build depends on, and sessions are rare, hand-dispatched and branch-scoped.
      # The run id guarantees the primary key MISSES, so the restore falls through to the NEWEST entry —
      # a hit would pin the session to a possibly ancient one. Prefer the DEVICE family: this loop's
      # dominant cost is `xcodebuild -configuration Debug -destination 'generic/platform=iOS'`, which
      # links iosArm64 against exactly the `ios_arm64-gSTATIC-*` caches ios-build warms.
      # `iosSimulatorArm64Test` in a session still falls through to the shared prefix below.
      - name: Restore Kotlin/Native (~/.konan)
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-device-
            konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-
            konan-${{ runner.os }}-

      # Import ONLY the Apple Development cert (dev signing needs no Distribution cert). Ephemeral
      # keychain with a random password; dies with the runner. NO ASC key ever reaches this box — a
      # signed archive is therefore impossible here, so the loop archives UNSIGNED and re-signs by hand
      # (`scripts/dev-sign`). Both signing steps are `continue-on-error` so a missing secret still
      # yields a usable shell rather than no session at all.
      - name: Generate ephemeral keychain password
        run: |
          PW="$(openssl rand -base64 24)"
          echo "::add-mask::$PW"
          echo "KEYCHAIN_PW=$PW" >> "$GITHUB_ENV"
      - name: Import Development signing certificate
        continue-on-error: true
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}
          keychain: snapsync-ssh-runner
          keychain-password: ${{ env.KEYCHAIN_PW }}

      # The baked development provisioning profiles (no ASC key, no compile). The secret is a tar of
      # BOTH the app (`app.snapsync`) and the extension (`app.snapsync.BackgroundUpload`) profiles; the
      # re-sign signs both targets, so both must be present. A profile carries no private keys — just
      # the app id, team, device UDIDs and public certs — so it is safe as a secret. Written under BOTH
      # the classic and the Xcode-16+ directories, named by embedded UUID.
      # REFRESH when they expire (~1yr), when a new device is registered, OR when a bundle-id capability
      # is enabled — that last one silently INVALIDATES the affected profile. See `ssh-mac-build`.
      - name: Install baked development provisioning profiles
        continue-on-error: true
        env:
          DEV_PROFILE_B64: ${{ secrets.DEV_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEV_PROFILE_B64" ]; then echo "::warning::DEV_PROVISIONING_PROFILE_BASE64 unset"; exit 0; fi
          WORK="$RUNNER_TEMP/profiles"; mkdir -p "$WORK"
          printf '%s' "$DEV_PROFILE_B64" | base64 -d | tar -C "$WORK" -xf -
          for TMP in "$WORK"/*.mobileprovision; do
            UUID="$(security cms -D -i "$TMP" 2>/dev/null | plutil -extract UUID raw - )"
            EXP="$(security cms -D -i "$TMP" 2>/dev/null | plutil -extract ExpirationDate raw - )"
            for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$DIR"; cp -f "$TMP" "$DIR/$UUID.mobileprovision"
            done
            echo "installed $UUID.mobileprovision (expires $EXP)"
          done
          rm -rf "$WORK"

      - name: Start sshd and the cloudflared tunnel
        env:
          SSH_PUBKEY: ${{ inputs.ssh_pubkey }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ssh-runner"
          mkdir -p "$WORK/bin" "$HOME/.ssh-runner/bin"
          PORT=2222

          printf '%s\n' "$SSH_PUBKEY" > "$WORK/authorized_keys"
          chmod 600 "$WORK/authorized_keys"
          ssh-keygen -q -t ed25519 -N '' -f "$WORK/ssh_host_ed25519_key"

          cat > "$WORK/sshd_config" <<CFG
          Port $PORT
          HostKey $WORK/ssh_host_ed25519_key
          PidFile $WORK/sshd.pid
          AuthorizedKeysFile $WORK/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          UsePAM no
          StrictModes no
          LogLevel VERBOSE
          Subsystem sftp internal-sftp
          CFG

          # nohup + disown so sshd and the tunnel survive INTO the later hold step.
          nohup /usr/sbin/sshd -f "$WORK/sshd_config" -D -e >"$WORK/sshd.log" 2>&1 &
          disown

          # PROVE sshd is listening before going any further. Without this, a dead sshd is INVISIBLE: nohup
          # swallows the failure, cloudflared still mints a hostname for the dead port, and the descriptor is
          # published as if all were well — leaving the client to time out against a box that was never
          # reachable. Failing here instead puts the actual sshd error in the job log.
          LISTENING=""
          for _ in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/$PORT) 2>/dev/null; then LISTENING=yes; break; fi
            sleep 0.5
          done
          if [ -z "$LISTENING" ]; then
            echo "::error::sshd is not listening on $PORT"
            echo "--- sshd.log ---"; cat "$WORK/sshd.log" 2>/dev/null || echo "(no log)"
            echo "--- sshd -T ---"; /usr/sbin/sshd -f "$WORK/sshd_config" -T 2>&1 | head -20 || true
            exit 1
          fi

          # The stop script lives under $HOME, NOT $RUNNER_TEMP: RUNNER_TEMP is a step variable and is UNSET
          # in an ssh shell, so a path under it would not resolve for the client. The sentinel it touches is
          # baked in as an absolute path, which does resolve.
          cat > "$HOME/.ssh-runner/bin/stop" <<STOP
          #!/bin/sh
          touch "$WORK/stop"
          echo "ssh-runner: session closing"
          STOP
          chmod +x "$HOME/.ssh-runner/bin/stop"
          # So a human who shells in can just type `stop`. MUST stay silent: any output here breaks rsync.
          if ! grep -q 'ssh-runner/bin' "$HOME/.bashrc" 2>/dev/null; then
            echo 'PATH="$HOME/.ssh-runner/bin:$PATH"' >> "$HOME/.bashrc"
          fi

          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;; esac
          BASE=https://github.com/cloudflare/cloudflared/releases/latest/download
          if [ "$OS" = darwin ]; then
            curl -fsSL -o "$WORK/cf.tgz" "$BASE/cloudflared-darwin-$ARCH.tgz"
            tar -C "$WORK" -xf "$WORK/cf.tgz"
          else
            curl -fsSL -o "$WORK/cloudflared" "$BASE/cloudflared-linux-$ARCH"
          fi
          chmod +x "$WORK/cloudflared"
          # --protocol http2, NOT the default quic. Measured on a windows-2025 runner: with quic the tunnel
          # flaps continuously -- `Serve tunnel error error="datagram manager error: timeout: no recent
          # network activity"` followed by endless re-registration -- so it never serves a connection, and
          # the client sees only a stream that opens and closes. http2 uses the TCP path that cloudflared's
          # own pre-checks already verify.
          nohup "$WORK/cloudflared" tunnel --no-autoupdate --protocol http2 --url "tcp://localhost:$PORT" >"$WORK/cf.log" 2>&1 &
          disown

          # Poll rather than `head -1 <(tail -f ...)`: the process-substitution form is neater but hangs
          # forever if cloudflared dies, and `timeout` is not on macOS runners to bound it.
          HOST=""
          for _ in $(seq 1 90); do
            HOST=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$WORK/cf.log" | head -1 || true)
            [ -n "$HOST" ] && break
            sleep 1
          done
          if [ -z "$HOST" ]; then
            echo "::error::cloudflared produced no hostname"
            cat "$WORK/cf.log"
            exit 1
          fi
          HOST=${HOST#https://}
          HOSTKEY=$(cut -d' ' -f1,2 < "$WORK/ssh_host_ed25519_key.pub")

          # The descriptor. `host_key` is what lets the client pin the host instead of blindly accepting it.
          cat > "$WORK/session.json" <<JSON
          {
            "host": "$HOST",
            "port": $PORT,
            "user": "$USER",
            "os": "$OS",
            "run_id": "$GITHUB_RUN_ID",
            "host_key": "$HOSTKEY",
            "workspace": "$GITHUB_WORKSPACE"
          }
          JSON
          echo "ssh-runner session ready on $HOST"

      - name: Publish the session descriptor
        uses: actions/upload-artifact@v4
        with:
          name: session-${{ inputs.session_id }}
          path: ${{ runner.temp }}/ssh-runner/session.json
          retention-days: 1

      - name: Hold the session open
        env:
          STOP_AFTER: ${{ inputs.stop_after }}
          IDLE_TIMEOUT: ${{ inputs.idle_timeout }}
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/ssh-runner"
          END=$(( $(date +%s) + STOP_AFTER * 60 ))
          IDLE=$(( IDLE_TIMEOUT * 60 ))
          LAST=$(date +%s)

          # Idle is measured as "no established ssh connection", so a long build or a hand-opened shell counts
          # as activity for free and the client needs no keepalive of its own.
          conns() {
            if command -v ss >/dev/null 2>&1; then
              ss -Htn state established "( sport = :2222 )" 2>/dev/null | grep -c . || true
            else
              netstat -an -p tcp 2>/dev/null | awk '$6 == "ESTABLISHED" && $4 ~ /\.2222$/' | grep -c . || true
            fi
          }

          echo "Session open. \`stop\` over ssh ends it; idle ${IDLE_TIMEOUT}m; hard max ${STOP_AFTER}m."
          while :; do
            if [ -f "$WORK/stop" ]; then echo "Ending: stop requested."; break; fi
            NOW=$(date +%s)
            if [ "$NOW" -ge "$END" ]; then echo "Ending: stop-after reached."; break; fi
            if [ "$(conns)" -gt 0 ]; then LAST=$NOW; fi
            if [ $(( NOW - LAST )) -ge "$IDLE" ]; then echo "Ending: idle timeout."; break; fi
            sleep 5
          done

          pkill -f 'cloudflared tunnel' 2>/dev/null || true
          pkill -f "sshd -f $WORK" 2>/dev/null || true

      - name: Transport logs
        if: always()
        run: |
          echo "--- sshd.log ---"; tail -40 "$RUNNER_TEMP/ssh-runner/sshd.log" 2>/dev/null || true
          echo "--- cloudflared.log ---"; tail -60 "$RUNNER_TEMP/ssh-runner/cf.log" 2>/dev/null || true
