# iOS CI (capability: ios-ci). Two parallel jobs on the macos-26 hosted runner (GM Xcode, no
# beta SDK), each reporting a status check that gates merges (branch-protection):
#   * ios-build — builds the iOS DEVICE (iphoneos, arm64) app unsigned. Build-only: no tests,
#     no simulator boot, no signing. Links the iosArm64 framework (the shipping target).
#   * ios-test  — runs the shared commonTest compiled to Kotlin/Native on a booted simulator
#     (./gradlew iosSimulatorArm64Test), validating the iosSimulatorArm64 target.
# Together the two jobs exercise BOTH Kotlin/Native targets (device via build, simulator via
# test) with no redundant work. The Linux-buildable work (JVM/desktop + the JVM run of all unit
# tests) stays in build.yml; this workflow does only the irreducible Apple delta.
#
# A THIRD job, ios-release (capability: ios-testflight-delivery), runs ONLY on main and ONLY after
# both gates pass (needs: [ios-build, ios-test]): it signs the device app and uploads it to
# TestFlight. It is delivery, NOT a merge gate, and is skipped on every non-main branch.
name: ios

on:
  push:

permissions:
  contents: read

# Namespaced group (NOT the bare github.ref used by build.yml) so the Linux build and the iOS
# workflow do not share a concurrency group and cancel each other. A newer push to a ref cancels
# its own in-progress iOS run — all jobs, since the group is workflow-wide.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    # This display name is the status-check context required by .github/rulesets/main.json.
    # Changing it without updating the ruleset would freeze merges (the required check would
    # never be posted).
    name: ios-build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Cache the Kotlin/Native toolchain + compiled klibs (cold ~12 min -> warm a few min).
      # Keyed on libs.versions.toml so a Kotlin/Native version bump invalidates the cache.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Build iOS device app (unsigned, build-only)
        run: |
          # Builds for a generic iOS DEVICE destination, so xcodebuild's "Compile Kotlin Framework"
          # Run Script phase links the iosArm64 framework (the target that ships to phones /
          # TestFlight) — a distinct Kotlin/Native target from the simulator one the ios-test job
          # exercises. No tests, no simulator boot, no signing — the build IS the gate.
          # CODE_SIGN* flags build unsigned with the empty TEAM_ID in Config.xcconfig (no profile).
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  ios-test:
    # Display name = the status-check context required by .github/rulesets/main.json. Runs in
    # parallel with ios-build (no `needs:`). Same macos-26 + caching scaffolding as ios-build;
    # the two jobs compile different Kotlin/Native targets, so the heavy per-target work is not
    # duplicated — only checkout/setup + the commonMain klib compile is re-paid.
    name: ios-test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Run Kotlin/Native unit tests on the iOS simulator
        run: |
          # Boots an iOS simulator (iOS 26 runtime on macos-26) and runs the commonTest of
          # :domain:status, :domain:engine, :domain:presentation compiled to Kotlin/Native for
          # iosSimulatorArm64 — the same shared logic build.yml runs as JVM bytecode, now
          # validated on Native. Kotlin auto-selects a standalone simulator; if a run fails with
          # "no matching device", pin one via testRuns["test"].deviceId in the module build.
          ./gradlew iosSimulatorArm64Test

  ios-release:
    # Delivery (capability: ios-testflight-delivery), NOT a merge gate. Gated to main and to the
    # two gates passing, so a TestFlight build is only cut from a green main commit. Signing is
    # fully CLOUD-MANAGED: xcodebuild -allowProvisioningUpdates uses the App Store Connect API key
    # (Admin role) to manage the distribution certificate AND provisioning profile in the cloud —
    # no imported cert, no stored/cached signing assets, no fastlane, no match.
    name: ios-release
    needs: [ios-build, ios-test]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # Write the App Store Connect API key (.p8) to disk for xcodebuild's auth flags.
      - name: Prepare App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # Archive the signed device app. The xcodebuild invocation triggers the project's "Compile
      # Kotlin Framework" Run Script phase (./gradlew :app:ios:embedAndSign...) for iosArm64.
      # Build number = the monotonic run number; -allowProvisioningUpdates cloud-manages cert+profile.
      - name: Archive signed device app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -derivedDataPath build/ios \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/export/SnapSync.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
