# iOS CI (capability: ios-ci). Two parallel jobs on the macos-26 hosted runner (GM Xcode, no
# beta SDK), each reporting a status check that gates merges (branch-protection):
#   * ios-build — builds the iOS DEVICE (iphoneos, arm64) app unsigned. Build-only: no tests,
#     no simulator boot, no signing. Links the iosArm64 framework (the shipping target).
#   * ios-test  — runs the shared commonTest compiled to Kotlin/Native on a booted simulator
#     (./gradlew iosSimulatorArm64Test), validating the iosSimulatorArm64 target.
# Together the two jobs exercise BOTH Kotlin/Native targets (device via build, simulator via
# test) with no redundant work. The Linux-buildable work (JVM/desktop + the JVM run of all unit
# tests) stays in build.yml; this workflow does only the irreducible Apple delta.
name: ios

on:
  push:

permissions:
  contents: read

# Namespaced group (NOT the bare github.ref used by build.yml) so the Linux build and the iOS
# workflow do not share a concurrency group and cancel each other. A newer push to a ref cancels
# its own in-progress iOS run — both jobs, since the group is workflow-wide.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    # This display name is the status-check context required by .github/rulesets/main.json.
    # Changing it without updating the ruleset would freeze merges (the required check would
    # never be posted).
    name: ios-build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Cache the Kotlin/Native toolchain + compiled klibs (cold ~12 min -> warm a few min).
      # Keyed on libs.versions.toml so a Kotlin/Native version bump invalidates the cache.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Build iOS device app (unsigned, build-only)
        run: |
          # Builds for a generic iOS DEVICE destination, so xcodebuild's "Compile Kotlin Framework"
          # Run Script phase links the iosArm64 framework (the target that ships to phones /
          # TestFlight) — a distinct Kotlin/Native target from the simulator one the ios-test job
          # exercises. No tests, no simulator boot, no signing — the build IS the gate.
          # CODE_SIGN* flags build unsigned with the empty TEAM_ID in Config.xcconfig (no profile).
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  ios-test:
    # Display name = the status-check context required by .github/rulesets/main.json. Runs in
    # parallel with ios-build (no `needs:`). Same macos-26 + caching scaffolding as ios-build;
    # the two jobs compile different Kotlin/Native targets, so the heavy per-target work is not
    # duplicated — only checkout/setup + the commonMain klib compile is re-paid.
    name: ios-test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Run Kotlin/Native unit tests on the iOS simulator
        run: |
          # Boots an iOS simulator (iOS 26 runtime on macos-26) and runs the commonTest of
          # :domain:status, :domain:engine, :domain:presentation compiled to Kotlin/Native for
          # iosSimulatorArm64 — the same shared logic build.yml runs as JVM bytecode, now
          # validated on Native. Kotlin auto-selects a standalone simulator; if a run fails with
          # "no matching device", pin one via testRuns["test"].deviceId in the module build.
          ./gradlew iosSimulatorArm64Test
