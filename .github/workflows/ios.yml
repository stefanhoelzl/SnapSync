# iOS CI. Two parallel jobs on the macos-26 hosted runner (GM Xcode, no beta SDK), each reporting
# a status check that gates merges (branch-protection):
#   * ios-build — builds the iOS DEVICE (iphoneos, arm64) app, linking the iosArm64 framework (the
#     shipping target). On every NON-main ref (branches / PRs) it builds UNSIGNED (cheap, no
#     secrets) — that build IS the merge gate. On MAIN the same job instead produces a SIGNED
#     archive (which still compiles iosArm64, so it remains the gate) and uploads it to TestFlight
#     (capability: ios-testflight-delivery). One device compile per push, never two.
#   * ios-test  — runs the shared commonTest compiled to Kotlin/Native on a booted simulator
#     (./gradlew iosSimulatorArm64Test), validating the iosSimulatorArm64 target.
# Together the two jobs exercise BOTH Kotlin/Native targets (device via build, simulator via
# test). The Linux-buildable work (JVM/desktop + the JVM run of all unit tests) stays in build.yml;
# this workflow does only the irreducible Apple delta.
#
# Signing (main only) is fully CLOUD-MANAGED: xcodebuild -allowProvisioningUpdates uses the App
# Store Connect API key (Admin role) to manage the distribution certificate AND provisioning
# profile in the cloud — no imported cert, no stored/cached signing assets, no fastlane, no match.
name: ios

on:
  push:

permissions:
  contents: read

# Namespaced group (NOT the bare github.ref used by build.yml) so the Linux build and the iOS
# workflow do not share a concurrency group and cancel each other. A newer push to a ref cancels
# its own in-progress iOS run — both jobs, since the group is workflow-wide.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    # This display name is the status-check context required by .github/rulesets/main.json.
    # Changing it without updating the ruleset would freeze merges (the required check would
    # never be posted).
    name: ios-build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Cache the Kotlin/Native toolchain + compiled klibs (cold ~12 min -> warm a few min).
      # Keyed on libs.versions.toml so a Kotlin/Native version bump invalidates the cache.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # NON-main (branches / PRs): the merge gate. Builds for a generic iOS DEVICE destination, so
      # xcodebuild's "Compile Kotlin Framework" Run Script phase links the iosArm64 framework (the
      # target that ships) — UNSIGNED, no secrets. No tests, no simulator boot, no signing.
      - name: Build iOS device app (unsigned gate)
        if: github.ref != 'refs/heads/main'
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # MAIN only: the signed archive both compiles iosArm64 (so it remains the build gate) AND is
      # the delivery source. Write the App Store Connect API key (.p8) for xcodebuild's auth flags.
      - name: Prepare App Store Connect API key
        if: github.ref == 'refs/heads/main'
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # Build number = the monotonic run number; -allowProvisioningUpdates cloud-manages cert+profile.
      - name: Archive signed device app (main)
        if: github.ref == 'refs/heads/main'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -derivedDataPath build/ios \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export signed IPA (main)
        if: github.ref == 'refs/heads/main'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight (main)
        if: github.ref == 'refs/heads/main'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ runner.temp }}/export/SnapSync.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}

  ios-test:
    # Display name = the status-check context required by .github/rulesets/main.json. Runs in
    # parallel with ios-build (no `needs:`). Same macos-26 + caching scaffolding as ios-build;
    # the two jobs compile different Kotlin/Native targets, so the heavy per-target work is not
    # duplicated — only checkout/setup + the commonMain klib compile is re-paid.
    name: ios-test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Run Kotlin/Native unit tests on the iOS simulator
        run: |
          # Boots an iOS simulator (iOS 26 runtime on macos-26) and runs the commonTest of
          # :domain:status, :domain:engine, :domain:presentation compiled to Kotlin/Native for
          # iosSimulatorArm64 — the same shared logic build.yml runs as JVM bytecode, now
          # validated on Native. Kotlin auto-selects a standalone simulator; if a run fails with
          # "no matching device", pin one via testRuns["test"].deviceId in the module build.
          ./gradlew iosSimulatorArm64Test
