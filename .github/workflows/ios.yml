# iOS CI. Four jobs. TWO are the parallel merge gates on the macos-26 hosted runner (GM Xcode, no
# beta SDK; branch-protection requires exactly these two status checks); the THIRD delivers and gates
# on both; the FOURTH promotes what was delivered into the PUBLIC alpha TestFlight channel:
#   * ios-build — on EVERY push (any ref) produces a SIGNED archive of the iOS DEVICE (iphoneos,
#     arm64) app, linking the iosArm64 framework (the shipping target). The archive step compiles
#     iosArm64, so it IS the merge gate. This job is a PURE GATE: it exports nothing and uploads
#     nothing to Apple. On main it hands the archive to ios-deliver as a workflow artifact.
#     Per-branch device installability before merge is served OUT OF BAND by the ssh-mac build loop
#     (.github/workflows/ssh-mac.yml; see CLAUDE.md), not by a CI artifact.
#   * ios-test  — runs the shared commonTest compiled to Kotlin/Native on a booted simulator
#     (./gradlew iosSimulatorArm64Test), validating the iosSimulatorArm64 target. Runs in PARALLEL
#     with ios-build (no `needs:`) — neither gate waits on the other.
#   * ios-deliver — main ONLY, and `needs: [ios-build, ios-test]`: exports the App Store IPA from
#     ios-build's archive and uploads it to TestFlight. Because it needs BOTH gates, a RED TEST SUITE
#     NOW STOPS THE RELEASE. It previously could not: export+upload lived inside ios-build, which has
#     no dependency on ios-test, so a green build shipped to TestFlight while the tests were failing
#     on the very same commit (run #297 / build 297 did exactly that).
#   * ios-promote — main ONLY, `needs: ios-deliver`, on UBUNTU: puts the uploaded build into the
#     `alpha` EXTERNAL beta group, whose public link anyone may tap. Uploading is not distributing:
#     without this job a build reaches only the internal `development` group and no public tester ever
#     sees it. Pure App Store Connect REST — no Xcode, no IPA, no signing material. See its own header.
# Together ios-build and ios-test exercise BOTH Kotlin/Native targets (device via build, simulator
# via test). The Linux-buildable work (JVM/desktop + the JVM run of all unit tests) stays in
# build.yml; this workflow does only the irreducible Apple delta.
#
# Why delivery is a SEPARATE JOB and not a step: it makes "delivery never blocks merges" STRUCTURAL
# rather than a `continue-on-error` convention. ios-deliver runs only on main (post-merge) and posts
# no branch-protection status check, so it is free to fail RED without blocking anything — which is
# strictly better than the old continue-on-error, where a failed TestFlight upload left the run green
# and the failure was easy to miss. Do NOT add ios-deliver to .github/rulesets/main.json: it never
# runs on a PR branch, so as a required check it would never be posted and merges would freeze.
#
# Signing: TWO persistent certs — an Apple Distribution (SIGNING_CERT_* secrets) and an Apple
# Development (SIGNING_DEV_CERT_* secrets) — are imported into one shared keychain, and
# xcodebuild -allowProvisioningUpdates uses the App Store Connect API key (Admin role) to manage the
# provisioning PROFILES in the cloud (profiles have no cap). Importing BOTH fixed certs is
# deliberate: an empty runner keychain makes automatic signing mint a NEW cert every run, exhausting
# Apple's per-account cert cap under every-push delivery. The Development cert matters because
# `xcodebuild archive` provisions a development identity for the team in addition to the
# distribution one — persisting only Distribution (the prior state) still churned Development certs.
# BOTH jobs that invoke xcodebuild with -allowProvisioningUpdates (ios-build's archive and
# ios-deliver's export) therefore import both certs, so neither can mint one. No fastlane, no match.
name: ios

on:
  push:
    # BRANCHES only. A `vX.Y` tag is handled by ios-release.yml (App Store release); excluding tags
    # here keeps a release from triggering a redundant alpha archive/deliver/promote. Every branch push
    # still runs (no path filter), so the required `ios-build` / `ios-test` checks are posted on every
    # branch and PR and no merge can freeze.
    branches: ["**"]
  # Manual dispatch to override the compile-time upload host (PhotoKit forces the host to be
  # compile-time). A plain push supplies no input → the archive does NOT override the build setting,
  # so it bakes the Config.xcconfig default (the deployed HTTPS backend, the single source of the
  # host literal), which all builds (incl. main/TestFlight) target — safe because the device holds no
  # credential. Set `upload_host` only to point a dev IPA at an alternate HTTPS host (e.g. staging);
  # it is HTTPS-only and a non-https value fails the run (default ATS forbids plaintext anyway).
  workflow_dispatch:
    inputs:
      upload_host:
        description: "Override the compile-time host for the dev IPA, HTTPS-only e.g. https://staging.example (empty = Config.xcconfig default)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Namespaced group (NOT the bare github.ref used by build.yml) so the Linux build and the iOS
# workflow do not share a concurrency group and cancel each other. A newer push to a ref cancels
# its own in-progress iOS run — both jobs, since the group is workflow-wide.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    # This display name is the status-check context required by .github/rulesets/main.json.
    # Changing it without updating the ruleset would freeze merges (the required check would
    # never be posted).
    name: ios-build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.0
      # Reject a non-HTTPS upload_host before archiving: default ATS (HTTPS-only) forbids plaintext,
      # so a baked http:// host would silently fail every upload on device. Empty input = no override
      # (the archive uses the Config.xcconfig default), so this is a no-op for ordinary pushes.
      - name: Validate upload_host is HTTPS
        env:
          UPLOAD_HOST: ${{ inputs.upload_host }}
        run: |
          if [ -n "$UPLOAD_HOST" ] && [ "${UPLOAD_HOST#https://}" = "$UPLOAD_HOST" ]; then
            echo "::error::upload_host must be HTTPS (got: $UPLOAD_HOST)"
            exit 1
          fi

      # Pick the build configuration, host override, and APNs environment. A workflow_dispatch with an
      # (HTTPS) `upload_host` builds a DEBUG dev-IPA (skips the LLVM optimizer, the bulk of the ~6 min
      # archive) and keeps the Config.xcconfig development/sandbox APNs default. EVERY push (the merge
      # gate) and any plain dispatch stay RELEASE, set NO host override (bake the Config.xcconfig host),
      # and set APNs to PRODUCTION — a TestFlight/App Store distribution build must be production
      # (capability ios-testflight-delivery); only the dev-sideload path stays sandbox.
      - name: Select build configuration, host override, and APNs environment
        env:
          UPLOAD_HOST: ${{ inputs.upload_host }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$UPLOAD_HOST" ]; then
            echo "BUILD_CONFIG=Debug" >> "$GITHUB_ENV"
            echo "UPLOAD_HOST_OUT=$UPLOAD_HOST" >> "$GITHUB_ENV"
            echo "APS_ENV_OUT=" >> "$GITHUB_ENV"
            echo "APNS_ENV_OUT=" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONFIG=Release" >> "$GITHUB_ENV"
            echo "UPLOAD_HOST_OUT=" >> "$GITHUB_ENV"
            echo "APS_ENV_OUT=production" >> "$GITHUB_ENV"
            echo "APNS_ENV_OUT=production" >> "$GITHUB_ENV"
          fi

      # The signed archive doubles as the merge gate (it compiles the shipping iosArm64 framework) and
      # the delivery source. All the archive+sign scaffolding — Java/Gradle/Konan setup, the extension
      # compile, the ASC key, the ephemeral keychain, BOTH persistent certs, and the archive — lives in
      # the shared composite action so the tag release (ios-release.yml) reuses it byte-for-byte. Build
      # number = the monotonic run number. marketing-version stays EMPTY here so the archive bakes the
      # Config.xcconfig fallback (0.1.0, alpha); only the release overrides it from the tag.
      - name: Archive signed device app
        uses: ./.github/actions/ios-archive
        with:
          build-config: ${{ env.BUILD_CONFIG }}
          marketing-version: ""
          aps-environment: ${{ env.APS_ENV_OUT }}
          apns-env: ${{ env.APNS_ENV_OUT }}
          upload-host: ${{ env.UPLOAD_HOST_OUT }}
          current-project-version: ${{ github.run_number }}
          archive-path: ${{ runner.temp }}/SnapSync.xcarchive
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
          signing-cert-p12-base64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          signing-cert-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
          signing-dev-cert-p12-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          signing-dev-cert-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}

      # Hand the archive to ios-deliver (main ONLY). Export + TestFlight upload no longer happen here:
      # they moved to ios-deliver, which needs BOTH gates green, so a red ios-test now stops the
      # release. The device app is still compiled EXACTLY ONCE per push — ios-deliver re-signs and
      # packages this archive, it never recompiles.
      #
      # TAR first, then upload: upload-artifact zips its payload and does not preserve executable bits
      # or symlinks. Restoring a .app through that round-trip would corrupt the signed bundle and break
      # `xcodebuild -exportArchive`. tar preserves the modes, so the archive survives the hand-off
      # byte-for-byte.
      - name: Pack the signed archive for delivery
        if: github.ref == 'refs/heads/main'
        run: tar -czf "$RUNNER_TEMP/SnapSync.xcarchive.tar.gz" -C "$RUNNER_TEMP" SnapSync.xcarchive

      - name: Upload the signed archive for delivery
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-archive
          path: ${{ runner.temp }}/SnapSync.xcarchive.tar.gz
          # The archive is a build intermediate handed to the very next job in the same run — it is not
          # a release artifact and nobody fetches it later. One day is ample and keeps the signed app
          # (this is a public repo) from lingering.
          retention-days: 1
          if-no-files-found: error

  # TestFlight delivery — main ONLY, and gated on BOTH merge checks (capability
  # ios-testflight-delivery). `needs: [ios-build, ios-test]` is the whole point of this job: it is what
  # makes a RED TEST SUITE STOP THE RELEASE. If either gate fails, this job never runs and nothing
  # reaches TestFlight.
  #
  # This job posts NO branch-protection status check (see the ruleset note in the header): it only ever
  # runs on main, so requiring it would freeze merges. That means it is free to fail RED and block
  # nothing — which is why the old `continue-on-error` on export/upload is gone. A delivery flake is now
  # a visibly red run instead of a green one hiding a failed step.
  #
  # No Java/Gradle/Konan setup here: this job compiles nothing. It re-signs and packages the archive
  # ios-build already produced.
  ios-deliver:
    name: ios-deliver
    needs: [ios-build, ios-test]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      # Needed for iosApp/ExportOptions.plist (the export method + signing style).
      - uses: actions/checkout@v7.0.0

      - name: Prepare App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Generate ephemeral keychain password
        run: |
          PW="$(openssl rand -base64 24)"
          echo "::add-mask::$PW"
          echo "KEYCHAIN_PW=$PW" >> "$GITHUB_ENV"

      # Import BOTH certs here too, for the same cert-cap reason as ios-build: the export below runs
      # `-allowProvisioningUpdates`, and an empty keychain is what makes automatic signing mint a new
      # cert. Distribution signs the App Store IPA; Development is imported so nothing can provision
      # (and therefore mint) a development identity on this runner either.
      - name: Import Distribution signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
          keychain: snapsync-signing
          keychain-password: ${{ env.KEYCHAIN_PW }}
      - name: Import Development signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}
          keychain: snapsync-signing
          create-keychain: false
          keychain-password: ${{ env.KEYCHAIN_PW }}

      - name: Download the signed archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: ios-archive
          path: ${{ runner.temp }}

      # Untar with the same modes ios-build packed (see the tar note there).
      - name: Unpack the signed archive
        run: tar -xzf "$RUNNER_TEMP/SnapSync.xcarchive.tar.gz" -C "$RUNNER_TEMP"

      # Re-signs and packages the ALREADY-COMPILED archive into an App Store IPA. The build number
      # (CURRENT_PROJECT_VERSION = github.run_number) was baked at archive time and is carried in the
      # archive's Info.plist — this job is in the SAME run, so the delivered build number still equals
      # this run's number.
      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/SnapSync.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}

  # TestFlight PROMOTION — main ONLY, and `needs: ios-deliver` (capability ios-testflight-delivery).
  # This is what makes the public alpha channel BE main. ios-deliver uploads the build to App Store
  # Connect and STOPS: without this job the build reaches the INTERNAL `development` group (which has
  # hasAccessToAllBuilds) and nobody else, so builds pile up unseen — 295, 297, 300, 302, 308 and 310
  # all sat VALID in no external group before this job existed. Here the build joins `alpha`: an
  # EXTERNAL group whose public link (https://testflight.apple.com/join/pvqgV7Uz) anyone may tap.
  #
  # Why UBUNTU, not macOS: this job compiles nothing and signs nothing. It is pure App Store Connect
  # REST against the build identified by github.run_number — no Xcode, no IPA, no keychain, no
  # certificate, and no artifact hand-off from ios-deliver beyond the job dependency. It DOES idle for
  # minutes waiting on Apple to finish PROCESSING the build (add-build requires processingState VALID),
  # and that idle belongs on a free Ubuntu runner rather than a macOS one.
  #
  # Like ios-deliver it posts NO branch-protection status check, so it is free to fail RED while
  # blocking nothing. Do NOT add ios-promote to .github/rulesets/main.json: it never runs on a PR
  # branch, so as a required check it would never be posted and merges would freeze.
  #
  # ORDER IS LOAD-BEARING. TestFlight raises the tester notification when a build becomes AVAILABLE TO
  # THE GROUP, so `Suppress the tester notification` MUST run BEFORE `Add the build to the alpha
  # group`. A failed suppression aborts the job before the assignment, so no un-suppressed build can
  # ever reach a tester. Never swap those two steps: "no alpha tester is ever notified" is a promise
  # made to testers, and the swap looks harmless.
  #
  # EVERY main build is promoted — no filter on paths, commit type, or whether the binary actually
  # changed. Docs-only and backend-only merges therefore ship a binary-identical build. That is
  # deliberate: every filter considered (path allowlist, binary hash, conventional-commit type) fails
  # toward "a real fix SILENTLY never reaches testers", which is the worst thing an alpha channel can
  # do. Promoting everything fails only toward tester-visible noise. A path filter on the `push`
  # trigger would additionally freeze merges, since ios-build and ios-test are REQUIRED checks and a
  # skipped required check is never posted.
  #
  # Beta App Review is in the loop but is NOT a gate: a build carrying an already-approved
  # MARKETING_VERSION auto-approves instantly, and add-build accepts a build that is still
  # WAITING_FOR_REVIEW. The exception is a MARKETING_VERSION BUMP — the first build of a new version
  # faces a REAL review (hours to days), and while it waits each merge expires its predecessor's
  # submission (--expire-build-submitted-for-review, newest wins). During that window NOTHING reaches
  # testers and NOTHING IS RED. Expected, not a bug.
  #
  # Likewise: `concurrency: ios-<ref>` with cancel-in-progress means a merge landing while an earlier
  # ios-promote is still polling CANCELS it, and that build is never promoted. Also expected — the
  # newer run promotes the newer build and nothing a tester should have seen is lost.
  ios-promote:
    name: ios-promote
    needs: ios-deliver
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # The same Admin key ios-build and ios-deliver use. No new secret is introduced.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      # codemagic-cli-tools reads the key from ITS OWN env var names; same three values.
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      ASC_APP_ID: "6781692480"
      BETA_GROUP: alpha
    steps:
      # Only .github/scripts/testflight_promote.py is needed — no source, no Gradle.
      - uses: actions/checkout@v7.0.0

      - name: Install the App Store Connect clients
        run: pip install --quiet 'pyjwt[crypto]' requests codemagic-cli-tools

      # Find the build ios-deliver just uploaded. Its build number IS github.run_number
      # (CURRENT_PROJECT_VERSION is baked from it at archive time, and this job runs in the SAME run),
      # so no artifact hand-off is needed. RETRIES, because a freshly uploaded build is not
      # immediately discoverable. Also sets ALREADY_PROMOTED, the idempotency guard: re-running a
      # flaked promotion must be a green no-op, never a red error.
      - name: Resolve the uploaded build
        run: |
          python .github/scripts/testflight_promote.py resolve \
            "$ASC_APP_ID" "${{ github.run_number }}" "$BETA_GROUP"

      # What a tester sees next to the build in the TestFlight app. Never a push (see below) — but it
      # is the only thing that tells them what landed, so it earns its keep.
      - name: Set the release note
        if: env.ALREADY_PROMOTED != 'true'
        run: |
          app-store-connect builds add-beta-test-info "$BUILD_ID" \
            --whats-new "$(git log -1 --format='%s') (${GITHUB_SHA:0:7})"

      # Waits for processingState VALID, then submits. --expire-build-submitted-for-review makes the
      # NEWEST main build win a review pile-up (only reachable after a MARKETING_VERSION bump).
      - name: Submit to TestFlight
        if: env.ALREADY_PROMOTED != 'true'
        run: |
          app-store-connect builds submit-to-testflight "$BUILD_ID" \
            --max-build-processing-wait 20 \
            --expire-build-submitted-for-review

      # MUST precede the group assignment — see the ORDER IS LOAD-BEARING note above. Alpha testers
      # ride main silently via TestFlight auto-update; TestFlight never pushes them a notification.
      - name: Suppress the tester notification
        if: env.ALREADY_PROMOTED != 'true'
        run: python .github/scripts/testflight_promote.py silence "$BUILD_ID"

      # The build becomes installable to every public-link tester here — and only here, which is why
      # the suppression above had to land first.
      - name: Add the build to the alpha group
        if: env.ALREADY_PROMOTED != 'true'
        run: app-store-connect beta-groups add-build "$BUILD_ID" --beta-group "$BETA_GROUP"

  ios-test:
    # Display name = the status-check context required by .github/rulesets/main.json. Runs in
    # parallel with ios-build (no `needs:`). Same macos-26 + caching scaffolding as ios-build;
    # the two jobs compile different Kotlin/Native targets, so the heavy per-target work is not
    # duplicated — only checkout/setup + the commonMain klib compile is re-paid.
    name: ios-test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Run Kotlin/Native unit tests on the iOS simulator
        run: |
          # Boots an iOS simulator (iOS 26 runtime on macos-26) and runs the iosSimulatorArm64 tests
          # of EVERY module that declares the target — ~600 tests across ~65 classes, i.e. the whole
          # shared commonTest surface (every :domain:* and :capability:*, plus :test:world and
          # :test:integration), which is the same logic build.yml runs as JVM bytecode, now compiled to
          # Native. This is the ONLY place that difference is checked, and it is not theoretical: it
          # catches Native-only breakage the JVM accepts (e.g. Kotlin/Native rejects a comma in a
          # backticked test name).
          #
          # Native-only source sets — no JVM equivalent, so this is their only run: :domain:engine's
          # NativeLedgerBackendTest (the SQLDelight native driver behind the shared LedgerBackendContract),
          # :domain:keychain's IosKeychainTest, and :app:ios:photokit-extension's PhotoKitSmokeTest
          # (general PhotoKit is callable on the sim; the cloud-id + upload-job subsystems are
          # device-only and not exercised here).
          #
          # NOT covered here: :domain:ui's Compose tests and the SQLDelight JVM-driver tests (jvmTest
          # only), and :test:architecture (JVM-only Konsist, by design).
          #
          # Kotlin auto-selects a standalone simulator; if a run fails with "no matching device", pin
          # testRuns["test"].deviceId.
          ./gradlew iosSimulatorArm64Test
