# iOS CI. Three jobs. TWO are the parallel merge gates on the macos-26 hosted runner (GM Xcode, no
# beta SDK; branch-protection requires exactly these two status checks); the THIRD delivers and gates
# on both. There is NO automatic distribution to any external tester: the uploaded build reaches only
# the INTERNAL `development` group. Distribution to real users is the dispatch-driven App Store release
# (ios-appstore-promote.yml, capability ios-appstore-release); the public alpha promotion was removed.
#   * ios-build — on EVERY push (any ref) produces a SIGNED archive of the iOS DEVICE (iphoneos,
#     arm64) app, linking the iosArm64 framework (the shipping target). The archive step compiles
#     iosArm64, so it IS the merge gate. Configuration is per-ref (capability ios-ci): main — the
#     delivery source — archives RELEASE; every other push ref archives DEBUG,
#     which compiles the identical surface and skips only the LLVM optimization pass that dominates
#     the Release link (~5-9.5 min) on an archive that is discarded anyway. This job is a PURE GATE:
#     it exports nothing and uploads nothing to Apple. On main it hands the archive to ios-deliver
#     as a workflow artifact.
#     Per-branch device installability before merge is served OUT OF BAND by the ssh-mac build loop
#     (.github/workflows/ssh-mac.yml; see CLAUDE.md), not by a CI artifact.
#   * ios-test  — runs the shared commonTest compiled to Kotlin/Native on a booted simulator
#     (./gradlew iosSimulatorArm64Test), validating the iosSimulatorArm64 target. Runs in PARALLEL
#     with ios-build (no `needs:`) — neither gate waits on the other.
#   * ios-deliver — main ONLY, and `needs: [ios-build, ios-test]`: exports the App Store IPA from
#     ios-build's archive and uploads it to TestFlight via codemagic's `app-store-connect publish`,
#     which also attaches the "What to Test" note (`<PR title> (#<num>, <short sha>)`) in the same
#     invocation. Because it needs BOTH gates, a RED TEST SUITE
#     NOW STOPS THE RELEASE. It previously could not: export+upload lived inside ios-build, which has
#     no dependency on ios-test, so a green build shipped to TestFlight while the tests were failing
#     on the very same commit (run #297 / build 297 did exactly that).
# Together ios-build and ios-test exercise BOTH Kotlin/Native targets (device via build, simulator
# via test). The Linux-buildable work (JVM/desktop + the JVM run of all unit tests) stays in
# build.yml; this workflow does only the irreducible Apple delta.
#
# Why delivery is a SEPARATE JOB and not a step: it makes "delivery never blocks merges" STRUCTURAL
# rather than a `continue-on-error` convention. ios-deliver runs only on main (post-merge) and posts
# no branch-protection status check, so it is free to fail RED without blocking anything — which is
# strictly better than the old continue-on-error, where a failed TestFlight upload left the run green
# and the failure was easy to miss. Do NOT add ios-deliver to .github/rulesets/main.json: it never
# runs on a PR branch, so as a required check it would never be posted and merges would freeze.
#
# Signing: TWO persistent certs — an Apple Distribution (SIGNING_CERT_* secrets) and an Apple
# Development (SIGNING_DEV_CERT_* secrets) — are imported into one shared keychain, and
# xcodebuild -allowProvisioningUpdates uses the App Store Connect API key (Admin role) to manage the
# provisioning PROFILES in the cloud (profiles have no cap). Importing BOTH fixed certs is
# deliberate: an empty runner keychain makes automatic signing mint a NEW cert every run, exhausting
# Apple's per-account cert cap under every-push delivery. The Development cert matters because
# `xcodebuild archive` provisions a development identity for the team in addition to the
# distribution one — persisting only Distribution (the prior state) still churned Development certs.
# BOTH jobs that invoke xcodebuild with -allowProvisioningUpdates (ios-build's archive and
# ios-deliver's export) therefore import both certs, so neither can mint one. No fastlane, no match.
name: ios

on:
  push:
    # BRANCHES only. A `vX.Y` tag is a release RECEIPT created by ios-appstore-promote.yml (it triggers
    # nothing); excluding tags here keeps that tag from firing a redundant archive/deliver. Every branch push
    # still runs (no path filter), so the required `ios-build` / `ios-test` checks are posted on every
    # branch and PR and no merge can freeze.
    branches: ["**"]
  # NO workflow_dispatch. There used to be one, carrying an `upload_host` input meant to point a dev
  # IPA at an alternate HTTPS host — but it could never deliver that: ios-build publishes its archive
  # `if: github.ref == 'refs/heads/main'`, so a dispatched run built a Debug archive and then THREW IT
  # AWAY. There was no way to get the IPA out of it.
  #
  # Pointing a device build at another backend is an operator action on the ssh-mac loop's own
  # xcodebuild line (`BACKGROUND_UPLOAD_URL_BASE=<https-host>`), where a human is present to receive
  # the IPA — which is also where per-branch device installability already lives (capability `ios-ci`).
  #
  # Removing the trigger also removes the plain-dispatch escape hatch for exercising the RELEASE path
  # on a branch pre-merge. Accepted, eyes open: it widens the trade-off `ios-ci` already documents for
  # the Debug branch gate — a Release-only link failure (e.g. a Kotlin/Native optimizer crash) now
  # surfaces only on the post-merge main run, red but non-gating, with delivery skipped because
  # ios-deliver needs both gates.

permissions:
  contents: read

# Namespaced group (NOT the bare github.ref used by build.yml) so the Linux build and the iOS
# workflow do not share a concurrency group and cancel each other. A newer push to a ref cancels
# its own in-progress iOS run — both jobs, since the group is workflow-wide.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    # This display name is the status-check context required by .github/rulesets/main.json.
    # Changing it without updating the ruleset would freeze merges (the required check would
    # never be posted).
    name: ios-build
    runs-on: macos-26
    steps:
      # fetch-tags so the marketing-version computation below can see the release tags (vX.Y).
      - uses: actions/checkout@v7.0.0
        with:
          fetch-tags: true
      # Pick the build configuration and APNs environment — two shapes, keyed on the ref alone
      # (capability ios-ci pins the per-ref configuration):
      #   * push to main — RELEASE, APNs PRODUCTION: main's archive is the delivery source, and a
      #     TestFlight/App Store distribution build must be production (capability
      #     ios-testflight-delivery).
      #   * push to any OTHER ref — the DEBUG gate archive: identical compile surface (all iosArm64
      #     klibs, Swift, entitlements, signing), skipping only the LLVM optimization pass that
      #     dominates the Release link (measured 5-9.5 min of a 9-15 min job) on an archive that is
      #     discarded (no artifact off main). Version/APNs/DSN are immaterial to it; the
      #     BUILD_CONFIG-keyed conditionals below give it the dev defaults automatically. Trade-off
      #     (accepted, capability ios-ci): a Release-only build failure surfaces on the post-merge
      #     main run — red but non-gating, and delivery is skipped because ios-deliver needs both
      #     gates. With the dispatch trigger gone there is no pre-merge way to force the Release path.
      #
      # The upload host is NEVER overridden here: every ref bakes the Config.xcconfig default, the
      # single source of the host literal (capability ios-ci, "Compile-time edge host default"). A dev
      # build aimed at another backend is built on the ssh-mac loop instead.
      - name: Select build configuration and APNs environment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "BUILD_CONFIG=Release" >> "$GITHUB_ENV"
            echo "APS_ENV_OUT=production" >> "$GITHUB_ENV"
            echo "APNS_ENV_OUT=production" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONFIG=Debug" >> "$GITHUB_ENV"
            echo "APS_ENV_OUT=" >> "$GITHUB_ENV"
            echo "APNS_ENV_OUT=" >> "$GITHUB_ENV"
          fi

      # Compute the marketing version this build carries (capability ios-testflight-delivery):
      #   MARKETING_VERSION = max(floor, latest vX.Y tag with its minor incremented by 1)
      # The floor is Config.xcconfig's MARKETING_VERSION (seed 0.1); the tag-derived value wins after the
      # first release. The minor bump is INTEGER (v0.9 → 0.10, never a decimal carry to 1.0 — a major jump
      # is only reachable by bumping the committed floor), and max() compares (major, minor) TUPLES so a
      # floor of 1.0 correctly beats a derived 0.10. A promoted build's App Store version is DERIVED from
      # this value later (ios-appstore-promote), so this is the single source of the store version.
      # Debug archives — the branch gate — leave it EMPTY (the archive bakes the
      # Config.xcconfig floor): neither ever reaches App Store Connect, so the version is immaterial.
      - name: Compute marketing version
        run: |
          if [ "$BUILD_CONFIG" != "Release" ]; then
            echo "MARKETING_VERSION_OUT=" >> "$GITHUB_ENV"
            echo "dev/Debug build — marketing version left to the Config.xcconfig floor"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_ENV"
          import re, subprocess

          def parse(v):
              m = re.fullmatch(r"(\d+)\.(\d+)", v.strip())
              return (int(m.group(1)), int(m.group(2))) if m else None

          # Floor from Config.xcconfig (two-part X.Y).
          floor = None
          with open("iosApp/Configuration/Config.xcconfig") as f:
              for line in f:
                  if line.startswith("MARKETING_VERSION"):
                      floor = parse(line.split("=", 1)[1])
                      break
          assert floor is not None, "MARKETING_VERSION floor not found or not two-part in Config.xcconfig"

          # Latest vX.Y release tag, minor incremented by one (integer bump: 0.9 -> 0.10, never 1.0).
          tags = subprocess.run(
              ["git", "tag", "-l", "v[0-9]*.[0-9]*"], capture_output=True, text=True
          ).stdout.split()
          versions = [p for p in (parse(t[1:]) for t in tags) if p is not None]
          derived = None
          if versions:
              major, minor = max(versions)
              derived = (major, minor + 1)

          major, minor = max([floor] + ([derived] if derived else []))
          print(f"MARKETING_VERSION_OUT={major}.{minor}")
          PY
          echo "computed marketing version: $(grep '^MARKETING_VERSION_OUT=' "$GITHUB_ENV" | tail -1)"

      # The signed archive doubles as the merge gate (it compiles the shipping iosArm64 framework) and
      # the delivery source. All the archive+sign scaffolding — Java/Gradle/Konan setup, the extension
      # compile, the ASC key, the ephemeral keychain, BOTH persistent certs, and the archive — lives in
      # the shared composite action. Build number = the monotonic run number. marketing-version is the
      # value computed above — max(floor, latest tag + minor 1) for a Release build, empty (Config.xcconfig
      # floor) for a Debug build (the branch gate). A promoted App Store build derives its store
      # version FROM this value.
      - name: Archive signed device app
        uses: ./.github/actions/ios-archive
        with:
          build-config: ${{ env.BUILD_CONFIG }}
          marketing-version: ${{ env.MARKETING_VERSION_OUT }}
          aps-environment: ${{ env.APS_ENV_OUT }}
          apns-env: ${{ env.APNS_ENV_OUT }}
          # Release archives only (capability crash-reporting): a Debug gate archive bakes no DSN, so the
          # SDK never starts in a sideload build — absence is the off-switch, no separate flag.
          sentry-dsn: ${{ env.BUILD_CONFIG == 'Release' && secrets.SENTRY_DSN || '' }}
          current-project-version: ${{ github.run_number }}
          archive-path: ${{ runner.temp }}/SnapSync.xcarchive
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
          signing-cert-p12-base64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          signing-cert-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
          signing-dev-cert-p12-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          signing-dev-cert-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}

      # Hand the archive to ios-deliver (main ONLY). Export + TestFlight upload no longer happen here:
      # they moved to ios-deliver, which needs BOTH gates green, so a red ios-test now stops the
      # release. The device app is still compiled EXACTLY ONCE per push — ios-deliver re-signs and
      # packages this archive, it never recompiles.
      #
      # TAR first, then upload: upload-artifact zips its payload and does not preserve executable bits
      # or symlinks. Restoring a .app through that round-trip would corrupt the signed bundle and break
      # `xcodebuild -exportArchive`. tar preserves the modes, so the archive survives the hand-off
      # byte-for-byte.
      - name: Pack the signed archive for delivery
        if: github.ref == 'refs/heads/main'
        run: tar -czf "$RUNNER_TEMP/SnapSync.xcarchive.tar.gz" -C "$RUNNER_TEMP" SnapSync.xcarchive

      - name: Upload the signed archive for delivery
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-archive
          path: ${{ runner.temp }}/SnapSync.xcarchive.tar.gz
          # The archive is a build intermediate handed to the very next job in the same run — it is not
          # a release artifact and nobody fetches it later. One day is ample and keeps the signed app
          # (this is a public repo) from lingering.
          retention-days: 1
          if-no-files-found: error

  # TestFlight delivery — main ONLY, and gated on BOTH merge checks (capability
  # ios-testflight-delivery). `needs: [ios-build, ios-test]` is the whole point of this job: it is what
  # makes a RED TEST SUITE STOP THE RELEASE. If either gate fails, this job never runs and nothing
  # reaches TestFlight.
  #
  # This job posts NO branch-protection status check (see the ruleset note in the header): it only ever
  # runs on main, so requiring it would freeze merges. That means it is free to fail RED and block
  # nothing — which is why the old `continue-on-error` on export/upload is gone. A delivery flake is now
  # a visibly red run instead of a green one hiding a failed step.
  #
  # No Java/Gradle/Konan setup here: this job compiles nothing. It re-signs and packages the archive
  # ios-build already produced.
  ios-deliver:
    name: ios-deliver
    needs: [ios-build, ios-test]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      # Needed for iosApp/ExportOptions.plist (the export method + signing style).
      - uses: actions/checkout@v7.0.0

      - name: Prepare App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Generate ephemeral keychain password
        run: |
          PW="$(openssl rand -base64 24)"
          echo "::add-mask::$PW"
          echo "KEYCHAIN_PW=$PW" >> "$GITHUB_ENV"

      # Import BOTH certs here too, for the same cert-cap reason as ios-build: the export below runs
      # `-allowProvisioningUpdates`, and an empty keychain is what makes automatic signing mint a new
      # cert. Distribution signs the App Store IPA; Development is imported so nothing can provision
      # (and therefore mint) a development identity on this runner either.
      - name: Import Distribution signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
          keychain: snapsync-signing
          keychain-password: ${{ env.KEYCHAIN_PW }}
      - name: Import Development signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}
          keychain: snapsync-signing
          create-keychain: false
          keychain-password: ${{ env.KEYCHAIN_PW }}

      - name: Download the signed archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: ios-archive
          path: ${{ runner.temp }}

      # Untar with the same modes ios-build packed (see the tar note there).
      - name: Unpack the signed archive
        run: tar -xzf "$RUNNER_TEMP/SnapSync.xcarchive.tar.gz" -C "$RUNNER_TEMP"

      # Crash-report symbolication (capability crash-reporting): the Bugsink instance ingests no
      # dSYMs, so each delivered build's symbols stay fetchable BY BUILD NUMBER for offline `atos`
      # symbolication of an address-only crash report. 90 days is the platform's artifact-retention
      # maximum — a build expected to live longer in the App Store needs its dSYMs parked elsewhere
      # before expiry (risk recorded in the change's design).
      - name: Publish dSYMs for crash symbolication
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsyms-${{ github.run_number }}
          path: ${{ runner.temp }}/SnapSync.xcarchive/dSYMs
          retention-days: 90
          if-no-files-found: error

      # Re-signs and packages the ALREADY-COMPILED archive into an App Store IPA. The build number
      # (CURRENT_PROJECT_VERSION = github.run_number) was baked at archive time and is carried in the
      # archive's Info.plist — this job is in the SAME run, so the delivered build number still equals
      # this run's number.
      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # The TestFlight "What to Test" note: `<PR title> (#<num>, <short sha>)` — what identifies a
      # build in the internal group (spec requirement "Delivered builds identify their source
      # change"). The repo is rebase-merge-only, so the head-commit subject can be a trailing
      # docs/test commit of the PR; the commits→pulls association names the PR whose title is the
      # honest summary of the landing. The subject is only the no-PR fallback (branch protection
      # forbids direct pushes, so it should never fire) — and the `|| echo '[]'` folds an API flake
      # into that same fallback: a degraded note must never fail the delivery, and the SHA it always
      # carries is the authoritative half anyway. The note reaches the publish step ONLY via
      # $GITHUB_ENV → "$WHATS_NEW": a PR title inside `${{ }}` in a run: block would be script
      # injection by construction (titles are arbitrary text).
      - name: Compose the release note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PULLS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" 2>/dev/null || echo '[]')
          SHORT_SHA=${GITHUB_SHA:0:7}
          if [ "$(jq 'length' <<<"$PULLS")" -gt 0 ]; then
            NOTE="$(jq -r '.[0].title' <<<"$PULLS") (#$(jq -r '.[0].number' <<<"$PULLS"), $SHORT_SHA)"
          else
            NOTE="$(git log -1 --format='%s') ($SHORT_SHA)"
          fi
          echo "note: $NOTE"
          echo "WHATS_NEW=$NOTE" >> "$GITHUB_ENV"

      # Upload + note are ONE atomic publish (spec requirement "The upload and the note are one
      # atomic publish"): codemagic's `publish` uploads the IPA, waits for the build to become
      # discoverable in App Store Connect (its own --max-find-build-wait, default 10 min), and
      # attaches the beta test info — no bespoke find-build retry lives in the repo. Deliberately NO
      # --testflight / submit flag: upload and build metadata only — no beta-review submission, no
      # group assignment (distribution stays App-Store-only, capability ios-appstore-release). This
      # replaced apple-actions/upload-testflight-build@v5, which has no what's-new input (decision D1
      # in the change's design record). No continue-on-error: a discovery timeout or note failure is
      # a visibly red, non-gating run. codemagic reads the key from ITS OWN env var names — same
      # three ASC_* secret values, bridged here exactly as the portal-chores runbook does.
      - name: Upload to TestFlight with the release note
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          # macos-26's default python3 is Homebrew's, which is PEP-668 externally-managed — a bare
          # `pip install` refuses outright. `pipx run` (pipx ships on the image; uv does NOT) runs
          # the tool from its own ephemeral venv — the CI twin of the runbooks' `uvx --from`.
          pipx run --spec codemagic-cli-tools app-store-connect publish \
            --path "$RUNNER_TEMP/export/SnapSync.ipa" \
            --whats-new "$WHATS_NEW"

  ios-test:
    # Display name = the status-check context required by .github/rulesets/main.json. Runs in
    # parallel with ios-build (no `needs:`). Same macos-26 + caching scaffolding as ios-build;
    # the two jobs compile different Kotlin/Native targets, so the heavy per-target work is not
    # duplicated — only checkout/setup + the commonMain klib compile is re-paid.
    name: ios-test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Run Kotlin/Native unit tests on the iOS simulator
        run: |
          # Boots an iOS simulator (iOS 26 runtime on macos-26) and runs the iosSimulatorArm64 tests
          # of EVERY module that declares the target — ~600 tests across ~65 classes, i.e. the whole
          # shared commonTest surface (every :domain:* and :capability:*, plus :test:world and
          # :test:integration), which is the same logic build.yml runs as JVM bytecode, now compiled to
          # Native. This is the ONLY place that difference is checked, and it is not theoretical: it
          # catches Native-only breakage the JVM accepts (e.g. Kotlin/Native rejects a comma in a
          # backticked test name).
          #
          # Native-only source sets — no JVM equivalent, so this is their only run: :adapter:generic:app's
          # NativeLedgerStoreTest (the SQLDelight native driver behind the shared LedgerStoreContract,
          # hosted in :test:world since migration step 10),
          # :domain:keychain's IosKeychainTest, and :app:ios:extension's PhotoKitSmokeTest
          # (general PhotoKit is callable on the sim; the cloud-id + upload-job subsystems are
          # device-only and not exercised here).
          #
          # NOT covered here: :domain:ui's Compose tests and the SQLDelight JVM-driver tests (jvmTest
          # only), and :test:architecture (JVM-only Konsist, by design).
          #
          # Kotlin auto-selects a standalone simulator; if a run fails with "no matching device", pin
          # testRuns["test"].deviceId.
          ./gradlew iosSimulatorArm64Test
