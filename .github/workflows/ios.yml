# iOS CI. Two parallel jobs on the macos-26 hosted runner (GM Xcode, no beta SDK), each reporting
# a status check that gates merges (branch-protection):
#   * ios-build — on EVERY push (any ref) produces a SIGNED archive of the iOS DEVICE (iphoneos,
#     arm64) app, linking the iosArm64 framework (the shipping target). The archive step compiles
#     iosArm64, so it IS the merge gate. From that one archive it delivers across TWO channels:
#       - sideload (EVERY ref): export a DEVELOPMENT-signed IPA and upload it as a 1-day-retention
#         GitHub Actions artifact (snapsync-dev-ipa-<run_number>). This is what makes any branch
#         installable on a registered device before merge — sideload over usbmuxd, no TestFlight.
#       - TestFlight (main ONLY): export the App Store IPA and upload it, as a release trail. Gated
#         to refs/heads/main so per-branch pushes stop consuming TestFlight uploads.
#     Builds are identified by build number = github.run_number; cross-reference it to the
#     branch/commit via the Actions run. All export + upload steps are continue-on-error: a flaky
#     delivery leaves the gate green and merges unblocked (the failure is still visible in the run).
#   * ios-test  — runs the shared commonTest compiled to Kotlin/Native on a booted simulator
#     (./gradlew iosSimulatorArm64Test), validating the iosSimulatorArm64 target.
# Together the two jobs exercise BOTH Kotlin/Native targets (device via build, simulator via
# test). The Linux-buildable work (JVM/desktop + the JVM run of all unit tests) stays in build.yml;
# this workflow does only the irreducible Apple delta.
#
# Signing: TWO persistent certs — an Apple Distribution (SIGNING_CERT_* secrets) and an Apple
# Development (SIGNING_DEV_CERT_* secrets) — are imported into one shared keychain each run, and
# xcodebuild -allowProvisioningUpdates uses the App Store Connect API key (Admin role) to manage the
# provisioning PROFILES in the cloud (profiles have no cap). Importing BOTH fixed certs is
# deliberate: an empty runner keychain makes automatic signing mint a NEW cert every run, exhausting
# Apple's per-account cert cap under every-push delivery. The Development cert matters because
# `xcodebuild archive` provisions a development identity for the team in addition to the
# distribution one — persisting only Distribution (the prior state) still churned Development certs.
# No fastlane, no match.
name: ios

on:
  push:
  # Manual dispatch to bake a compile-time upload host into the dev IPA (PhotoKit forces the host
  # to be compile-time). A plain push supplies no input → the archive bakes the inert dummy host,
  # so main/TestFlight is never affected; only a deliberate dispatch with `upload_host` set bakes a
  # real host (e.g. a local MinIO on the LAN) into that run's development IPA.
  workflow_dispatch:
    inputs:
      upload_host:
        description: "Compile-time S3 upload host for the dev IPA, e.g. http://192.168.1.2:9000 (empty = inert dummy host)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Namespaced group (NOT the bare github.ref used by build.yml) so the Linux build and the iOS
# workflow do not share a concurrency group and cancel each other. A newer push to a ref cancels
# its own in-progress iOS run — both jobs, since the group is workflow-wide.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    # This display name is the status-check context required by .github/rulesets/main.json.
    # Changing it without updating the ruleset would freeze merges (the required check would
    # never be posted).
    name: ios-build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Cache the Kotlin/Native toolchain + compiled klibs (cold ~12 min -> warm a few min).
      # Keyed on libs.versions.toml so a Kotlin/Native version bump invalidates the cache.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # Compile the background-upload extension's Kotlin core (the shipping iosArm64 framework). It
      # is not yet reachable from the iosApp Xcode project (no extension target), so the archive
      # below would not touch it — compile it here, in the device-BUILD job, so it stays a merge
      # gate. Removed once the Xcode extension target links SnapSyncUploadKit into the archive.
      - name: Compile the background-upload extension framework
        run: ./gradlew :app:ios:photokit-extension:compileKotlinIosArm64

      # The signed archive both compiles iosArm64 (so it IS the build gate) AND is the delivery
      # source. Write the App Store Connect API key (.p8) for xcodebuild's auth flags.
      - name: Prepare App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # Mint a fresh random password for the throwaway signing keychain and share it across both
      # import steps via $GITHUB_ENV (masked so it never prints). The keychain dies with the
      # ephemeral runner, so the password protects nothing — a per-run random value just avoids a
      # hardcoded credential in this file.
      - name: Generate ephemeral keychain password
        run: |
          PW="$(openssl rand -base64 24)"
          echo "::add-mask::$PW"
          echo "KEYCHAIN_PW=$PW" >> "$GITHUB_ENV"

      # Import BOTH persistent signing certs into ONE keychain so automatic signing reuses them
      # instead of minting fresh certs every run (which would exhaust Apple's per-account cert cap
      # under every-push delivery). Distribution alone is not enough: `xcodebuild archive
      # -allowProvisioningUpdates` also provisions a DEVELOPMENT identity for the team, and an empty
      # runner keychain made it mint a new Development cert each run — the actual cap-exhaustion bug.
      # A shared explicit keychain (not the default auto-password `signing_temp`) lets the second
      # import target the same keychain with the password minted above. Both pinned to the exact
      # release, not the float.
      - name: Import Distribution signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
          keychain: snapsync-signing
          keychain-password: ${{ env.KEYCHAIN_PW }}
      - name: Import Development signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}
          keychain: snapsync-signing
          create-keychain: false
          keychain-password: ${{ env.KEYCHAIN_PW }}

      # Build number = the monotonic run number. -allowProvisioningUpdates still cloud-manages the
      # provisioning PROFILE, but now reuses the imported cert above rather than creating a new one.
      # This is the required merge gate: it compiles the shipping iosArm64 framework.
      - name: Archive signed device app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -derivedDataPath build/ios \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            BACKGROUND_UPLOAD_URL_BASE=${{ inputs.upload_host || 'https://dummy.invalid' }} \
            archive

      # Sideload channel (EVERY ref): export a DEVELOPMENT-signed IPA from the same archive and
      # publish it as a short-retention artifact. This is what makes any branch installable on a
      # registered device before merge (no TestFlight). -allowProvisioningUpdates reuses the
      # imported Development cert and cloud-manages a development profile that includes registered
      # devices. Non-gating: the gate is the archive compile above, so a dev-export/upload flake
      # must not block merges.
      - name: Export development IPA
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -exportPath "$RUNNER_TEMP/export-dev" \
            -exportOptionsPlist iosApp/ExportOptionsDevelopment.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload dev IPA artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: snapsync-dev-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export-dev/SnapSync.ipa
          retention-days: 1
          if-no-files-found: warn

      # TestFlight channel (main ONLY): export the App Store IPA and upload it. Gated to
      # refs/heads/main so per-branch pushes no longer consume TestFlight uploads (the limit we are
      # avoiding) — per-branch installs are served by the dev-IPA artifact above. Still decoupled
      # from the gate: continue-on-error keeps the job green if Apple's delivery flakes.
      - name: Export signed IPA
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SnapSync.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/SnapSync.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}

  ios-test:
    # Display name = the status-check context required by .github/rulesets/main.json. Runs in
    # parallel with ios-build (no `needs:`). Same macos-26 + caching scaffolding as ios-build;
    # the two jobs compile different Kotlin/Native targets, so the heavy per-target work is not
    # duplicated — only checkout/setup + the commonMain klib compile is re-paid.
    name: ios-test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Run Kotlin/Native unit tests on the iOS simulator
        run: |
          # Boots an iOS simulator (iOS 26 runtime on macos-26) and runs every module's
          # iosSimulatorArm64 tests: the shared commonTest of :domain:status, :domain:engine,
          # :domain:presentation (the same logic build.yml runs as JVM bytecode, now on Native),
          # plus :app:ios:photokit-extension's UploadCycle/UploadKeys logic tests and its
          # PhotoKitSmokeTest (general PhotoKit is callable on the sim; the cloud-id + upload-job
          # subsystems are device-only and not exercised here). Kotlin auto-selects a standalone
          # simulator; if a run fails with "no matching device", pin testRuns["test"].deviceId.
          ./gradlew iosSimulatorArm64Test
