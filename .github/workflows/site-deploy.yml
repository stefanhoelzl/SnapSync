name: site-deploy

# Builds the browser-facing Astro site (site/) and mirror-deploys it to the bunny storage `site/` prefix
# (capability web-site). The api Edge Script proxies that prefix (serveSiteObject), so this ships the
# marketing landing and the /join page as static assets, OFF the api bundle.
#
# DEPLOY ONLY — the gate is site.yml. This workflow is path-filtered and main-only, so its context is
# posted on no PR and must never be required (see site.yml ①). It does not repeat `npm run check`: no
# commit reaches `main` without site.yml's required `site-build` having passed. It still builds, because
# the deploy mirrors the build output.
#
# TWO RUNTIMES, deliberately: the site BUILD runs under NODE (astro:assets/rolldown fail under Deno's
# npm-compat), while the deploy + self-containment scripts run under DENO — they reuse the api's own
# storage client (api/src/{storage,config}.ts), matching the api's tooling. The api/ backend stays
# Deno-only.
#
# It holds ONLY the storage-zone password (BUNNY_STORAGE_ACCESS_KEY) — the same secret the nightly sweep
# uses — and NEVER the bunny account key (which owns DNS + every user's photos). Routing is not configured
# here: it lives in the api bundle as source-owned code (no pull-zone edge rules). Capability
# backend-deployment.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # The landing page's screenshots are processed from these raws at build time (astro:assets), so a
      # capture refresh must rebuild + redeploy the site. This path IS the build's input.
      - "screenshots/**"
      # The Deno deploy/self-containment scripts reuse api/src/{storage,config}.ts — a change there can
      # affect them.
      - "api/src/storage.ts"
      - "api/src/config.ts"
      - ".github/workflows/site-deploy.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The site reads the resolved deployment for its canonical URLs, and the mirror deploy builds its
      # storage Config from the same rendering — so the zone it writes to can never differ from the one
      # the api proxy reads. Renderings are generated, never committed, so this step is required.
      - name: Resolve the deployment
        run: python3 scripts/resolve-deployment.py prod

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      # Mirror-deploy. Deno: uploads the new build, then deletes stale objects — never clears first.
      - name: Mirror-deploy to bunny storage
        working-directory: site
        env:
          BUNNY_STORAGE_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_ACCESS_KEY }}
        run: npm run deploy
