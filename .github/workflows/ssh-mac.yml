# ssh-mac — a headless, agent-driveable macOS build box (DEV INFRASTRUCTURE, not a merge gate).
#
# Why: iOS work is macOS-only and there is no Mac in the local (Linux sandbox) environment, so the
# normal loop is push -> wait in the macos-26 queue -> cold/warm CI build -> `gh run download` ->
# sideload. This workflow collapses that: it opens ONE long-lived macos-26 job with an SSH server the
# sandbox connects to, then the agent iterates rsync -> build -> `iosSimulatorArm64Test` -> dev-sign ->
# scp the IPA back -> `pymobiledevice3 apps install` over usbmuxd, many times against one warm runner.
# The driving procedure lives in CLAUDE.md ("Headless macOS build loop (ssh-mac)"); this file is the
# workflow half. Public repo => standard macos-26 minutes are FREE; the only cost is the 6h job cap and
# a concurrency slot, which is why the interactive step self-terminates (see Lifecycle below).
#
# NON-GATING & dispatch-only: `on: workflow_dispatch` (never on push) and this posts NO required status
# check, so it can never block merges. It is deliberately absent from .github/rulesets/main.json.
#
# Connection — AUTH is separate from CONNECTIVITY:
#   * Auth: the caller passes its PUBLIC key as the `ssh_pubkey` input; we authorize exactly that key on
#     our own sshd. A public key is public by design, so it is safe in a dispatch input and in this
#     world-readable public-repo log; the PRIVATE key never leaves the sandbox. No auth secret is ever
#     written to a log. This is strictly tighter than action-tmate, whose public relay terminates SSH.
#   * Connectivity: the runner has no public inbound IP, so a cloudflared quick tunnel fronts the sshd
#     (`cloudflared tunnel --url ssh://localhost:PORT`). Cloudflare relays ENCRYPTED TCP only.
#   * Hostname handoff: GitHub run/job LOGS are unreadable until the job completes, but the session step
#     blocks the whole time — so the hostname CANNOT be scraped from logs headlessly. Instead the runner
#     writes it to a file and uploads it as the `ssh-mac-host` ARTIFACT (upload-artifact v4+ artifacts
#     are available the instant their step finishes, mid-run). The sandbox polls `gh run download -n
#     ssh-mac-host`, reads the host, and connects with
#         ssh -i <privkey> -o ProxyCommand="cloudflared access ssh --hostname %h" runner@<host>
#     (sshd + cloudflared are started with nohup so they survive into the blocking step AFTER the upload
#     step has completed.)
#
# Signing — NO ASC key on the box, EVER: this job holds only the Apple DEVELOPMENT cert (to sign) and the
# pre-generated DEVELOPMENT provisioning profiles baked in as the DEV_PROVISIONING_PROFILE_BASE64 secret
# (a tar of BOTH the app `app.snapsync` and the extension `app.snapsync.BackgroundUpload` profiles — the
# archive signs both targets, so both must be present; a provisioning profile carries NO private keys,
# just the app id, team, device UDIDs, and public certs, so it is safe as a secret). We install them and
# import the dev cert; in-session `xcodebuild -exportArchive` (automatic signing, no
# -allowProvisioningUpdates) reuses them. The Admin ASC key that ios.yml uses is never materialized here.
# REFRESH the secret when the profiles expire (~1yr; baked ones valid to 2027-07-01) or when you register
# a new device: dev-export any build (minting fresh profiles with -allowProvisioningUpdates), then tar
# BOTH the app's Payload/*.app/embedded.mobileprovision and the extension's
# PlugIns|Extensions/*.appex/embedded.mobileprovision, and `gh secret set DEV_PROVISIONING_PROFILE_BASE64`.
#
# Lifecycle: the interactive step BLOCKS on a stop sentinel (`/tmp/ssh-mac-stop`, `ssh ... touch` it to
# end) OR `stop_after` minutes, whichever first; `timeout-minutes` on the job is the hard backstop.
#
# VERIFY ON FIRST DISPATCH (macOS-runner-specific, not checkable from Linux): the sshd + cloudflared +
# in-session export were all proven on 2026-07-01; the remaining live check is that the BAKED profile
# (vs the freshly-minted managed one) drives an in-session `-exportArchive` with no ASC key.
name: ssh-mac

on:
  workflow_dispatch:
    inputs:
      ssh_pubkey:
        description: "SSH PUBLIC key authorized to connect (the sandbox holds the private half). Safe to paste; a pubkey is public."
        required: true
        type: string
      stop_after:
        description: "Auto-close the interactive session after this many minutes (backstop below the job timeout)."
        required: false
        default: "90"
        type: string

permissions:
  contents: read

# A fresh dispatch should NOT kill an already-open session, so no cancel-in-progress. Distinct group from
# ios.yml/build.yml so nothing here cancels the merge-gating workflows (or vice versa).
concurrency:
  group: ssh-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ssh:
    name: ssh-mac
    runs-on: macos-26
    # Hard backstop under the 6h per-job cap; the interactive step also self-closes at `stop_after` min.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5

      # Warm the same Kotlin/Native toolchain cache as ios.yml (identical key), so the first in-session
      # build is not cold.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # Import ONLY the Apple Development cert (dev signing needs no Distribution cert). Ephemeral keychain
      # with a random password; dies with the runner.
      - name: Generate ephemeral keychain password
        run: |
          PW="$(openssl rand -base64 24)"
          echo "::add-mask::$PW"
          echo "KEYCHAIN_PW=$PW" >> "$GITHUB_ENV"
      - name: Import Development signing certificate
        continue-on-error: true
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_DEV_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_DEV_CERT_PASSWORD }}
          keychain: snapsync-ssh-mac
          keychain-password: ${{ env.KEYCHAIN_PW }}

      # Install the baked development provisioning profiles (no ASC key, no compile). The secret is a tar
      # of BOTH the app and the extension profiles; the archive signs both targets (app.snapsync +
      # app.snapsync.BackgroundUpload), so both must be present. Write each under the classic AND the
      # Xcode-16+ profile directories, named by its UUID, so automatic signing finds them during an
      # in-session `-exportArchive`.
      - name: Install baked development provisioning profiles
        continue-on-error: true
        env:
          DEV_PROFILE_B64: ${{ secrets.DEV_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEV_PROFILE_B64" ]; then echo "::warning::DEV_PROVISIONING_PROFILE_BASE64 unset"; exit 0; fi
          WORK="$RUNNER_TEMP/profiles"; mkdir -p "$WORK"
          printf '%s' "$DEV_PROFILE_B64" | base64 -d | tar -C "$WORK" -xf -
          for TMP in "$WORK"/*.mobileprovision; do
            UUID="$(security cms -D -i "$TMP" 2>/dev/null | plutil -extract UUID raw - )"
            EXP="$(security cms -D -i "$TMP" 2>/dev/null | plutil -extract ExpirationDate raw - )"
            for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$DIR"; cp -f "$TMP" "$DIR/$UUID.mobileprovision"
            done
            echo "installed $UUID.mobileprovision (expires $EXP)"
          done
          rm -rf "$WORK"

      - name: Install cloudflared
        run: brew install cloudflared

      # Start the SSH server + cloudflared quick tunnel with nohup so they SURVIVE this step (the upload
      # step below must complete before the blocking wait step, and the tunnel must stay up throughout).
      # Capture the public hostname and write it to a file for the artifact.
      - name: Start SSH server + cloudflared tunnel
        env:
          SSH_PUBKEY: ${{ inputs.ssh_pubkey }}
        run: |
          set -euo pipefail
          PORT=2222
          SSHDIR="$RUNNER_TEMP/ssh"
          mkdir -p "$SSHDIR"
          printf '%s\n' "$SSH_PUBKEY" > "$SSHDIR/authorized_keys"
          chmod 600 "$SSHDIR/authorized_keys"
          ssh-keygen -q -t ed25519 -N '' -f "$SSHDIR/ssh_host_ed25519_key"
          cat > "$SSHDIR/sshd_config" <<EOF
          Port $PORT
          HostKey $SSHDIR/ssh_host_ed25519_key
          PidFile $SSHDIR/sshd.pid
          AuthorizedKeysFile $SSHDIR/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          UsePAM no
          StrictModes no
          LogLevel VERBOSE
          Subsystem sftp internal-sftp
          EOF

          nohup /usr/sbin/sshd -f "$SSHDIR/sshd_config" -D -e >"$SSHDIR/sshd.log" 2>&1 &
          disown
          echo "sshd started on port $PORT as user '$USER'."
          nohup cloudflared tunnel --no-autoupdate --url "ssh://localhost:$PORT" >"$SSHDIR/cf.log" 2>&1 &
          disown

          echo "Waiting for the cloudflared hostname..."
          HOST=""
          for i in $(seq 1 30); do
            HOST="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$SSHDIR/cf.log" | head -1 || true)"
            [ -n "$HOST" ] && break
            sleep 2
          done
          if [ -z "$HOST" ]; then echo "::error::cloudflared produced no hostname"; cat "$SSHDIR/cf.log"; exit 1; fi
          BARE="${HOST#https://}"
          printf '%s\n' "$BARE" > "$RUNNER_TEMP/ssh-mac-host.txt"
          echo "==================== ssh-mac ready ===================="
          echo "CONNECT: ssh -o ProxyCommand=\"cloudflared access ssh --hostname %h\" $USER@$BARE"
          echo "======================================================="
          {
            echo "## ssh-mac session"
            echo '```'
            echo "ssh -i <your_private_key> -o ProxyCommand=\"cloudflared access ssh --hostname %h\" $USER@$BARE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish the hostname as an artifact — available the instant this step completes (mid-run), so the
      # sandbox can read it while the session step below blocks.
      - name: Publish hostname artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ssh-mac-host
          path: ${{ runner.temp }}/ssh-mac-host.txt
          retention-days: 1
          if-no-files-found: warn

      # Block until the sentinel appears or stop_after elapses, then tear the tunnel/sshd down.
      - name: Wait for session
        env:
          STOP_AFTER: ${{ inputs.stop_after }}
        run: |
          set -euo pipefail
          END=$(( $(date +%s) + STOP_AFTER * 60 ))
          echo "Session open. Touch /tmp/ssh-mac-stop to end early (backstop: ${STOP_AFTER}m)."
          while [ ! -f /tmp/ssh-mac-stop ] && [ "$(date +%s)" -lt "$END" ]; do
            sleep 5
          done
          echo "Session ending (sentinel or stop_after reached)."
          pkill -f 'cloudflared tunnel' 2>/dev/null || true
          pkill sshd 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: rm -f /tmp/ssh-mac-stop || true
