name: build

on:
  push:
    # BRANCHES only. A `vX.Y` tag is a release RECEIPT created by ios-appstore-promote.yml (it triggers
    # nothing); excluding tags here keeps that tag from firing a redundant Linux build + spec-validate. Every branch push
    # still runs (no path filter), so the required `build` check is posted on every branch and PR.
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # `./gradlew build` launches the REAL backend: `:adapter:generic:app`'s jvmTest runs the backend port
      # contracts' live bindings against `api/src/dev/serve.ts --ephemeral` (`docs/architecture.md`;
      # `docs/testing.md`, "The canonical check and its Kotlin/Native half"). Offline and zone-safe —
      # a filesystem store, network granted to loopback only. Same pin as `api.yml`, so the contracts run
      # the backend under the Deno its own suite runs under. Without it they FAIL naming Deno; they never skip.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Compose Desktop UI tests render offscreen under -Djava.awt.headless=true
      # (set on :domain:ui's test task), so no X server is needed.
      - run: ./gradlew build

      # The build-property-gated trees, which `build` above compiles NONE of — that is the point of
      # compile-time containment, and it is also a blind spot: source no build compiles is source that
      # rots silently. It already did. `:test:rig`'s hook referenced a completion-handler deadline constant
      # that did not exist (the deadlines themselves are gone since: the OS's expiry is now the only
      # "time is up"), from the commit that introduced it until this one, and nothing noticed because
      # nothing ever compiled it.
      #
      # IT THEN DID IT AGAIN, BESIDE THIS STEP: the forge's gated test source set stopped compiling when the
      # presentation state changed shape (93e8eb4f, 2026-08-28) and stayed broken for weeks with this step green,
      # because a metadata compile compiles the MAIN half of a gated tree only. The forge is gone (the marketing
      # shots are scenarios `ShotsTest` runs inside `build` above), so no gated tree carries tests any more; a new
      # one that does must be RUN here, not only compiled.
      #
      # `compileIosMainKotlinMetadata` stays metadata-only, deliberately: it is the Linux-runnable proxy,
      # and its point is to catch a reference that stopped resolving, not to produce an artifact. The
      # property may not reach a shipped build, and does not — a release archive is built without it.
      - run: ./gradlew compileIosMainKotlinMetadata -Psnapsync.rig=true

  spec-validate:
    # This display name is the status-check context required by `main`'s branch ruleset,
    # which `/ship` owns (there is no committed copy).
    # Changing it without updating the ruleset would freeze merges (the required check would never
    # be posted). Safe to require: build.yml carries no path filter, so it posts on every ref.
    name: spec-validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Keep openspec/specs the contract of record: every spec must parse and
      # carry a normative (SHALL/MUST) requirement + a scenario. Pinned so an
      # upstream rule change can't turn CI red without a deliberate bump.
      - run: npx --yes @fission-ai/openspec@1.13.2 validate --specs --strict

  resolver-test:
    # This display name is the status-check context required by `main`'s branch ruleset,
    # which `/ship` owns (there is no committed copy).
    # Changing it without updating the ruleset would freeze merges (the required check would never
    # be posted). Safe to require: build.yml carries no path filter, so it posts on every ref.
    name: resolver-test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      # The deployment resolver's own suite (`docs/deployment.md`), and the ONLY place
      # it runs — the api deploy workflow shed its copy when the api checks became a gate.
      # A TEST THAT CAN ONLY FAIL AFTER MERGE IS NOT A GATE. This suite used to run only in
      # the api deploy workflow, whose deploy triggers on PUSH TO MAIN, so it could only fail after a merge:
      # adding two required inventory keys broke 20 of these 30 tests, the PR merged clean, and the
      # deploy failed on main with production still serving the previous bundle. This job was added in
      # response — but as a NON-REQUIRED check, which `/ship`'s auto-merge ignores, so the conclusion
      # was written down and not applied. It is a required context now, which is what makes it a gate.
      - run: python3 scripts/resolve_deployment_test.py
