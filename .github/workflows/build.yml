name: build

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Compose Desktop UI tests render offscreen under -Djava.awt.headless=true
      # (set on :domain:ui's test task), so no X server is needed.
      - run: ./gradlew build
