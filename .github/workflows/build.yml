name: build

on:
  push:
    # BRANCHES only. A `vX.Y` tag is a release RECEIPT created by ios-appstore-promote.yml (it triggers
    # nothing); excluding tags here keeps that tag from firing a redundant Linux build + spec-validate. Every branch push
    # still runs (no path filter), so the required `build` check is posted on every branch and PR.
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Compose Desktop UI tests render offscreen under -Djava.awt.headless=true
      # (set on :domain:ui's test task), so no X server is needed.
      - run: ./gradlew build

      # The build-property-gated trees, which `build` above compiles NONE of — that is the point of
      # compile-time containment, and it is also a blind spot: source no build compiles is source that
      # rots silently. It already did. `:test:rig`'s hook referenced a `ReceiptDeadlines` constant that
      # does not exist, from the commit that introduced it until this one, and nothing noticed because
      # nothing ever compiled it.
      #
      # Metadata only, deliberately: this is the Linux-runnable proxy, and the point is to catch a
      # reference that stopped resolving, not to produce an artifact. Neither property may reach a
      # shipped build, and neither does — a release archive is built without them.
      - run: ./gradlew compileIosMainKotlinMetadata -Psnapsync.rig=true -Psnapsync.forge=true

  spec-validate:
    # This display name is the status-check context required by .github/rulesets/main.json.
    # Changing it without updating the ruleset would freeze merges (the required check would never
    # be posted). Safe to require: build.yml carries no path filter, so it posts on every ref.
    name: spec-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Keep openspec/specs the contract of record: every spec must parse and
      # carry a normative (SHALL/MUST) requirement + a scenario. Pinned so an
      # upstream rule change can't turn CI red without a deliberate bump.
      - run: npx --yes @fission-ai/openspec@1.5.0 validate --specs --strict

  resolver-test:
    # This display name is the status-check context required by .github/rulesets/main.json.
    # Changing it without updating the ruleset would freeze merges (the required check would never
    # be posted). Safe to require: build.yml carries no path filter, so it posts on every ref.
    name: resolver-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The deployment resolver's own suite (capability `deployment-configuration`), and the ONLY place
      # it runs — `api-deploy.yml` shed its copy when the api checks became a gate.
      # A TEST THAT CAN ONLY FAIL AFTER MERGE IS NOT A GATE. This suite used to run only in
      # `api-deploy.yml`, whose deploy triggers on PUSH TO MAIN, so it could only fail after a merge:
      # adding two required inventory keys broke 20 of these 30 tests, the PR merged clean, and the
      # deploy failed on main with production still serving the previous bundle. This job was added in
      # response — but as a NON-REQUIRED check, which `/ship`'s auto-merge ignores, so the conclusion
      # was written down and not applied. It is a required context now, which is what makes it a gate.
      - run: python3 scripts/resolve_deployment_test.py
