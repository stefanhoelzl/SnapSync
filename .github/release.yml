# Changelog categorisation (capability `changelog-labels`) — the SINGLE place a changelog label maps
# to a heading, and the single place `internal` is excluded. `/ship` puts exactly one of these three
# labels on every PR (capability `ship-command`) and `check-label.yaml` fails a PR carrying none, so
# the set below is total.
#
# Consumed by GitHub's release-notes generator, which `.github/scripts/release_notes.py` calls to
# build the App Store version's "What's New" text (capability `ios-appstore-release`). The headings
# are therefore read by App Store CUSTOMERS — hence "New"/"Fixed" rather than "Features"/"Bug Fixes".
#
# ⚠️ NO CATCH-ALL CATEGORY (`labels: ["*"]`), deliberately. A catch-all would publish an unlabelled
# PR's raw engineering title into the customer-facing listing; without one it appears under no
# heading, and the PR gate — not a residual bucket — is the answer to a missing label.
changelog:
  exclude:
    labels:
      - internal
  categories:
    - title: New
      labels:
        - enhancement
    - title: Fixed
      labels:
        - bug
