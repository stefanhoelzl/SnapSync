[versions]
kotlin = "2.4.20"
compose = "1.12.1"
# Compose Multiplatform versions Material 3 separately from the rest of the framework; this is the
# newest stable release (checked against compose 1.12.1; its line past 1.9 is alpha-only).
compose-material3 = "1.9.0"
# Versioned separately from compose too: the last release of the icons artifact (still 1.7.3 under
# compose 1.12.1).
compose-material-icons = "1.7.3"
foojay = "1.0.0"
jdk = "25"
orbit = "12.0.1"
coroutines = "1.11.0"
sqldelight = "2.4.0"
kermit = "2.2.0"
detekt = "1.23.8"
dependencyAnalysis = "3.19.2"
kover = "0.9.10"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.11.0"
qrose = "1.3.0"
# Never 3.2.0: it names a field `use streaming syntax`, which D8 refuses below DEX 040 (minSdk 30)
# (KTOR-8583, fixed in 3.2.1). The Android minSdk is 30 now, but a build must not hinge on it.
ktor = "3.6.0"
# sentry-kmp 0.27.0 pins sentry-cocoa 8.58.2 — the SPM package in iosApp.xcodeproj and the
# test-link provisioning in :adapter:ios:ext-safe must carry the SAME cocoa version.
sentry-kmp = "0.27.0"
sentry-cocoa = "8.58.2"
# Android (`docs/architecture.md`, "Zones inside the core": the allowed targets). One AGP for the KMP library plugin
# every multiplatform module's `android` target comes from and the application plugin `:app:android` applies.
agp = "9.4.1"
# minSdk 30 (Android 11), one level for the app AND its device tests: scoped storage is enforced (29 still let an app
# opt out) and `MediaStore.create*Request` batches consent, so the gallery adapters have one code path; and D8 writes
# the backtick test names' spaces only from DEX 040 (API 30), so the tests run at the level the app ships at. Android
# 10 was 4.6% of German Android traffic (StatCounter, Aug 2026; ≥30 reaches 85.6%), mostly 2018–19 phones past their
# security updates. targetSdk tracks Play's current requirement; compileSdk follows it unless a dependency needs more
# (37: compose 1.12's androidx artifacts require compiling against it — only the API surface, not the behaviour).
android-minSdk = "30"
android-compileSdk = "37"
android-targetSdk = "36"
# The bytecode the Android compilations emit: D8/R8 dexes it (the toolchain stays `jdk`; only the target is lowered).
android-jvmTarget = "17"
androidx-activity = "1.13.0"
androidx-work = "2.12.0"
firebase-messaging = "25.1.3"
installreferrer = "2.2"
androidx-lifecycle = "2.11.0"
androidx-test-runner = "1.7.0"
# The open helper SQLDelight's Android driver runs on — the version its own POM resolves.
androidx-sqlite = "2.6.2"
# The Jetpack Compose release `compose` resolves to on Android — for the one androidx artifact named directly.
androidx-compose = "1.12.1"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
orbit-core = { module = "org.orbit-mvi:orbit-core", version.ref = "orbit" }
orbit-test = { module = "org.orbit-mvi:orbit-test", version.ref = "orbit" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# `Dispatchers.Main` on Android: the main looper, which the Android root composes on.
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-driver-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-dialect-sqlite = { module = "app.cash.sqldelight:sqlite-3-35-dialect", version.ref = "sqldelight" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
# The Android HTTP engine the backend port runs over: the platform's TLS and certificate store, HTTP/2, pooling.
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
# Server side — `:test:rig` ONLY (the module exists to withhold these from everything else).
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
# The Android wakes, background-time holds and uploads (the WorkManager adapters in :adapter:android).
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }
installreferrer = { module = "com.android.installreferrer:installreferrer", version.ref = "installreferrer" }
# The instrumentation runner the Android device tests (`src/androidDeviceTest` on the emulator) run under.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
# The `Databases` adapter builds its own open helper, to refuse the platform's delete-on-corruption.
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidx-sqlite" }
# The AGP API the convention plugins configure the `android` target through — compileOnly in `build-logic`.
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
sentry-kmp = { module = "io.sentry:sentry-kotlin-multiplatform", version.ref = "sentry-kmp" }

[plugins]
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
