[versions]
kotlin = "2.4.0"
compose = "1.11.1"
# Compose Multiplatform versions Material 3 separately from the rest of the framework; this is the
# release compose 1.11.1 paired with when its (now deprecated) `compose.material3` accessor was used.
compose-material3 = "1.9.0"
# Versioned separately from compose too: the release the deprecated `compose.materialIconsExtended`
# accessor resolved to under compose 1.11.1.
compose-material-icons = "1.7.3"
foojay = "1.0.0"
jdk = "25"
orbit = "10.0.0"
coroutines = "1.10.2"
sqldelight = "2.3.2"
kermit = "2.0.6"
detekt = "1.23.8"
dependencyAnalysis = "3.17.0"
kover = "0.9.9"
kotlinx-datetime = "0.7.1"
kotlinx-serialization = "1.9.0"
qrose = "1.1.2"
# 3.2.4, not 3.2.0: 3.2.0 names a field `use streaming syntax`, which D8 refuses below DEX 040 (minSdk 30)
# (KTOR-8583, fixed in 3.2.1). The Android minSdk is 30 now, but a build must not hinge on it.
ktor = "3.2.4"
# sentry-kmp 0.27.0 pins sentry-cocoa 8.58.2 — the SPM package in iosApp.xcodeproj and the
# test-link provisioning in :adapter:ios:ext-safe must carry the SAME cocoa version.
sentry-kmp = "0.27.0"
sentry-cocoa = "8.58.2"
# Android (`docs/architecture.md`, "Zones inside the core": the allowed targets). One AGP for the KMP library plugin
# every multiplatform module's `android` target comes from and the application plugin `:app:android` applies.
agp = "9.3.3"
# minSdk 30 (Android 11), one level for the app AND its device tests: scoped storage is enforced (29 still let an app
# opt out) and `MediaStore.create*Request` batches consent, so the gallery adapters have one code path; and D8 writes
# the backtick test names' spaces only from DEX 040 (API 30), so the tests run at the level the app ships at. Android
# 10 was 4.6% of German Android traffic (StatCounter, Aug 2026; ≥30 reaches 85.6%), mostly 2018–19 phones past their
# security updates. targetSdk tracks Play's current requirement, compileSdk follows it.
android-minSdk = "30"
android-compileSdk = "36"
android-targetSdk = "36"
# The bytecode the Android compilations emit: D8/R8 dexes it (the toolchain stays `jdk`; only the target is lowered).
android-jvmTarget = "17"
androidx-activity = "1.12.4"
androidx-lifecycle = "2.10.0"
androidx-test-runner = "1.7.0"
# The Jetpack Compose release `compose` resolves to on Android — for the one androidx artifact named directly.
androidx-compose = "1.11.2"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
orbit-core = { module = "org.orbit-mvi:orbit-core", version.ref = "orbit" }
orbit-test = { module = "org.orbit-mvi:orbit-test", version.ref = "orbit" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# `Dispatchers.Main` on Android: the main looper, which the Android root composes on.
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-driver-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-dialect-sqlite = { module = "app.cash.sqldelight:sqlite-3-35-dialect", version.ref = "sqldelight" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
# Server side — `:test:rig` ONLY (the module exists to withhold these from everything else).
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
# The instrumentation runner the Android device tests (`commonTest` on the emulator) run under.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
# The empty activity Compose's `runComposeUiTest` launches on Android, merged into a device-test APK.
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
# The AGP API the convention plugins configure the `android` target through — compileOnly in `build-logic`.
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
sentry-kmp = { module = "io.sentry:sentry-kotlin-multiplatform", version.ref = "sentry-kmp" }

[plugins]
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
